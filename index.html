ring equal:", "options": {"A": "Feature distributions", "B": "Base rates across groups", "C": "False-positive rates only", "D": "True-positive rates across groups"}, "ans": "D", "exp": "Hardt, Price and Srebro, 2016."}, {"id": 734, "q": "The impossibility result in fairness research shows that:", "options": {"A": "Several common fairness criteria cannot be satisfied simultaneously when base rates differ", "B": "Bias can always be removed entirely", "C": "All fairness definitions can be satisfied at once", "D": "Fairness is easy to compute"}, "ans": "A", "exp": "Kleinberg, Mullainathan and Raghavan; Chouldechova, 2016–17."}, {"id": 735, "q": "Individual fairness holds that:", "options": {"A": "Similar individuals should receive similar predictions", "B": "Group averages are all that matter", "C": "Every individual should receive the same prediction", "D": "Fairness cannot be quantified"}, "ans": "A", "exp": "Dwork et al.'s \"fairness through awareness\"."}, {"id": 736, "q": "Fairness through unawareness — simply removing protected attributes — often fails because:", "options": {"A": "It always increases accuracy", "B": "It violates the chain rule", "C": "Other features act as proxies for the protected attribute", "D": "The model cannot train without them"}, "ans": "C", "exp": "Postcode, for instance, can proxy for race."}, {"id": 737, "q": "Pre-processing bias mitigation techniques operate on:", "options": {"A": "The model's internal weights during training", "B": "The predictions after the model runs", "C": "The training data before the model is fitted", "D": "The deployment hardware"}, "ans": "C", "exp": "Reweighting and resampling are examples."}, {"id": 738, "q": "In-processing bias mitigation techniques work by:", "options": {"A": "Editing the dataset only", "B": "Adding fairness constraints or penalties to the training objective", "C": "Adjusting the decision threshold afterwards", "D": "Retiring the model"}, "ans": "B", "exp": "Adversarial debiasing is a well-known instance."}, {"id": 739, "q": "Post-processing bias mitigation adjusts:", "options": {"A": "The loss function", "B": "The raw input features", "C": "The random seed", "D": "Model outputs or thresholds after training"}, "ans": "D", "exp": "Group-specific thresholds are the typical mechanism."}, {"id": 740, "q": "A confusion matrix disaggregated by demographic group is used to:", "options": {"A": "Reveal performance disparities hidden by aggregate accuracy", "B": "Speed up inference", "C": "Encrypt the predictions", "D": "Compress the model"}, "ans": "A", "exp": "Aggregate metrics can hide large per-group gaps."}, {"id": 741, "q": "Gender Shades (Buolamwini and Gebru, 2018) demonstrated disparities in:", "options": {"A": "Speech synthesis speed", "B": "Translation latency", "C": "Commercial facial analysis accuracy across skin tone and gender", "D": "Recommendation diversity"}, "ans": "C", "exp": "Error rates were far higher for darker-skinned women."}, {"id": 742, "q": "Differential privacy protects individuals by:", "options": {"A": "Adding calibrated noise so that any single record barely affects the output", "B": "Using a firewall", "C": "Encrypting the model weights", "D": "Deleting the training data after use"}, "ans": "A", "exp": "The privacy budget ε quantifies the guarantee."}, {"id": 743, "q": "Federated learning improves privacy by:", "options": {"A": "Uploading all raw data to one server", "B": "Training on decentralised devices and sharing only model updates", "C": "Publishing the training data openly", "D": "Removing the model from the pipeline"}, "ans": "B", "exp": "Raw data never leaves the device."}, {"id": 744, "q": "A membership inference attack attempts to determine whether:", "options": {"A": "A specific record was part of the model's training data", "B": "The model uses a GPU", "C": "The dataset is balanced", "D": "The model is overparameterised"}, "ans": "A", "exp": "Overfitted models are especially vulnerable."}, {"id": 745, "q": "Model inversion attacks aim to:", "options": {"A": "Convert a classifier into a regressor", "B": "Reverse the order of layers", "C": "Compress the model", "D": "Reconstruct sensitive training inputs from model outputs"}, "ans": "D", "exp": "A serious risk for models trained on faces or medical records."}, {"id": 746, "q": "The right to explanation is most closely associated with which regulation?", "options": {"A": "HIPAA", "B": "The Paris Agreement", "C": "The Sherman Antitrust Act", "D": "The EU General Data Protection Regulation (GDPR)"}, "ans": "D", "exp": "GDPR Article 22 concerns automated decision-making."}, {"id": 747, "q": "The EU AI Act classifies AI systems primarily by:", "options": {"A": "Programming language", "B": "Level of risk — unacceptable, high, limited and minimal", "C": "Country of origin", "D": "Number of parameters"}, "ans": "B", "exp": "Unacceptable-risk practices such as social scoring are prohibited."}, {"id": 748, "q": "Under a risk-based regulatory framework, AI used in recruitment or credit scoring is typically classed as:", "options": {"A": "High risk, requiring conformity assessment and oversight", "B": "Minimal risk", "C": "Exempt from regulation", "D": "Prohibited outright"}, "ans": "A", "exp": "These decisions materially affect people's life chances."}, {"id": 749, "q": "The NIST AI Risk Management Framework organises practice around which functions?", "options": {"A": "Train, Test, Ship", "B": "Encode, Decode, Deploy", "C": "Govern, Map, Measure and Manage", "D": "Plan, Do, Check, Act"}, "ans": "C", "exp": "Released in January 2023."}, {"id": 750, "q": "Human-in-the-loop design means that:", "options": {"A": "Humans label all inference outputs", "B": "The model trains without supervision", "C": "No automation is used", "D": "A person reviews or approves consequential automated decisions"}, "ans": "D", "exp": "Human-on-the-loop (monitoring) is the lighter-touch variant."}, {"id": 751, "q": "Automation bias describes the human tendency to:", "options": {"A": "Write biased code deliberately", "B": "Over-trust automated recommendations even when they are wrong", "C": "Reject all automated output", "D": "Prefer manual computation"}, "ans": "B", "exp": "It undermines the value of nominal human oversight."}, {"id": 752, "q": "The accountability gap in AI refers to difficulty in:", "options": {"A": "Measuring inference latency", "B": "Storing model checkpoints", "C": "Assigning responsibility when an autonomous system causes harm", "D": "Training on large datasets"}, "ans": "C", "exp": "Developers, deployers and users each hold partial responsibility."}, {"id": 753, "q": "Model cards, proposed by Mitchell et al., document:", "options": {"A": "The source code line by line", "B": "The marketing strategy", "C": "A model's intended use, performance across groups, and limitations", "D": "The GPU serial numbers"}, "ans": "C", "exp": "Datasheets for Datasets play the analogous role for data."}, {"id": 754, "q": "Informed consent is difficult in large-scale AI training because:", "options": {"A": "Data is always anonymous", "B": "Consent forms are illegal", "C": "Models cannot read consent text", "D": "Web-scraped data is collected without contacting the individuals involved"}, "ans": "D", "exp": "This is central to current disputes over training corpora."}, {"id": 755, "q": "Dual-use concern in AI means a system can be:", "options": {"A": "Trained twice", "B": "Deployed on two servers", "C": "Sold in two markets", "D": "Used for both beneficial and harmful purposes"}, "ans": "D", "exp": "Drug-discovery models repurposed for toxin design are a cited example."}, {"id": 756, "q": "Deepfakes raise ethical concern principally because they:", "options": {"A": "Are computationally slow", "B": "Enable convincing synthetic impersonation and disinformation", "C": "Cannot be shared online", "D": "Require large amounts of storage"}, "ans": "B", "exp": "Non-consensual imagery and election disinformation are the leading harms."}, {"id": 757, "q": "Content provenance standards such as C2PA aim to:", "options": {"A": "Ban all generative models", "B": "Compress video streams", "C": "Attach tamper-evident metadata recording how media was created", "D": "Encrypt every image file"}, "ans": "C", "exp": "Provenance complements, rather than replaces, detection."}, {"id": 758, "q": "Watermarking of AI-generated text works by:", "options": {"A": "Storing every generation on a server", "B": "Encrypting the prompt", "C": "Biasing token selection in a statistically detectable pattern", "D": "Adding a visible logo to every output"}, "ans": "C", "exp": "Robustness against paraphrasing remains an open problem."}, {"id": 759, "q": "Labour displacement concerns in AI ethics focus on:", "options": {"A": "Model file sizes", "B": "Compiler efficiency", "C": "The distributional effects of automation on workers and skills", "D": "Server electricity costs"}, "ans": "C", "exp": "Effects vary sharply by task, sector and bargaining power."}, {"id": 760, "q": "The environmental critique of large-model training centres on:", "options": {"A": "Noise pollution from offices", "B": "The cost of keyboards", "C": "Paper usage in laboratories", "D": "Energy consumption, carbon emissions and water use for cooling"}, "ans": "D", "exp": "Strubell et al. (2019) brought this into mainstream discussion."}, {"id": 761, "q": "Data colonialism critiques describe:", "options": {"A": "The extraction of data and cheap annotation labour from the Global South", "B": "Open-source licensing", "C": "Multilingual model training", "D": "Data centres located in cold climates"}, "ans": "A", "exp": "Content moderation and RLHF annotation work are frequently cited."}, {"id": 762, "q": "The value alignment problem asks how to ensure that AI systems:", "options": {"A": "Pursue objectives that genuinely reflect human values and intentions", "B": "Minimise memory usage", "C": "Run on standardised hardware", "D": "Use consistent variable names"}, "ans": "A", "exp": "Stuart Russell frames this as the core long-term safety challenge."}, {"id": 763, "q": "Instrumental convergence is the argument that capable agents with varied goals may all pursue:", "options": {"A": "Purely random actions", "B": "Similar sub-goals such as self-preservation and resource acquisition", "C": "Immediate shutdown", "D": "Identical final objectives"}, "ans": "B", "exp": "Bostrom's analysis in Superintelligence."}, {"id": 764, "q": "The paperclip maximiser thought experiment illustrates:", "options": {"A": "The danger of a competently pursued but poorly specified objective", "B": "A supervised learning benchmark", "C": "A network routing protocol", "D": "A hardware manufacturing bottleneck"}, "ans": "A", "exp": "Capability without correct specification is the hazard."}, {"id": 765, "q": "The corrigibility problem concerns designing agents that:", "options": {"A": "Never make errors", "B": "Run on any operating system", "C": "Accept correction and shutdown without resisting", "D": "Compress their own weights"}, "ans": "C", "exp": "A goal-directed agent has instrumental reason to avoid being switched off."}, {"id": 766, "q": "Anthropomorphism in AI ethics warns against:", "options": {"A": "Designing humanoid robot bodies", "B": "Attributing understanding, intent or feelings to statistical systems", "C": "Using human-readable code", "D": "Training on human language"}, "ans": "B", "exp": "It distorts both trust calibration and policy debate."}, {"id": 767, "q": "The ELIZA effect describes users':", "options": {"A": "Tendency to attribute genuine understanding to simple conversational programs", "B": "Refusal to use chatbots", "C": "Difficulty typing quickly", "D": "Preference for command-line interfaces"}, "ans": "A", "exp": "Observed by Weizenbaum with his 1966 program."}, {"id": 768, "q": "Sycophancy in language models refers to the tendency to:", "options": {"A": "Translate incorrectly", "B": "Produce very long outputs", "C": "Refuse all requests", "D": "Agree with the user's stated view rather than give an accurate answer"}, "ans": "D", "exp": "A known side-effect of optimising for human approval ratings."}, {"id": 769, "q": "Red teaming an AI system means:", "options": {"A": "Marking the codebase in red", "B": "Deliberately probing it for harmful or unsafe behaviour before release", "C": "Training on adversarial images only", "D": "Reviewing financial statements"}, "ans": "B", "exp": "Increasingly a regulatory expectation for frontier models."}, {"id": 770, "q": "Jailbreaking a language model refers to:", "options": {"A": "Fine-tuning it on new data", "B": "Reducing its parameter count", "C": "Running it on an unlocked phone", "D": "Crafting inputs that bypass its safety guidelines"}, "ans": "D", "exp": "Role-play framings and encoded instructions are common vectors."}, {"id": 771, "q": "Prompt injection is a security risk in which:", "options": {"A": "The prompt is too long", "B": "The model runs out of memory", "C": "Untrusted content in the model's input hijacks its instructions", "D": "The temperature is set too high"}, "ans": "C", "exp": "Especially dangerous for agents that browse or read documents."}, {"id": 772, "q": "Constitutional AI trains model behaviour using:", "options": {"A": "No feedback at all", "B": "Random human ratings only", "C": "An explicit set of written principles used to critique and revise outputs", "D": "A national constitution as training data"}, "ans": "C", "exp": "It reduces reliance on large volumes of human harm labels."}, {"id": 773, "q": "An AI system's transparency report typically discloses:", "options": {"A": "Training data provenance, evaluations, limitations and known risks", "B": "Employee salaries", "C": "Office locations", "D": "Server rack diagrams"}, "ans": "A", "exp": "Growing regulatory pressure has made these more standardised."}, {"id": 774, "q": "The precautionary principle applied to AI recommends:", "options": {"A": "Restraint in deploying systems whose harms are uncertain but potentially severe", "B": "Ignoring low-probability risks", "C": "Removing all safety testing", "D": "Deploying as fast as possible"}, "ans": "A", "exp": "Critics argue it can also entrench incumbents and stall benefits."}, {"id": 775, "q": "Meaningful human control over autonomous weapons requires that:", "options": {"A": "The software is open source", "B": "The weapon is remotely located", "C": "The system operates entirely without humans", "D": "Humans retain genuine judgement over targeting decisions, not just a nominal role"}, "ans": "D", "exp": "Central to the ongoing UN CCW debate on lethal autonomous systems. Part 21: Explainable AI, Safety & Robustness (Q776–815)"}, {"id": 776, "q": "Explainable AI (XAI) is chiefly concerned with:", "options": {"A": "Reducing training time", "B": "Increasing model accuracy above all else", "C": "Compressing model files", "D": "Making model behaviour understandable to humans"}, "ans": "D", "exp": "Explanations support trust, debugging, contestability and compliance."}, {"id": 777, "q": "A model is described as intrinsically interpretable when:", "options": {"A": "It cannot be explained at all", "B": "It has billions of parameters", "C": "It uses a black-box ensemble", "D": "Its structure is simple enough to inspect directly, like a shallow decision tree"}, "ans": "D", "exp": "Linear models, rule lists and small trees are the standard examples."}, {"id": 778, "q": "Post-hoc explanation methods are applied:", "options": {"A": "After a model is trained, to explain an existing black box", "B": "Instead of training a model", "C": "Before any data is collected", "D": "Only to linear models"}, "ans": "A", "exp": "LIME and SHAP are the best-known examples."}, {"id": 779, "q": "LIME explains an individual prediction by:", "options": {"A": "Retraining the full model from scratch", "B": "Fitting a simple local surrogate model around the instance", "C": "Removing all features permanently", "D": "Computing the exact Hessian"}, "ans": "B", "exp": "\"Local Interpretable Model-agnostic Explanations\", Ribeiro et al., 2016."}, {"id": 780, "q": "SHAP values are grounded in which theory?", "options": {"A": "Queueing theory", "B": "Graph theory", "C": "Cooperative game theory (Shapley values)", "D": "Information theory"}, "ans": "C", "exp": "They fairly distribute a prediction among the contributing features."}, {"id": 781, "q": "A key theoretical advantage of SHAP over LIME is that it:", "options": {"A": "Satisfies consistency and local accuracy axioms", "B": "Is always faster to compute", "C": "Works only on images", "D": "Needs no trained model"}, "ans": "A", "exp": "The axioms give the attributions a principled foundation."}, {"id": 782, "q": "Feature importance derived from permutation measures:", "options": {"A": "The number of times a feature appears in the data", "B": "The drop in performance when a feature's values are randomly shuffled", "C": "The gradient of the loss with respect to weights", "D": "The alphabetical rank of the feature"}, "ans": "B", "exp": "Model-agnostic, but misleading when features are correlated."}, {"id": 783, "q": "A partial dependence plot (PDP) shows:", "options": {"A": "The confusion matrix", "B": "The exact prediction for one individual", "C": "The average marginal effect of a feature on the prediction", "D": "The training loss curve"}, "ans": "C", "exp": "ICE plots show the per-instance version of the same idea."}, {"id": 784, "q": "Saliency maps in computer vision highlight:", "options": {"A": "The slowest layers", "B": "Input pixels whose change most affects the output", "C": "The largest weights in the network", "D": "The training batch order"}, "ans": "B", "exp": "Computed from gradients of the class score with respect to the input."}, {"id": 785, "q": "Grad-CAM produces explanations by:", "options": {"A": "Using only the raw pixel values", "B": "Weighting convolutional feature maps by gradient signal to localise evidence", "C": "Randomly masking the image", "D": "Deleting the final layer"}, "ans": "B", "exp": "It yields coarse but class-discriminative heat maps."}, {"id": 786, "q": "Attention weights are an imperfect explanation because:", "options": {"A": "High attention does not reliably imply causal importance", "B": "They only exist in CNNs", "C": "They cannot be computed", "D": "They are always zero"}, "ans": "A", "exp": "\"Attention is not explanation\" — Jain and Wallace, 2019."}, {"id": 787, "q": "A counterfactual explanation states:", "options": {"A": "The model's training time", "B": "The smallest change to the input that would flip the decision", "C": "The number of layers", "D": "The average prediction across the dataset"}, "ans": "B", "exp": "Highly actionable: \"your loan would be approved if income were £3k higher\"."}, {"id": 788, "q": "Anchors (Ribeiro et al.) explain predictions using:", "options": {"A": "High-precision IF-THEN rules that hold with a stated confidence", "B": "Continuous gradients", "C": "Cluster centroids", "D": "Reward functions"}, "ans": "A", "exp": "The rule \"anchors\" the prediction against changes in other features."}, {"id": 789, "q": "Concept Activation Vectors (TCAV) test whether:", "options": {"A": "The dataset is balanced", "B": "The GPU is saturated", "C": "A human-defined concept influences a model's predictions", "D": "Training has converged"}, "ans": "C", "exp": "It moves explanation from pixels to human-meaningful concepts."}, {"id": 790, "q": "Mechanistic interpretability differs from feature attribution by seeking:", "options": {"A": "Faster inference", "B": "Only input–output correlations", "C": "Smaller model files", "D": "To reverse-engineer the internal algorithms a network implements"}, "ans": "D", "exp": "Circuits, induction heads and features are its objects of study."}, {"id": 791, "q": "Superposition in neural networks refers to:", "options": {"A": "Networks representing more features than they have neurons, in overlapping directions", "B": "Overfitting the training set", "C": "Stacking two models sequentially", "D": "Adding noise to the input"}, "ans": "A", "exp": "It is a central obstacle to neuron-level interpretation."}, {"id": 792, "q": "Sparse autoencoders are used in interpretability research to:", "options": {"A": "Compress the training data", "B": "Generate adversarial examples", "C": "Decompose activations into sparse, more monosemantic features", "D": "Replace the optimiser"}, "ans": "C", "exp": "They aim to undo superposition."}, {"id": 793, "q": "The faithfulness of an explanation measures whether it:", "options": {"A": "Is short", "B": "Is easy for users to read", "C": "Is generated quickly", "D": "Accurately reflects the model's actual reasoning"}, "ans": "D", "exp": "Plausible-sounding explanations can be unfaithful."}, {"id": 794, "q": "An adversarial example is an input that:", "options": {"A": "Is missing from the dataset", "B": "Is duplicated in training", "C": "Is imperceptibly perturbed yet causes confident misclassification", "D": "Has no label"}, "ans": "C", "exp": "Szegedy et al. first described this in 2013."}, {"id": 795, "q": "The Fast Gradient Sign Method (FGSM) constructs adversarial examples by:", "options": {"A": "Cropping the image", "B": "Randomly shuffling pixels", "C": "Stepping in the direction of the sign of the loss gradient", "D": "Increasing the learning rate"}, "ans": "C", "exp": "Goodfellow et al., 2015 — a fast one-step attack."}, {"id": 796, "q": "Projected Gradient Descent (PGD) attacks are stronger than FGSM because they:", "options": {"A": "Use no gradients", "B": "Apply many small steps with projection back into the allowed perturbation ball", "C": "Require white-box access only", "D": "Modify the labels"}, "ans": "B", "exp": "PGD is often treated as the standard first-order adversary."}, {"id": 797, "q": "A black-box adversarial attack assumes the attacker:", "options": {"A": "Owns the model parameters", "B": "Has only query access to model outputs, not the weights", "C": "Controls the loss function", "D": "Can edit the training loop"}, "ans": "B", "exp": "Transferability makes such attacks practical."}, {"id": 798, "q": "Adversarial training defends a model by:", "options": {"A": "Removing the test set", "B": "Including adversarial examples in the training data", "C": "Reducing the number of classes", "D": "Increasing image resolution"}, "ans": "B", "exp": "It is the most reliable empirical defence, at some cost to clean accuracy."}, {"id": 799, "q": "Certified robustness differs from empirical defence by providing:", "options": {"A": "A provable guarantee within a bounded perturbation region", "B": "Better visual quality", "C": "Faster inference", "D": "Lower memory usage"}, "ans": "A", "exp": "Randomised smoothing is one practical certification route."}, {"id": 800, "q": "Data poisoning attacks compromise a model by:", "options": {"A": "Attacking only at inference time", "B": "Slowing the network", "C": "Reading the model weights", "D": "Injecting malicious samples into the training set"}, "ans": "D", "exp": "Especially dangerous with web-scraped or crowd-sourced data."}, {"id": 801, "q": "A backdoor (trojan) attack causes a model to:", "options": {"A": "Fail on all inputs", "B": "Leak its weights automatically", "C": "Refuse to train", "D": "Behave normally except when a specific trigger pattern is present"}, "ans": "D", "exp": "The trigger can be a small patch or watermark."}, {"id": 802, "q": "Model extraction (stealing) attacks aim to:", "options": {"A": "Physically remove the server", "B": "Slow down inference", "C": "Reconstruct a functional copy of a model through repeated queries", "D": "Delete the training data"}, "ans": "C", "exp": "Rate limiting and output perturbation are common mitigations."}, {"id": 803, "q": "Distribution shift occurs when:", "options": {"A": "Deployment data differs statistically from training data", "B": "The model is retrained", "C": "The batch size changes", "D": "Labels are balanced"}, "ans": "A", "exp": "Covariate, label and concept shift are the main varieties."}, {"id": 804, "q": "Concept drift specifically means that:", "options": {"A": "The relationship between inputs and labels changes over time", "B": "The data is reshuffled", "C": "The model file is corrupted", "D": "The features are renamed"}, "ans": "A", "exp": "Fraud patterns and user behaviour drift continually."}, {"id": 805, "q": "Out-of-distribution (OOD) detection aims to:", "options": {"A": "Improve training speed", "B": "Increase batch size", "C": "Flag inputs that are unlike anything in the training distribution", "D": "Compress the network"}, "ans": "C", "exp": "Essential for safe deployment in open-world settings."}, {"id": 806, "q": "A well-calibrated classifier is one whose:", "options": {"A": "Weights are all positive", "B": "Predicted probabilities match observed frequencies", "C": "Accuracy is 100%", "D": "Loss is exactly zero"}, "ans": "B", "exp": "Modern deep networks are typically overconfident."}, {"id": 807, "q": "Temperature scaling is a simple post-hoc method for:", "options": {"A": "Selecting features", "B": "Reducing parameter count", "C": "Augmenting the data", "D": "Calibrating predicted probabilities"}, "ans": "D", "exp": "A single scalar fitted on a validation set."}, {"id": 808, "q": "Expected Calibration Error (ECE) measures:", "options": {"A": "The inference latency", "B": "The training loss", "C": "The gap between confidence and accuracy across probability bins", "D": "The number of misclassified samples only"}, "ans": "C", "exp": "Lower ECE indicates better-calibrated confidence."}, {"id": 809, "q": "Aleatoric uncertainty refers to uncertainty that is:", "options": {"A": "Caused by insufficient training data", "B": "Inherent noise in the data, irreducible by more data", "C": "Always removable", "D": "A software bug"}, "ans": "B", "exp": "Epistemic uncertainty, by contrast, shrinks with more data."}, {"id": 810, "q": "Monte Carlo dropout estimates uncertainty by:", "options": {"A": "Training a second dataset", "B": "Keeping dropout active at inference and sampling multiple predictions", "C": "Increasing the learning rate", "D": "Removing dropout entirely"}, "ans": "B", "exp": "An inexpensive approximation to Bayesian inference."}, {"id": 811, "q": "Deep ensembles quantify uncertainty by:", "options": {"A": "Using one model with dropout only", "B": "Averaging the input features", "C": "Training several independently initialised models and comparing predictions", "D": "Reducing the network depth"}, "ans": "C", "exp": "A strong, if computationally costly, baseline."}, {"id": 812, "q": "Hallucination in a large language model refers to:", "options": {"A": "Slow generation", "B": "Repeating the prompt verbatim", "C": "Refusal to answer", "D": "Fluent output that is factually unsupported or fabricated"}, "ans": "D", "exp": "A consequence of next-token likelihood optimisation, not truth optimisation."}, {"id": 813, "q": "Retrieval-augmented generation reduces hallucination by:", "options": {"A": "Removing the tokeniser", "B": "Grounding generation in retrieved source documents", "C": "Shortening the context window", "D": "Increasing the temperature"}, "ans": "B", "exp": "Grounding also enables citation of sources."}, {"id": 814, "q": "A safety guardrail in a deployed AI system typically operates by:", "options": {"A": "Filtering or blocking inputs and outputs against a policy", "B": "Retraining the model on each request", "C": "Reducing the vocabulary", "D": "Encrypting the weights"}, "ans": "A", "exp": "Classifier-based filters sit alongside model-level alignment training."}, {"id": 815, "q": "Defence in depth for AI safety means:", "options": {"A": "Deploying only on private servers", "B": "Using a single very strong filter", "C": "Avoiding all evaluation", "D": "Layering multiple independent safeguards rather than relying on one"}, "ans": "D", "exp": "Alignment training, guardrails, monitoring and human oversight combined. Part 22: AI Applications Across Industry (Q816–865)"}, {"id": 816, "q": "Computer-aided diagnosis systems in radiology typically use which architecture family?", "options": {"A": "Linear regression", "B": "Decision stumps only", "C": "Naïve Bayes exclusively", "D": "Convolutional neural networks"}, "ans": "D", "exp": "CNNs and, increasingly, vision transformers dominate medical imaging."}, {"id": 817, "q": "In medical AI, high sensitivity is usually prioritised because:", "options": {"A": "Missing a true case (false negative) is generally more costly than a false alarm", "B": "Accuracy is irrelevant", "C": "False positives are more harmful", "D": "Specificity cannot be measured"}, "ans": "A", "exp": "Screening tools are tuned to catch disease, accepting recall follow-ups."}, {"id": 818, "q": "AlphaFold's major contribution was:", "options": {"A": "Sequencing the human genome", "B": "Designing new drugs directly", "C": "Predicting three-dimensional protein structure from amino-acid sequence", "D": "Synthesising new proteins in the laboratory"}, "ans": "C", "exp": "CASP14 in 2020 marked the breakthrough."}, {"id": 819, "q": "AI in drug discovery is most commonly applied to:", "options": {"A": "Hospital billing", "B": "Pharmacy shelf stocking", "C": "Virtual screening and candidate molecule generation", "D": "Manufacturing packaging"}, "ans": "C", "exp": "It compresses the early-stage search over chemical space."}, {"id": 820, "q": "A clinical decision support system should be validated on:", "options": {"A": "No data at all", "B": "External data from a different site or population", "C": "The training data only", "D": "Simulated data exclusively"}, "ans": "B", "exp": "Internal validation alone overstates real-world performance."}, {"id": 821, "q": "Fraud detection systems face which characteristic data problem?", "options": {"A": "Perfectly balanced classes", "B": "Only categorical features", "C": "No labelled data ever", "D": "Severe class imbalance, with very few positive cases"}, "ans": "D", "exp": "Precision–recall analysis is more informative than accuracy here."}, {"id": 822, "q": "Algorithmic trading systems use AI primarily for:", "options": {"A": "Signal generation, execution optimisation and risk modelling", "B": "Physical share certificate printing", "C": "Payroll processing", "D": "Office scheduling"}, "ans": "A", "exp": "Latency and regime shift are the dominant engineering constraints."}, {"id": 823, "q": "Credit scoring models face heightened regulatory scrutiny because they:", "options": {"A": "Make consequential decisions about individuals and must be explainable", "B": "Run on cloud servers", "C": "Use Python", "D": "Require large datasets"}, "ans": "A", "exp": "Adverse action notices require reasons for denial."}, {"id": 824, "q": "Anti-money-laundering AI systems mainly aim to reduce:", "options": {"A": "Transaction speed", "B": "The very high false-positive rate of rule-based alerting", "C": "Interest rates", "D": "Customer numbers"}, "ans": "B", "exp": "Traditional rules generate enormous manual review workloads."}, {"id": 825, "q": "Recommender systems using collaborative filtering predict preferences from:", "options": {"A": "Item text descriptions only", "B": "The user's age alone", "C": "Patterns in other similar users' behaviour", "D": "Random sampling"}, "ans": "C", "exp": "Content-based filtering instead uses item attributes."}, {"id": 826, "q": "The cold-start problem in recommender systems refers to difficulty with:", "options": {"A": "New users or items having no interaction history", "B": "Winter seasonality", "C": "Servers starting up slowly", "D": "Cold storage costs"}, "ans": "A", "exp": "Hybrid and content-based approaches mitigate it."}, {"id": 827, "q": "A filter bubble arises when a recommender:", "options": {"A": "Recommends only new items", "B": "Fails to load", "C": "Removes all personalisation", "D": "Progressively narrows the diversity of content a user is shown"}, "ans": "D", "exp": "Diversity and serendipity objectives are added to counteract it."}, {"id": 828, "q": "Demand forecasting in retail typically combines historical sales with:", "options": {"A": "Seasonality, promotions, price and external signals such as weather", "B": "Only the previous day's sales", "C": "Employee names", "D": "Store paint colour"}, "ans": "A", "exp": "Gradient boosting and temporal deep models are both widely used."}, {"id": 829, "q": "Dynamic pricing systems adjust prices based on:", "options": {"A": "A fixed annual schedule", "B": "Staff preference", "C": "Random numbers", "D": "Real-time demand, inventory, competitor prices and customer segments"}, "ans": "D", "exp": "Fairness and discrimination concerns arise with personalised pricing."}, {"id": 830, "q": "Predictive maintenance uses sensor data to:", "options": {"A": "Design new machines", "B": "Repair machines automatically", "C": "Schedule staff holidays", "D": "Forecast equipment failure before it happens"}, "ans": "D", "exp": "It reduces both unplanned downtime and unnecessary servicing."}, {"id": 831, "q": "Digital twins in manufacturing are:", "options": {"A": "Twin CPU cores", "B": "Backup copies of CAD files", "C": "Live virtual replicas of physical assets used for simulation and optimisation", "D": "Duplicate factories"}, "ans": "C", "exp": "They combine IoT telemetry with physics and learned models."}, {"id": 832, "q": "Computer vision in quality inspection is typically framed as:", "options": {"A": "Text summarisation", "B": "Anomaly detection or defect classification on production imagery", "C": "Route planning", "D": "Speech recognition"}, "ans": "B", "exp": "Defect scarcity often makes it an anomaly-detection problem."}, {"id": 833, "q": "Autonomous vehicle perception stacks fuse which sensors?", "options": {"A": "GPS only", "B": "Cameras, LiDAR, radar and ultrasonic sensors", "C": "Cameras only", "D": "Microphones only"}, "ans": "B", "exp": "Sensor fusion provides redundancy under varied conditions."}, {"id": 834, "q": "SAE Level 4 autonomy means the vehicle:", "options": {"A": "Drives itself fully within a defined operational design domain", "B": "Only assists with steering", "C": "Requires constant human supervision", "D": "Has no automation"}, "ans": "A", "exp": "Level 5 removes the domain restriction entirely."}, {"id": 835, "q": "Simultaneous Localisation and Mapping (SLAM) solves the problem of:", "options": {"A": "Building a map while tracking the robot's position within it", "B": "Scheduling deliveries", "C": "Compressing sensor data", "D": "Charging the battery"}, "ans": "A", "exp": "Fundamental to mobile robotics and AR."}, {"id": 836, "q": "Precision agriculture applies AI to:", "options": {"A": "Farm accounting only", "B": "Livestock naming", "C": "Weather creation", "D": "Yield prediction, disease detection and variable-rate input application"}, "ans": "D", "exp": "Satellite and drone imagery are common inputs."}, {"id": 837, "q": "AI-driven weather and climate models such as GraphCast differ from traditional NWP by:", "options": {"A": "Learning atmospheric dynamics from reanalysis data rather than solving equations directly", "B": "Being slower than physical models", "C": "Using no data at all", "D": "Ignoring initial conditions"}, "ans": "A", "exp": "They deliver comparable skill at a fraction of the compute."}, {"id": 838, "q": "Smart grid AI applications include:", "options": {"A": "Printing electricity bills", "B": "Manufacturing cables", "C": "Load forecasting, fault detection and renewable generation prediction", "D": "Painting substations"}, "ans": "C", "exp": "Intermittent renewables raise the value of accurate forecasting."}, {"id": 839, "q": "AI in education most commonly supports:", "options": {"A": "Cafeteria menus", "B": "Adaptive learning paths, automated feedback and early risk identification", "C": "Building construction", "D": "Bus manufacturing"}, "ans": "B", "exp": "Intelligent tutoring systems date back to the 1970s."}, {"id": 840, "q": "Knowledge tracing models estimate:", "options": {"A": "Textbook prices", "B": "The teacher's salary", "C": "Classroom temperature", "D": "A learner's evolving mastery of specific skills over time"}, "ans": "D", "exp": "Bayesian Knowledge Tracing and deep variants are standard."}, {"id": 841, "q": "AI in legal practice is most established in:", "options": {"A": "Building courthouses", "B": "Selecting juries", "C": "Delivering verdicts autonomously", "D": "E-discovery, contract review and case-law retrieval"}, "ans": "D", "exp": "Technology-assisted review is accepted in many jurisdictions."}, {"id": 842, "q": "Hallucinated case citations from language models became a legal issue because:", "options": {"A": "Courts banned computers", "B": "Fabricated authorities were filed in real court submissions", "C": "Citations are unnecessary", "D": "Judges cannot read"}, "ans": "B", "exp": "Several sanctioned filings since 2023 illustrate the risk."}, {"id": 843, "q": "AI in cybersecurity is widely applied to:", "options": {"A": "Office lighting", "B": "Intrusion detection, malware classification and anomalous behaviour analysis", "C": "Physical door locks only", "D": "Cable management"}, "ans": "B", "exp": "Adversaries adapt, so models require continuous retraining."}, {"id": 844, "q": "A user and entity behaviour analytics (UEBA) system detects threats by:", "options": {"A": "Modelling normal behaviour and flagging deviations", "B": "Blocking all traffic", "C": "Matching known signatures only", "D": "Encrypting disks"}, "ans": "A", "exp": "Effective against insider threats and novel attacks."}, {"id": 845, "q": "AI applied to supply chain management typically optimises:", "options": {"A": "Company logos", "B": "Product colour schemes", "C": "Office seating", "D": "Inventory levels, routing and supplier risk"}, "ans": "D", "exp": "Disruption forecasting became prominent after 2020."}, {"id": 846, "q": "The vehicle routing problem is computationally hard because:", "options": {"A": "Vehicles are slow", "B": "The number of possible routes grows combinatorially with stops", "C": "Roads change daily", "D": "Fuel is expensive"}, "ans": "B", "exp": "Metaheuristics and learned heuristics are used in practice."}, {"id": 847, "q": "AI in human resources raises particular legal risk in:", "options": {"A": "Managing parking", "B": "Booking meeting rooms", "C": "Automated CV screening and candidate ranking", "D": "Ordering office supplies"}, "ans": "C", "exp": "NYC Local Law 144 requires bias audits of automated employment tools."}, {"id": 848, "q": "Sentiment analysis in customer analytics classifies text by:", "options": {"A": "Word count only", "B": "Publication date", "C": "Expressed polarity or emotional tone", "D": "Font size"}, "ans": "C", "exp": "Aspect-based variants attribute sentiment to specific product features."}, {"id": 849, "q": "Churn prediction models aim to identify customers who are:", "options": {"A": "Newest to the platform", "B": "Located furthest away", "C": "Likely to stop using the service", "D": "Most profitable historically"}, "ans": "C", "exp": "Value comes from acting on the prediction with retention offers."}, {"id": 850, "q": "Conversational AI in customer service is most reliably deployed for:", "options": {"A": "Emergency dispatch alone", "B": "High-volume, well-defined queries with escalation paths to humans", "C": "Complex legal disputes", "D": "Medical diagnosis"}, "ans": "B", "exp": "Clear handoff design determines user satisfaction."}, {"id": 851, "q": "AI in game development is used for:", "options": {"A": "Retail distribution", "B": "Packaging design", "C": "Manufacturing consoles", "D": "NPC behaviour, procedural content generation and playtesting"}, "ans": "D", "exp": "Behaviour trees remain the workhorse for NPC control."}, {"id": 852, "q": "Procedural content generation via machine learning (PCGML) creates:", "options": {"A": "Marketing copy only", "B": "Network protocols", "C": "Hardware drivers", "D": "Game levels or assets learned from existing examples"}, "ans": "D", "exp": "Controllability and playability validation are the key challenges."}, {"id": 853, "q": "AI in journalism is most commonly applied to:", "options": {"A": "Photography equipment repair", "B": "Editorial judgement", "C": "Investigative interviewing", "D": "Automated reporting of structured data such as sports and earnings"}, "ans": "D", "exp": "Template and generative approaches both see production use."}, {"id": 854, "q": "Machine translation quality is commonly evaluated using:", "options": {"A": "Rendering speed", "B": "BLEU, chrF or COMET scores against reference translations", "C": "Font compatibility", "D": "File size"}, "ans": "B", "exp": "Learned metrics such as COMET correlate better with human judgement."}, {"id": 855, "q": "AI-based accessibility tools include:", "options": {"A": "Real-time captioning, image alt-text generation and screen description", "B": "Louder speakers only", "C": "Thicker keyboards", "D": "Larger monitors only"}, "ans": "A", "exp": "Speech and vision models underpin most assistive features."}, {"id": 856, "q": "AI in urban planning supports:", "options": {"A": "Choosing street names", "B": "Painting buildings", "C": "Traffic flow optimisation, land-use analysis and infrastructure siting", "D": "Selling property"}, "ans": "C", "exp": "Equity of outcomes is a recurring evaluation concern."}, {"id": 857, "q": "Conservation applications of AI include:", "options": {"A": "Constructing zoos", "B": "Naming animals", "C": "Species identification from camera traps and acoustic monitoring", "D": "Selling timber"}, "ans": "C", "exp": "It makes continuous monitoring feasible at ecological scale."}, {"id": 858, "q": "AI-assisted materials discovery works by:", "options": {"A": "Mining ore automatically", "B": "Marketing products", "C": "Packaging materials", "D": "Predicting properties of candidate compounds to prioritise synthesis"}, "ans": "D", "exp": "GNoME and similar systems expanded known stable structures substantially."}, {"id": 859, "q": "In telecommunications, AI is used for:", "options": {"A": "Network optimisation, anomaly detection and capacity planning", "B": "Retail store design", "C": "Manufacturing handsets", "D": "Billing paper selection"}, "ans": "A", "exp": "Self-organising networks adapt parameters automatically."}, {"id": 860, "q": "Robotic process automation (RPA) differs from AI in that it:", "options": {"A": "Requires no configuration", "B": "Always uses deep learning", "C": "Follows scripted deterministic rules rather than learning from data", "D": "Cannot be combined with AI"}, "ans": "C", "exp": "\"Intelligent automation\" describes RPA augmented with ML components."}, {"id": 861, "q": "Optical character recognition combined with document AI enables:", "options": {"A": "Extraction of structured fields from invoices, forms and receipts", "B": "Better paper quality", "C": "Faster printing", "D": "Cheaper scanners"}, "ans": "A", "exp": "Layout-aware transformers markedly improved this task."}, {"id": 862, "q": "AI-based translation of low-resource languages is difficult primarily because of:", "options": {"A": "Scarce parallel corpora", "B": "Small alphabets", "C": "Simple grammar", "D": "Excessive computing power"}, "ans": "A", "exp": "Transfer learning and multilingual pretraining help partially."}, {"id": 863, "q": "A production ML system's business value should ultimately be measured by:", "options": {"A": "Model size", "B": "The downstream outcome metric it was deployed to improve", "C": "Number of features", "D": "Validation accuracy alone"}, "ans": "B", "exp": "Offline metric gains often fail to translate into online impact."}, {"id": 864, "q": "A/B testing a deployed model measures:", "options": {"A": "Data schema validity", "B": "Causal effect of the new model against a control on live traffic", "C": "GPU utilisation", "D": "Training convergence"}, "ans": "B", "exp": "Randomised assignment is what makes the comparison causal."}, {"id": 865, "q": "Shadow deployment of a model means:", "options": {"A": "Running it only at night", "B": "Deploying it secretly to customers", "C": "Running it on live traffic without acting on its outputs, to compare behaviour", "D": "Hiding the source code"}, "ans": "C", "exp": "A low-risk way to validate before a live cutover. Part 23: Data Engineering, MLOps & Deployment (Q866–915)"}, {"id": 866, "q": "MLOps is best described as:", "options": {"A": "The practices and tooling for reliably building, deploying and maintaining ML systems", "B": "A neural network architecture", "C": "A programming language", "D": "A type of optimiser"}, "ans": "A", "exp": "It applies DevOps discipline to the data and model lifecycle."}, {"id": 867, "q": "Technical debt in ML systems is characteristically worse than in ordinary software because:", "options": {"A": "Code is always shorter", "B": "Testing is trivial", "C": "Data dependencies and feedback loops create hidden coupling", "D": "Models never change"}, "ans": "C", "exp": "Sculley et al., \"Hidden Technical Debt in Machine Learning Systems\", 2015."}, {"id": 868, "q": "The CACE principle in ML systems states that:", "options": {"A": "Caching Always Costs Efficiency", "B": "Class Accuracy Cannot Exceed…", "C": "Changing Anything Changes Everything", "D": "Clean Architecture Creates Errors"}, "ans": "C", "exp": "No input to a model is ever truly independent of the others."}, {"id": 869, "q": "A feature store exists primarily to:", "options": {"A": "Host the trained model binaries", "B": "Replace the database", "C": "Store raw images only", "D": "Serve consistent feature definitions to both training and inference"}, "ans": "D", "exp": "It is the standard remedy for training–serving skew."}, {"id": 870, "q": "Training–serving skew occurs when:", "options": {"A": "Training takes too long", "B": "Features are computed differently in production than in training", "C": "The model is too large", "D": "Labels are missing"}, "ans": "B", "exp": "A leading cause of silent production degradation."}, {"id": 871, "q": "Data leakage in model development means:", "options": {"A": "Data was stolen by an attacker", "B": "Information unavailable at prediction time influenced training", "C": "The disk ran out of space", "D": "Rows were duplicated"}, "ans": "B", "exp": "It produces impressive offline scores that collapse in production."}, {"id": 872, "q": "Target leakage specifically occurs when a feature:", "options": {"A": "Is normalised", "B": "Is categorical", "C": "Has missing values", "D": "Is a proxy for, or derived from, the label itself"}, "ans": "D", "exp": "For example, including \"treatment prescribed\" when predicting diagnosis."}, {"id": 873, "q": "For time-series data, the correct validation strategy is:", "options": {"A": "Leave-one-out on shuffled rows", "B": "Forward-chaining splits that respect chronological order", "C": "Stratified sampling by label", "D": "Random k-fold shuffling"}, "ans": "B", "exp": "Random shuffling lets the model see the future."}, {"id": 874, "q": "A data pipeline's idempotency property means:", "options": {"A": "Re-running it with the same input produces the same result without side effects", "B": "It requires manual triggering", "C": "It cannot be scheduled", "D": "It runs only once ever"}, "ans": "A", "exp": "Essential for safe retries and backfills."}, {"id": 875, "q": "ETL differs from ELT in that ETL:", "options": {"A": "Transforms data before loading it into the warehouse", "B": "Only applies to images", "C": "Never transforms data", "D": "Loads before extracting"}, "ans": "A", "exp": "ELT defers transformation to the warehouse's compute."}, {"id": 876, "q": "A data lake differs from a data warehouse by storing:", "options": {"A": "Only relational data with a fixed schema", "B": "Nothing persistent", "C": "Only aggregated tables", "D": "Raw data in its native format, schema applied on read"}, "ans": "D", "exp": "A lakehouse blends both models."}, {"id": 877, "q": "Data versioning tools such as DVC exist because:", "options": {"A": "Git handles large binaries natively", "B": "Data never changes", "C": "Reproducing a model requires knowing exactly which data produced it", "D": "Models are stateless"}, "ans": "C", "exp": "Code version alone does not determine model behaviour."}, {"id": 878, "q": "An experiment tracking system records:", "options": {"A": "Only the final model file", "B": "Parameters, metrics, artefacts and code versions for each training run", "C": "Team meeting notes", "D": "Server temperature"}, "ans": "B", "exp": "MLflow and Weights & Biases are common choices."}, {"id": 879, "q": "Model registry functionality provides:", "options": {"A": "Feature computation", "B": "Compute scheduling", "C": "Data labelling", "D": "Versioned model storage with stage transitions and lineage"}, "ans": "D", "exp": "It gates promotion from staging to production."}, {"id": 880, "q": "Continuous training (CT) in MLOps refers to:", "options": {"A": "Automatically retraining models on fresh data as it arrives", "B": "Training only on the first batch", "C": "Training one model forever without stopping", "D": "Manual annual retraining"}, "ans": "A", "exp": "It is the ML-specific addition to CI/CD."}, {"id": 881, "q": "A canary deployment releases a new model to:", "options": {"A": "No users at all", "B": "All users simultaneously", "C": "A small fraction of traffic first, expanding if metrics hold", "D": "Only internal test accounts forever"}, "ans": "C", "exp": "It limits blast radius if the new model regresses."}, {"id": 882, "q": "A blue-green deployment strategy maintains:", "options": {"A": "Two teams", "B": "Two full environments, switching traffic between them", "C": "A single environment updated in place", "D": "Two datasets only"}, "ans": "B", "exp": "Rollback is a traffic switch rather than a redeploy."}, {"id": 883, "q": "Model monitoring in production should track:", "options": {"A": "Training loss only", "B": "Team velocity", "C": "Input drift, prediction distribution, latency and downstream outcome metrics", "D": "Source code style"}, "ans": "C", "exp": "Accuracy is often unavailable in real time because labels lag."}, {"id": 884, "q": "The Population Stability Index (PSI) is used to detect:", "options": {"A": "Memory leaks", "B": "Code complexity", "C": "Shift in a feature's distribution between two time periods", "D": "Model overfitting during training"}, "ans": "C", "exp": "PSI above roughly 0.2 conventionally signals significant shift."}, {"id": 885, "q": "Delayed ground truth is a monitoring challenge because:", "options": {"A": "Labels arrive long after predictions, so accuracy cannot be measured immediately", "B": "Predictions are never stored", "C": "Latency is too low", "D": "Models produce no output"}, "ans": "A", "exp": "Proxy metrics and drift detection fill the gap."}, {"id": 886, "q": "Shadow mode and champion–challenger setups both:", "options": {"A": "Skip evaluation entirely", "B": "Delete the old model immediately", "C": "Evaluate a new model against the incumbent before switching", "D": "Only apply to data pipelines"}, "ans": "C", "exp": "Champion–challenger typically routes live traffic to both."}, {"id": 887, "q": "Model quantisation reduces model size by:", "options": {"A": "Retraining from scratch", "B": "Removing layers entirely", "C": "Compressing the training data", "D": "Representing weights with lower-precision numeric types"}, "ans": "D", "exp": "INT8 and 4-bit quantisation are common for LLM serving."}, {"id": 888, "q": "Post-training quantisation differs from quantisation-aware training by:", "options": {"A": "Being applied after training without simulating quantisation during it", "B": "Increasing model size", "C": "Requiring more epochs", "D": "Only working on CPUs"}, "ans": "A", "exp": "QAT usually preserves more accuracy at low bit widths."}, {"id": 889, "q": "Knowledge distillation trains a small student model to:", "options": {"A": "Increase the parameter count", "B": "Match the outputs (soft targets) of a larger teacher model", "C": "Memorise the test set", "D": "Replace the optimiser"}, "ans": "B", "exp": "Hinton et al., 2015."}, {"id": 890, "q": "Network pruning improves efficiency by:", "options": {"A": "Duplicating layers", "B": "Removing weights or structures that contribute little to the output", "C": "Adding more neurons", "D": "Increasing the learning rate"}, "ans": "B", "exp": "Structured pruning yields real hardware speedups; unstructured often does not."}, {"id": 891, "q": "The Lottery Ticket Hypothesis proposes that:", "options": {"A": "Dense networks contain sparse subnetworks that train to comparable accuracy", "B": "Pruning always fails", "C": "All weights are equally important", "D": "Training is purely random"}, "ans": "A", "exp": "Frankle and Carbin, 2019."}, {"id": 892, "q": "ONNX exists to provide:", "options": {"A": "A GPU driver", "B": "An interoperable format for exchanging models between frameworks", "C": "A labelling tool", "D": "A dataset repository"}, "ans": "B", "exp": "It decouples training framework from serving runtime."}, {"id": 893, "q": "Batch inference differs from online inference by:", "options": {"A": "Scoring large sets of records offline on a schedule", "B": "Being restricted to images", "C": "Never using a trained model", "D": "Requiring millisecond latency"}, "ans": "A", "exp": "It suits use cases where predictions need not be instant."}, {"id": 894, "q": "Dynamic batching in a model server:", "options": {"A": "Removes the queue entirely", "B": "Splits each request into smaller ones", "C": "Groups concurrent requests to improve GPU utilisation", "D": "Disables parallelism"}, "ans": "C", "exp": "It trades a little latency for substantially more throughput."}, {"id": 895, "q": "KV caching in transformer inference speeds up generation by:", "options": {"A": "Storing the gradients", "B": "Caching the training data", "C": "Compressing the vocabulary", "D": "Reusing previously computed key and value tensors across decoding steps"}, "ans": "D", "exp": "It converts quadratic recomputation into incremental work."}, {"id": 896, "q": "Model serving latency is usually reported at percentiles such as p95 or p99 because:", "options": {"A": "Averages are always higher", "B": "Percentiles are cheaper to log", "C": "The mean is impossible to compute", "D": "Tail latency determines the experience of the worst-affected requests"}, "ans": "D", "exp": "A good mean can hide an unacceptable tail."}, {"id": 897, "q": "Edge deployment of models is chosen primarily for:", "options": {"A": "Easier model updates", "B": "Unlimited compute", "C": "Higher power budgets", "D": "Low latency, offline operation and data privacy"}, "ans": "D", "exp": "Constraints are memory, power and thermal limits."}, {"id": 898, "q": "TinyML refers to running ML on:", "options": {"A": "Data centre GPU clusters", "B": "Mainframes", "C": "Quantum computers", "D": "Microcontrollers with kilobytes of memory"}, "ans": "D", "exp": "Typically quantised, heavily pruned models."}, {"id": 899, "q": "A GPU is preferred over a CPU for deep learning because it provides:", "options": {"A": "Better networking", "B": "Massive parallelism for matrix and tensor operations", "C": "Higher single-thread clock speed", "D": "More disk storage"}, "ans": "B", "exp": "Throughput on parallel arithmetic, not sequential speed."}, {"id": 900, "q": "A TPU is best described as:", "options": {"A": "An application-specific accelerator designed for tensor operations", "B": "A networking switch", "C": "A storage device", "D": "A general-purpose CPU"}, "ans": "A", "exp": "Google introduced them for large-scale neural network workloads."}, {"id": 901, "q": "Mixed-precision training uses lower-precision arithmetic to:", "options": {"A": "Reduce the dataset size", "B": "Increase numerical error deliberately", "C": "Speed up training and reduce memory while keeping master weights in higher precision", "D": "Simplify the architecture"}, "ans": "C", "exp": "Loss scaling prevents gradient underflow in FP16."}, {"id": 902, "q": "Gradient accumulation allows training with:", "options": {"A": "An effectively larger batch size than fits in memory", "B": "A smaller learning rate only", "C": "No gradients at all", "D": "Fewer parameters"}, "ans": "A", "exp": "Gradients are summed across micro-batches before the update."}, {"id": 903, "q": "Data parallelism distributes training by:", "options": {"A": "Splitting the model layers across devices", "B": "Using one device only", "C": "Removing synchronisation", "D": "Replicating the model and splitting the batch across devices"}, "ans": "D", "exp": "Gradients are all-reduced across replicas each step."}, {"id": 904, "q": "Model parallelism is required when:", "options": {"A": "The dataset is small", "B": "The batch size is one", "C": "Training is complete", "D": "The model itself does not fit in a single device's memory"}, "ans": "D", "exp": "Tensor and pipeline parallelism are the two main forms."}, {"id": 905, "q": "Checkpointing during long training runs primarily provides:", "options": {"A": "Faster convergence", "B": "Higher accuracy", "C": "Recovery from failure without losing all progress", "D": "Smaller models"}, "ans": "C", "exp": "Essential for multi-day distributed runs."}, {"id": 906, "q": "Gradient checkpointing (activation recomputation) trades:", "options": {"A": "Data for labels", "B": "Memory for accuracy", "C": "Extra compute for reduced memory usage", "D": "Accuracy for speed"}, "ans": "C", "exp": "Activations are recomputed during the backward pass."}, {"id": 907, "q": "LoRA (Low-Rank Adaptation) fine-tunes a model by:", "options": {"A": "Retraining every parameter", "B": "Training small low-rank matrices while freezing the base weights", "C": "Removing layers", "D": "Changing the tokeniser"}, "ans": "B", "exp": "Drastically reduces trainable parameters and checkpoint size."}, {"id": 908, "q": "Parameter-efficient fine-tuning is attractive because it:", "options": {"A": "Adapts large models cheaply and allows many task-specific adapters", "B": "Eliminates the need for data", "C": "Requires more GPUs than full fine-tuning", "D": "Increases base model size"}, "ans": "A", "exp": "One base model can serve many specialised variants."}, {"id": 909, "q": "A vector database is used in AI systems to:", "options": {"A": "Store relational transactions", "B": "Schedule jobs", "C": "Compile models", "D": "Store embeddings and perform approximate nearest-neighbour search"}, "ans": "D", "exp": "The retrieval backbone of RAG systems."}, {"id": 910, "q": "HNSW is an indexing algorithm that provides:", "options": {"A": "Exact brute-force search only", "B": "Fast approximate nearest-neighbour search via a navigable small-world graph", "C": "Lossless data compression", "D": "Query language parsing"}, "ans": "B", "exp": "It trades a small recall loss for large speed gains."}, {"id": 911, "q": "Chunking strategy matters in RAG systems because it determines:", "options": {"A": "The GPU model used", "B": "Whether retrieved passages contain coherent, sufficient context", "C": "The programming language", "D": "The number of layers"}, "ans": "B", "exp": "Overlapping and semantic chunking mitigate boundary loss."}, {"id": 912, "q": "Reranking in a retrieval pipeline:", "options": {"A": "Removes the retriever", "B": "Compresses embeddings", "C": "Re-scores candidate passages with a stronger cross-encoder model", "D": "Randomly shuffles results"}, "ans": "C", "exp": "A cheap retriever plus an accurate reranker is the standard two-stage design."}, {"id": 913, "q": "An LLM-as-judge evaluation approach uses a model to:", "options": {"A": "Score outputs against a rubric in place of costly human raters", "B": "Serve production traffic", "C": "Label the raw dataset only", "D": "Train the target model"}, "ans": "A", "exp": "Known biases include position and verbosity preference."}, {"id": 914, "q": "A golden dataset in evaluation practice is:", "options": {"A": "A curated, stable, human-verified set used to track regressions over time", "B": "The largest available dataset", "C": "The raw production log", "D": "Synthetic data only"}, "ans": "A", "exp": "Stability is what makes cross-version comparison meaningful."}, {"id": 915, "q": "Reproducibility of an ML result requires recording:", "options": {"A": "The author's name", "B": "The GPU temperature", "C": "Only the final accuracy", "D": "Data version, code version, hyperparameters, environment and random seeds"}, "ans": "D", "exp": "Missing any one of these can make a result impossible to recreate. Part 24: Emerging Frontiers — Edge, Quantum, Neuromorphic & AGI (Q916–950)"}, {"id": 916, "q": "Neuromorphic computing aims to build hardware that:", "options": {"A": "Replaces all software with firmware", "B": "Runs standard matrix multiplications faster", "C": "Stores data on tape", "D": "Mimics the event-driven, spiking behaviour of biological neurons"}, "ans": "D", "exp": "IBM's TrueNorth and Intel's Loihi are leading examples."}, {"id": 917, "q": "Spiking neural networks differ from conventional ANNs by communicating with:", "options": {"A": "SQL queries", "B": "Discrete spikes over time rather than continuous activation values", "C": "Text tokens", "D": "Floating-point matrices only"}, "ans": "B", "exp": "Temporal coding makes them extremely energy-efficient in principle."}, {"id": 918, "q": "The main obstacle to training spiking neural networks is that:", "options": {"A": "No hardware exists", "B": "They have too few parameters", "C": "They cannot represent images", "D": "The spiking non-linearity is non-differentiable, so standard backpropagation does not apply"}, "ans": "D", "exp": "Surrogate gradients are the usual workaround."}, {"id": 919, "q": "In-memory (analogue) computing reduces energy use by:", "options": {"A": "Using larger cooling systems", "B": "Adding more DRAM", "C": "Performing computation where the data is stored, avoiding data movement", "D": "Increasing clock speed"}, "ans": "C", "exp": "The von Neumann bottleneck is the cost being avoided."}, {"id": 920, "q": "Memristors are of interest for AI hardware because they can:", "options": {"A": "Generate electricity", "B": "Store weights and perform multiply-accumulate operations in the same device", "C": "Encrypt data natively", "D": "Replace software compilers"}, "ans": "B", "exp": "Device variability remains the practical barrier."}, {"id": 921, "q": "Quantum machine learning explores using quantum systems to:", "options": {"A": "Store larger datasets", "B": "Write documentation", "C": "Represent and process information in ways classical computers cannot efficiently match", "D": "Cool GPUs more effectively"}, "ans": "C", "exp": "Practical advantage on real ML tasks is still unproven."}, {"id": 922, "q": "A qubit differs from a classical bit because it can:", "options": {"A": "Exist in a superposition of 0 and 1 states", "B": "Run faster clock cycles", "C": "Store more bytes", "D": "Never lose information"}, "ans": "A", "exp": "Measurement collapses it to a definite value."}, {"id": 923, "q": "Quantum entanglement is significant for computation because:", "options": {"A": "It stores classical bits", "B": "Correlated qubits allow joint states that cannot be described independently", "C": "It transmits information faster than light", "D": "It removes all noise"}, "ans": "B", "exp": "No-signalling still holds; entanglement alone sends no message."}, {"id": 924, "q": "Decoherence is the principal engineering challenge in quantum computing because it:", "options": {"A": "Increases qubit count uncontrollably", "B": "Simplifies error correction", "C": "Destroys fragile quantum states through environmental interaction", "D": "Makes qubits too fast"}, "ans": "C", "exp": "Error correction requires many physical qubits per logical qubit."}, {"id": 925, "q": "A variational quantum circuit in QML is:", "options": {"A": "A random number generator", "B": "A purely classical neural network", "C": "A parameterised quantum circuit optimised by a classical loop", "D": "A data storage format"}, "ans": "C", "exp": "The hybrid quantum–classical pattern of NISQ-era algorithms."}, {"id": 926, "q": "Grover's algorithm offers what speedup for unstructured search?", "options": {"A": "Exponential", "B": "Quadratic", "C": "None", "D": "Logarithmic slowdown"}, "ans": "B", "exp": "O(√N) versus O(N) classically."}, {"id": 927, "q": "Federated learning at the edge is attractive because it:", "options": {"A": "Requires uploading all data centrally", "B": "Eliminates communication entirely", "C": "Removes the need for a model", "D": "Keeps raw data on-device while still improving a shared model"}, "ans": "D", "exp": "Communication cost and client heterogeneity are the main difficulties."}, {"id": 928, "q": "Split computing divides a neural network between:", "options": {"A": "An edge device and a server, transmitting intermediate activations", "B": "Two identical servers", "C": "Training and testing phases", "D": "Two datasets"}, "ans": "A", "exp": "It balances device compute against network bandwidth."}, {"id": 929, "q": "Foundation models are characterised by being:", "options": {"A": "Trained on broad data at scale and adaptable to many downstream tasks", "B": "Purely rule-based", "C": "Designed for exactly one narrow task", "D": "Always under one million parameters"}, "ans": "A", "exp": "The term was introduced by Stanford's CRFM in 2021."}, {"id": 930, "q": "Emergent abilities in large models describe capabilities that:", "options": {"A": "Appear only beyond a certain scale and are hard to predict from smaller models", "B": "Exist equally at all model sizes", "C": "Disappear with more data", "D": "Are programmed explicitly"}, "ans": "A", "exp": "Whether they are genuinely discontinuous or a metric artefact is debated."}, {"id": 931, "q": "Neural scaling laws describe:", "options": {"A": "The physical size of data centres", "B": "The number of employees needed", "C": "Hardware pricing trends", "D": "Predictable power-law improvements in loss with model size, data and compute"}, "ans": "D", "exp": "Kaplan et al. (2020) and Hoffmann et al. (2022, \"Chinchilla\")."}, {"id": 932, "q": "The Chinchilla result argued that many large models were:", "options": {"A": "Far too small", "B": "Undertrained on data relative to their parameter count", "C": "Trained on too much data", "D": "Perfectly compute-optimal"}, "ans": "B", "exp": "It shifted practice toward more tokens per parameter."}, {"id": 933, "q": "Mixture-of-Experts architectures increase capacity efficiently by:", "options": {"A": "Removing the attention mechanism", "B": "Reducing the vocabulary", "C": "Routing each token to a small subset of expert subnetworks", "D": "Running every parameter for every token"}, "ans": "C", "exp": "Total parameters grow while active parameters per token stay bounded."}, {"id": 934, "q": "Multimodal models process:", "options": {"A": "Only text in several languages", "B": "Only images", "C": "Only structured tables", "D": "Multiple input types such as text, images and audio in a shared representation"}, "ans": "D", "exp": "Contrastive pretraining (as in CLIP) is one common alignment route."}, {"id": 935, "q": "An AI agent, as distinct from a chatbot, is characterised by:", "options": {"A": "Using a larger vocabulary", "B": "Planning multi-step actions and using tools to affect an environment", "C": "Producing longer responses", "D": "Running on more GPUs"}, "ans": "B", "exp": "Tool use, memory and feedback loops are the defining components."}, {"id": 936, "q": "The ReAct pattern in agent design interleaves:", "options": {"A": "Encoding and decoding", "B": "Reasoning traces with actions and observations", "C": "Training and evaluation", "D": "Retrieval and compression"}, "ans": "B", "exp": "Yao et al., 2022."}, {"id": 937, "q": "The Model Context Protocol (MCP) standardises:", "options": {"A": "How AI applications connect to external tools and data sources", "B": "Neural network weight formats", "C": "Image compression", "D": "GPU driver interfaces"}, "ans": "A", "exp": "It reduces bespoke integration work across tools."}, {"id": 938, "q": "Chain-of-thought prompting improves reasoning by:", "options": {"A": "Eliciting intermediate steps before the final answer", "B": "Lowering the temperature to zero", "C": "Shortening the prompt", "D": "Removing examples"}, "ans": "A", "exp": "Gains are most pronounced in sufficiently large models."}, {"id": 939, "q": "Self-consistency decoding improves accuracy by:", "options": {"A": "Skipping reasoning steps", "B": "Sampling several reasoning paths and taking the majority answer", "C": "Truncating the output", "D": "Generating one deterministic output"}, "ans": "B", "exp": "It marginalises over reasoning paths rather than trusting one."}, {"id": 940, "q": "Test-time compute scaling refers to:", "options": {"A": "Increasing dataset size", "B": "Buying more training GPUs", "C": "Spending more inference computation on harder problems to improve answers", "D": "Reducing model parameters"}, "ans": "C", "exp": "Extended reasoning traces at inference are the current expression of this."}, {"id": 941, "q": "World models in AI research are systems that:", "options": {"A": "Learn a predictive internal simulation of an environment's dynamics", "B": "Translate between languages", "C": "Store geographic maps", "D": "Index the internet"}, "ans": "A", "exp": "They enable planning by imagining outcomes before acting."}, {"id": 942, "q": "Embodied AI emphasises learning through:", "options": {"A": "Symbolic logic exclusively", "B": "Text corpora alone", "C": "Static image datasets only", "D": "Physical or simulated interaction with an environment through a body"}, "ans": "D", "exp": "Perception, action and learning are treated as inseparable."}, {"id": 943, "q": "The sim-to-real gap in robotics refers to:", "options": {"A": "Robots being too expensive", "B": "Sensors being too accurate", "C": "Simulators running too slowly", "D": "Policies trained in simulation failing to transfer to physical hardware"}, "ans": "D", "exp": "Domain randomisation is a leading mitigation."}, {"id": 944, "q": "Neuro-symbolic AI aims to combine:", "options": {"A": "Two datasets", "B": "Hardware and firmware", "C": "Neural pattern recognition with symbolic reasoning and explicit knowledge", "D": "Two neural networks only"}, "ans": "C", "exp": "The goal is data efficiency, compositionality and interpretability."}, {"id": 945, "q": "Artificial General Intelligence (AGI) is typically defined as a system that:", "options": {"A": "Runs on quantum hardware", "B": "Has more parameters than any predecessor", "C": "Matches human-level competence across a broad range of cognitive tasks", "D": "Excels at one narrow task"}, "ans": "C", "exp": "There is no agreed operational test or threshold."}, {"id": 946, "q": "Narrow AI refers to systems that:", "options": {"A": "Have consciousness", "B": "Cannot be deployed", "C": "Possess general reasoning across domains", "D": "Perform well within a specific, bounded domain"}, "ans": "D", "exp": "All systems in production today are narrow in this sense."}, {"id": 947, "q": "The technological singularity hypothesis proposes:", "options": {"A": "A quantum measurement effect", "B": "A point of recursive self-improvement producing rapid, unpredictable change", "C": "A software licensing model", "D": "A hardware manufacturing limit"}, "ans": "B", "exp": "Associated with Vinge and Kurzweil; contested among researchers."}, {"id": 948, "q": "The Chinese Room argument (Searle) contends that:", "options": {"A": "Neural networks are impossible", "B": "Computers cannot process symbols", "C": "Symbol manipulation alone is insufficient for genuine understanding", "D": "Chinese is hard to translate"}, "ans": "C", "exp": "The systems reply and robot reply are the standard rebuttals."}, {"id": 949, "q": "The hard problem of consciousness, applied to AI, concerns:", "options": {"A": "How to compress weights", "B": "How fast a model can run", "C": "Why physical processing gives rise to subjective experience at all", "D": "How to label training data"}, "ans": "C", "exp": "Chalmers distinguishes it from the \"easy\" functional problems."}, {"id": 950, "q": "Moravec's paradox observes that:", "options": {"A": "Robots are cheaper than software", "B": "All tasks are equally difficult", "C": "Tasks easy for humans, like perception and movement, are hard for machines, and vice versa", "D": "Computers cannot do arithmetic"}, "ans": "C", "exp": "Billions of years of evolution optimised sensorimotor skill, not chess. Part 25: Mixed Revision Set (Q951–1000)"}, {"id": 951, "q": "The Turing Test evaluates a machine's ability to:", "options": {"A": "Store more information than a human", "B": "Exhibit conversational behaviour indistinguishable from a human", "C": "Compute faster than a human", "D": "Solve mathematical proofs"}, "ans": "B", "exp": "It tests behavioural indistinguishability, not internal understanding."}, {"id": 952, "q": "Which search algorithm is both complete and optimal when the heuristic is admissible?", "options": {"A": "Depth-first search", "B": "Hill climbing", "C": "Greedy best-first search", "D": "A* search"}, "ans": "D", "exp": "A* with an admissible h(n) never overestimates and finds the optimal path."}, {"id": 953, "q": "An admissible heuristic is one that:", "options": {"A": "Equals zero everywhere", "B": "Always overestimates the cost", "C": "Is randomly generated", "D": "Never overestimates the true cost to the goal"}, "ans": "D", "exp": "Consistency (monotonicity) is the stronger related property."}, {"id": 954, "q": "Alpha-beta pruning improves minimax by:", "options": {"A": "Randomising move order", "B": "Eliminating branches that cannot affect the final decision", "C": "Removing the evaluation function", "D": "Increasing the search depth requirement"}, "ans": "B", "exp": "With perfect ordering it roughly halves the effective depth cost."}, {"id": 955, "q": "In propositional logic, modus ponens allows inference of:", "options": {"A": "Q from P and P → Q", "B": "P from Q and P → Q", "C": "P ∧ Q from P", "D": "¬P from P"}, "ans": "A", "exp": "The foundational forward inference rule."}, {"id": 956, "q": "Resolution as an inference procedure requires sentences in:", "options": {"A": "Disjunctive normal form only", "B": "Prefix notation", "C": "Natural language", "D": "Conjunctive normal form"}, "ans": "D", "exp": "Refutation-complete for propositional and first-order logic."}, {"id": 957, "q": "First-order logic extends propositional logic by adding:", "options": {"A": "Probability values", "B": "Objects, relations and quantifiers", "C": "Faster inference", "D": "Neural weights"}, "ans": "B", "exp": "This gives it far greater expressive power."}, {"id": 958, "q": "Bayes' theorem computes the posterior as:", "options": {"A": "P(H|E) = P(H) + P(E)", "B": "P(H|E) = P(E) / P(H)", "C": "P(H|E) = P(E|H)P(H) / P(E)", "D": "P(H|E) = P(E|H) × P(E)"}, "ans": "C", "exp": "Likelihood times prior, normalised by the evidence."}, {"id": 959, "q": "A Bayesian network encodes:", "options": {"A": "Conditional independence relations as a directed acyclic graph", "B": "A decision tree", "C": "A sequence of neural layers", "D": "A fully connected undirected graph"}, "ans": "A", "exp": "It factorises a joint distribution compactly."}, {"id": 960, "q": "The naïve Bayes classifier's \"naïve\" assumption is that features are:", "options": {"A": "Conditionally independent given the class", "B": "Perfectly correlated", "C": "Normally distributed always", "D": "Binary valued"}, "ans": "A", "exp": "Often violated in practice, yet the classifier still performs well."}, {"id": 961, "q": "Overfitting is characterised by:", "options": {"A": "Low training error and high test error", "B": "Low error on both", "C": "High training and high test error", "D": "No error at all"}, "ans": "A", "exp": "The model has memorised noise instead of learning signal."}, {"id": 962, "q": "Underfitting typically indicates a model with:", "options": {"A": "Perfect generalisation", "B": "Excessive training epochs", "C": "Too many parameters", "D": "Too little capacity or insufficient training"}, "ans": "D", "exp": "Both training and validation performance are poor."}, {"id": 963, "q": "The bias–variance trade-off says that reducing bias generally:", "options": {"A": "Also reduces variance", "B": "Increases variance, and vice versa", "C": "Eliminates irreducible error", "D": "Has no effect on variance"}, "ans": "B", "exp": "Total error decomposes into bias², variance and noise."}, {"id": 964, "q": "L1 regularisation is preferred over L2 when you want:", "options": {"A": "All coefficients kept small but non-zero", "B": "Higher variance", "C": "Faster matrix inversion", "D": "Sparse solutions with some coefficients driven to exactly zero"}, "ans": "D", "exp": "This makes Lasso useful for feature selection."}, {"id": 965, "q": "k-fold cross-validation is used primarily to:", "options": {"A": "Speed up training", "B": "Obtain a more reliable estimate of generalisation performance", "C": "Remove all bias from the model", "D": "Increase the dataset size"}, "ans": "B", "exp": "Every observation serves once as validation data."}, {"id": 966, "q": "Precision is defined as:", "options": {"A": "TP / (TP + FP)", "B": "(TP + TN) / total", "C": "FP / (FP + TN)", "D": "TP / (TP + FN)"}, "ans": "A", "exp": "Of everything flagged positive, how much was actually positive."}, {"id": 967, "q": "Recall (sensitivity) is defined as:", "options": {"A": "TP / (TP + FP)", "B": "TN / (TN + FP)", "C": "TP / (TP + FN)", "D": "FN / total"}, "ans": "C", "exp": "Of all real positives, how many were found."}, {"id": 968, "q": "The F1 score is the:", "options": {"A": "Square of precision", "B": "Arithmetic mean of accuracy and recall", "C": "Product of TP and TN", "D": "Harmonic mean of precision and recall"}, "ans": "D", "exp": "The harmonic mean penalises imbalance between the two."}, {"id": 969, "q": "ROC-AUC is preferable to accuracy when:", "options": {"A": "Features are categorical", "B": "There is only one class", "C": "Classes are imbalanced and threshold choice is not fixed", "D": "The dataset is perfectly balanced"}, "ans": "C", "exp": "Precision–recall AUC is better still under extreme imbalance."}, {"id": 970, "q": "Random forests reduce variance relative to a single decision tree by:", "options": {"A": "Averaging many decorrelated trees trained on bootstrap samples", "B": "Removing randomness", "C": "Growing one very deep tree", "D": "Pruning aggressively"}, "ans": "A", "exp": "Random feature subsets at each split provide the decorrelation."}, {"id": 971, "q": "Gradient boosting builds an ensemble by:", "options": {"A": "Training all models independently in parallel", "B": "Averaging random predictions", "C": "Sequentially fitting new models to the residual errors of the current ensemble", "D": "Selecting one model only"}, "ans": "C", "exp": "XGBoost, LightGBM and CatBoost are widely used implementations."}, {"id": 972, "q": "k-means clustering minimises:", "options": {"A": "Classification error", "B": "Within-cluster sum of squared distances to centroids", "C": "Between-cluster distance", "D": "The number of clusters"}, "ans": "B", "exp": "The objective is non-convex, so initialisation matters."}, {"id": 973, "q": "The elbow method helps select:", "options": {"A": "The number of clusters k", "B": "The activation function", "C": "The batch size", "D": "The learning rate"}, "ans": "A", "exp": "Silhouette score is a common complementary criterion."}, {"id": 974, "q": "Principal Component Analysis finds directions that:", "options": {"A": "Maximise variance in the data", "B": "Randomly rotate the axes", "C": "Minimise the number of sample
