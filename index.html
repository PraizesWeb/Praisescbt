hen:", "options": {"A": "The data distribution is completely static", "B": "The model must never change", "C": "There is no data available", "D": "Patterns shift over time and the model must keep adapting"}, "ans": "D", "exp": "Fraud and user behaviour drift continually."}, {"id": 1536, "q": "The machine learning lifecycle is described as a loop rather than a one-off project because:", "options": {"A": "The world changes, data drifts, and models must be refreshed", "B": "Regulators require it", "C": "Models are cheap to build", "D": "Loops make the code shorter"}, "ans": "A", "exp": "A deployed model degrades quietly if left alone."}, {"id": 1537, "q": "In the seven-stage ML pipeline, the stage most likely to consume the largest share of effort is:", "options": {"A": "Choosing the optimiser", "B": "Data collection and cleaning", "C": "Writing the model code", "D": "Naming the project"}, "ans": "B", "exp": "Practitioners commonly cite roughly 80% of effort on data."}, {"id": 1538, "q": "Which order correctly describes the early pipeline stages?", "options": {"A": "Train → collect → clean → deploy", "B": "Collect → clean → explore → train", "C": "Clean → deploy → collect → train", "D": "Deploy → train → collect → clean"}, "ans": "B", "exp": "Data must exist and be usable before modelling begins."}, {"id": 1539, "q": "A model's parameters differ from its hyperparameters in that parameters are:", "options": {"A": "Chosen by the engineer before training", "B": "Always integers", "C": "Fixed by the programming language", "D": "Learned from the training data"}, "ans": "D", "exp": "Learning rate and tree depth are hyperparameters, weights are parameters."}, {"id": 1540, "q": "Which of the following is a hyperparameter?", "options": {"A": "The value of k in k-means", "B": "The weights of a linear regression model", "C": "The bias term learned during training", "D": "The predicted output"}, "ans": "A", "exp": "It is chosen in advance, not learned."}, {"id": 1541, "q": "Self-supervised learning generates its training signal by:", "options": {"A": "Using a reward function", "B": "Hiring human annotators", "C": "Deriving labels from the structure of the data itself", "D": "Randomly assigning labels"}, "ans": "C", "exp": "Predicting a masked or next portion of the input is the standard trick."}, {"id": 1542, "q": "Which task is best framed as multi-class classification?", "options": {"A": "Predicting house prices", "B": "Predicting rainfall in millimetres", "C": "Identifying which of ten handwritten digits an image shows", "D": "Grouping documents with no labels"}, "ans": "C", "exp": "One label chosen from more than two mutually exclusive classes."}, {"id": 1543, "q": "A recommendation engine that suggests products from your browsing history is best described as:", "options": {"A": "A rule-based expert system", "B": "A planning algorithm", "C": "A logic theorem prover", "D": "An ML model learning patterns from behavioural data"}, "ans": "D", "exp": "Patterns come from data, not hand-written rules."}, {"id": 1544, "q": "In the ML workflow, exploratory data analysis is performed in order to:", "options": {"A": "Understand distributions, spot anomalies and guide feature choices", "B": "Deploy the model to users", "C": "Select the programming language", "D": "Compute the final test score"}, "ans": "A", "exp": "It shapes every downstream decision."}, {"id": 1545, "q": "Which statement about labels is correct?", "options": {"A": "Labels are the target values a supervised model learns to predict", "B": "Labels are produced by the model at training time", "C": "Labels are required for unsupervised learning", "D": "Labels are always numeric"}, "ans": "A", "exp": "They are the \"answers\" supplied during training."}, {"id": 1546, "q": "A dataset in supervised learning is formally written as:", "options": {"A": "𝒟 = {xᵢ} only", "B": "𝒟 = {} always", "C": "𝒟 = {rewards}", "D": "𝒟 = {(xᵢ, yᵢ)} for i = 1…n"}, "ans": "D", "exp": "Feature vectors paired with targets."}, {"id": 1547, "q": "Which is the most accurate statement about machine learning?", "options": {"A": "It guarantees correct predictions", "B": "It removes the need to understand the problem domain", "C": "It works well without any data", "D": "It finds statistical patterns that may not reflect causation"}, "ans": "D", "exp": "Correlation learned from data is not evidence of cause."}, {"id": 1548, "q": "Deploying a model means:", "options": {"A": "Making it available to produce predictions on new, real inputs", "B": "Publishing a research paper", "C": "Training it on more data", "D": "Deleting the training set"}, "ans": "A", "exp": "The point at which it starts affecting real decisions."}, {"id": 1549, "q": "Monitoring a deployed model matters because:", "options": {"A": "Its accuracy on live data can degrade as conditions change", "B": "Code is hard to read", "C": "Models consume electricity", "D": "Users dislike automation"}, "ans": "A", "exp": "Silent degradation is the characteristic failure of ML in production."}, {"id": 1550, "q": "Which is the best summary of why ML is preferred to hand-written rules for spam filtering?", "options": {"A": "ML requires no data", "B": "Spam changes constantly, and a learned model adapts from examples faster than rules can be rewritten", "C": "Rules run more slowly", "D": "Rules cannot be written in Python"}, "ans": "B", "exp": "The adversary keeps changing the problem."}, {"id": 1551, "q": "The single biggest determinant of a machine learning project's success is usually:", "options": {"A": "The brand of GPU used", "B": "The number of team members", "C": "The quality and relevance of the data", "D": "The choice of programming language"}, "ans": "C", "exp": "Better data routinely beats a cleverer algorithm. Part 48: Data, Features & Preprocessing (Q1552–1581)"}, {"id": 1552, "q": "Feature engineering refers to:", "options": {"A": "Selecting the number of layers", "B": "Building the hardware that runs the model", "C": "Creating or transforming input variables so the model can learn more effectively", "D": "Writing the training loop"}, "ans": "C", "exp": "Often the highest-leverage work in classical ML."}, {"id": 1553, "q": "Feature scaling (normalisation or standardisation) is important because:", "options": {"A": "It removes the need for a model", "B": "It reduces the number of rows", "C": "It changes the labels", "D": "Features on very different numeric ranges can dominate distance and gradient computations"}, "ans": "D", "exp": "Essential for k-means, kNN and gradient-based methods."}, {"id": 1554, "q": "Standardisation transforms a feature so that it has:", "options": {"A": "Minimum 0 and maximum 1", "B": "Only integer values", "C": "Mean 0 and standard deviation 1", "D": "A perfectly normal distribution guaranteed"}, "ans": "C", "exp": "Min–max scaling is the option that maps to [0, 1]."}, {"id": 1555, "q": "A critical rule when scaling data is that the scaler must be fitted on:", "options": {"A": "The entire dataset before splitting", "B": "The training data only, then applied to validation and test data", "C": "Random noise", "D": "The test data only"}, "ans": "B", "exp": "Fitting on everything leaks test information into training."}, {"id": 1556, "q": "One-hot encoding is used to represent:", "options": {"A": "Image pixels", "B": "Continuous numeric features", "C": "Model weights", "D": "Categorical features with no inherent ordering"}, "ans": "D", "exp": "It avoids implying a false numeric order between categories."}, {"id": 1557, "q": "Label encoding a nominal category such as city name as 1, 2, 3 is risky because:", "options": {"A": "It implies an ordering and magnitude that do not exist", "B": "It cannot be stored in a database", "C": "It deletes the data", "D": "It uses too much memory"}, "ans": "A", "exp": "The model may infer that city 3 is \"greater than\" city 1."}, {"id": 1558, "q": "The simplest defensible way to handle a small number of missing values in a numeric column is:", "options": {"A": "Replace them with random large numbers", "B": "Delete the entire column", "C": "Impute with the mean or median of the column", "D": "Ignore the issue entirely"}, "ans": "C", "exp": "Median is more robust when the column is skewed."}, {"id": 1559, "q": "If a column is missing 90% of its values, the most sensible action is usually to:", "options": {"A": "Impute all of them with the mean", "B": "Consider dropping the column, or treating \"missing\" as its own signal", "C": "Duplicate the remaining rows", "D": "Fill them with zeros silently"}, "ans": "B", "exp": "Imputing 90% of a column invents most of its content."}, {"id": 1560, "q": "An outlier is best described as:", "options": {"A": "The mean of the dataset", "B": "A value far from the bulk of the distribution", "C": "Any negative value", "D": "A missing entry"}, "ans": "B", "exp": "It may be an error or a genuinely rare case."}, {"id": 1561, "q": "Before removing outliers, the analyst should first:", "options": {"A": "Determine whether they are data errors or genuine rare events", "B": "Duplicate them", "C": "Delete them immediately", "D": "Convert them to text"}, "ans": "A", "exp": "Fraud and disease cases are outliers you must keep."}, {"id": 1562, "q": "The curse of dimensionality describes the problem that:", "options": {"A": "Labels become unnecessary", "B": "Models train too quickly", "C": "Datasets become too small to store", "D": "As the number of features grows, data becomes sparse and distances lose meaning"}, "ans": "D", "exp": "Sample requirements grow explosively with dimension."}, {"id": 1563, "q": "Dimensionality reduction is used to:", "options": {"A": "Increase the number of features", "B": "Remove the labels", "C": "Represent the data with fewer variables while retaining most information", "D": "Add more training rows"}, "ans": "C", "exp": "PCA is the standard linear approach."}, {"id": 1564, "q": "Principal Component Analysis finds new axes that:", "options": {"A": "Maximise the number of features", "B": "Maximise class separation directly", "C": "Maximise the variance captured in the data", "D": "Minimise the number of rows"}, "ans": "C", "exp": "The components are orthogonal and ordered by variance explained."}, {"id": 1565, "q": "Data augmentation increases the effective size of an image dataset by:", "options": {"A": "Reducing the image resolution", "B": "Deleting difficult examples", "C": "Collecting entirely new photographs", "D": "Applying label-preserving transformations such as flips, crops and rotations"}, "ans": "D", "exp": "It teaches invariance and reduces overfitting."}, {"id": 1566, "q": "Which augmentation would be inappropriate for a handwritten digit classifier?", "options": {"A": "Small rotations", "B": "Minor zooming", "C": "Vertical flips", "D": "Slight shifts"}, "ans": "C", "exp": "Flipping vertically turns a 6 into something that is no longer a 6."}, {"id": 1567, "q": "Class imbalance means that:", "options": {"A": "One class appears far more often in the data than another", "B": "Training and test sets are the same size", "C": "Features have different scales", "D": "The dataset has missing values"}, "ans": "A", "exp": "Common in fraud, disease and defect detection."}, {"id": 1568, "q": "Which is NOT a standard remedy for class imbalance?", "options": {"A": "Oversampling the minority class", "B": "Reporting only overall accuracy", "C": "Applying class weights in the loss function", "D": "Undersampling the majority class"}, "ans": "B", "exp": "Accuracy is precisely the metric that hides the problem."}, {"id": 1569, "q": "SMOTE addresses imbalance by:", "options": {"A": "Deleting all majority examples", "B": "Generating synthetic minority examples by interpolating between existing ones", "C": "Duplicating the test set", "D": "Removing the labels"}, "ans": "B", "exp": "Synthetic Minority Over-sampling Technique."}, {"id": 1570, "q": "A training set, validation set and test set should be split such that:", "options": {"A": "All three are identical", "B": "The test set is held back and used only once, for the final estimate", "C": "The test set is used repeatedly to tune the model", "D": "The validation set is never used"}, "ans": "B", "exp": "Reusing the test set turns it into a second validation set."}, {"id": 1571, "q": "A typical split proportion mentioned in class for the training set is:", "options": {"A": "1%", "B": "5–10%", "C": "60–80%", "D": "Exactly 100%"}, "ans": "C", "exp": "With the remainder divided between validation and test."}, {"id": 1572, "q": "When splitting data for a classification problem with imbalanced classes, stratified sampling ensures that:", "options": {"A": "All classes are removed", "B": "Only the majority class appears", "C": "The data is sorted alphabetically", "D": "Every split preserves the original class proportions"}, "ans": "D", "exp": "Otherwise a rare class may be absent from a fold entirely."}, {"id": 1573, "q": "Data leakage most commonly enters a pipeline through:", "options": {"A": "Choosing a small learning rate", "B": "Using a fast optimiser", "C": "Training for too many epochs", "D": "Preprocessing steps fitted on the full dataset before splitting"}, "ans": "D", "exp": "Scaling and imputation are the usual culprits."}, {"id": 1574, "q": "A feature that would constitute target leakage when predicting loan default is:", "options": {"A": "The loan amount requested", "B": "Whether the account was later sent to debt collection", "C": "The applicant's income at application", "D": "The applicant's age"}, "ans": "B", "exp": "That information does not exist at decision time."}, {"id": 1575, "q": "Duplicate rows appearing in both the training and test sets cause:", "options": {"A": "An optimistically inflated test score", "B": "No effect at all", "C": "Underfitting", "D": "Slower training only"}, "ans": "A", "exp": "The model is graded on examples it has already memorised."}, {"id": 1576, "q": "In a tabular dataset, a row typically represents:", "options": {"A": "An observation or instance", "B": "A label only", "C": "A hyperparameter", "D": "A feature"}, "ans": "A", "exp": "Columns are the features."}, {"id": 1577, "q": "Text data must be converted to numbers before most models can use it, commonly via:", "options": {"A": "Bag-of-words counts or learned embeddings", "B": "Sorting characters alphabetically", "C": "Deleting the vocabulary", "D": "Compressing the file"}, "ans": "A", "exp": "Models operate on numeric vectors."}, {"id": 1578, "q": "In image data, normalising pixel values from 0–255 to 0–1 helps because:", "options": {"A": "It keeps input magnitudes small and stabilises gradient-based training", "B": "It changes the image content", "C": "It removes colour", "D": "It reduces the number of images"}, "ans": "A", "exp": "Large raw inputs can produce unstable updates."}, {"id": 1579, "q": "Which statement about training data quantity is most accurate?", "options": {"A": "Data quantity is irrelevant once a model is chosen", "B": "More representative data usually helps, but more of the same biased data does not fix bias", "C": "Ten examples are sufficient for any task", "D": "More data always guarantees a better model"}, "ans": "B", "exp": "Scale cannot correct a skewed sample."}, {"id": 1580, "q": "A \"feature vector\" is:", "options": {"A": "The learning rate schedule", "B": "The model's output", "C": "The set of numeric input values describing one example", "D": "The list of class labels"}, "ans": "C", "exp": "Denoted x for a single observation."}, {"id": 1581, "q": "The main risk of dropping every row containing any missing value is that:", "options": {"A": "The labels become invalid", "B": "The features change scale", "C": "The model trains faster", "D": "You may discard a large share of the data and bias the remaining sample"}, "ans": "D", "exp": "Missingness is often not random. Part 49: Linear Regression II (Q1582–1611)"}, {"id": 1582, "q": "In the model ŷ = w·x + b, the term b is called the:", "options": {"A": "Bias or intercept", "B": "Weight", "C": "Residual", "D": "Learning rate"}, "ans": "A", "exp": "It shifts the line vertically and lets it avoid passing through the origin."}, {"id": 1583, "q": "In simple linear regression with one feature, the weight w represents:", "options": {"A": "The predicted value", "B": "The error of the model", "C": "The change in ŷ for a one-unit increase in x", "D": "The number of training examples"}, "ans": "C", "exp": "It is the slope of the fitted line."}, {"id": 1584, "q": "The residual for a single training example is defined as:", "options": {"A": "ŷ × y", "B": "w + b", "C": "w × x", "D": "y − ŷ"}, "ans": "D", "exp": "The gap between the true value and the prediction."}, {"id": 1585, "q": "The Mean Squared Error cost is written as:", "options": {"A": "J(w,b) = Σ (w + b)", "B": "J(w,b) = Σ ŷᵢ", "C": "J(w,b) = (1/n) Σ |ŷᵢ − yᵢ|", "D": "J(w,b) = (1/n) Σ (ŷᵢ − yᵢ)²"}, "ans": "D", "exp": "Errors are squared, then averaged."}, {"id": 1586, "q": "Squaring the errors rather than summing them directly is necessary because:", "options": {"A": "It makes the cost negative", "B": "Positive and negative errors would otherwise cancel out", "C": "It removes the need for data", "D": "Squaring is faster to compute"}, "ans": "B", "exp": "It also penalises large errors disproportionately."}, {"id": 1587, "q": "Mean Absolute Error is preferred over MSE when the data:", "options": {"A": "Contains only categorical features", "B": "Contains outliers whose influence you wish to limit", "C": "Has no outliers at all", "D": "Is perfectly linear"}, "ans": "B", "exp": "MAE grows linearly rather than quadratically with error size."}, {"id": 1588, "q": "The MSE cost surface for linear regression is convex, which guarantees that:", "options": {"A": "The learning rate is irrelevant", "B": "There are many local minima to escape", "C": "Gradient descent cannot be used", "D": "Any minimum found is the global minimum"}, "ans": "D", "exp": "This is why linear regression is so well behaved."}, {"id": 1589, "q": "The gradient of the MSE cost with respect to wⱼ is proportional to:", "options": {"A": "The learning rate", "B": "Σ yᵢ only", "C": "Σ (h(xᵢ) − yᵢ) · xⱼ⁽ⁱ⁾", "D": "The number of features"}, "ans": "C", "exp": "Each example contributes its error weighted by that feature's value."}, {"id": 1590, "q": "In the gradient descent update w := w − α·∂J/∂w, the symbol α denotes the:", "options": {"A": "Bias", "B": "Learning rate", "C": "Number of epochs", "D": "Regularisation strength"}, "ans": "B", "exp": "It scales the size of each step."}, {"id": 1591, "q": "If gradient descent causes the cost to oscillate and grow rather than fall, the most likely cause is:", "options": {"A": "A learning rate that is too small", "B": "Too few features", "C": "A learning rate that is too large", "D": "Too many training examples"}, "ans": "C", "exp": "The updates overshoot the minimum repeatedly."}, {"id": 1592, "q": "If gradient descent converges extremely slowly, a sensible first adjustment is to:", "options": {"A": "Increase the learning rate", "B": "Delete half the data", "C": "Reduce the learning rate further", "D": "Remove the bias term"}, "ans": "A", "exp": "Provided it does not then diverge."}, {"id": 1593, "q": "The normal equation for linear regression is:", "options": {"A": "w = (XᵀX)⁻¹Xᵀy", "B": "w = X⁻¹y", "C": "w = α∇J", "D": "w = Xᵀy"}, "ans": "A", "exp": "A closed-form solution obtained by setting the gradient to zero."}, {"id": 1594, "q": "The normal equation becomes impractical when:", "options": {"A": "The learning rate is small", "B": "The data is perfectly linear", "C": "The number of features is very large, making matrix inversion costly", "D": "The dataset has very few features"}, "ans": "C", "exp": "Inversion scales roughly with the cube of the feature count."}, {"id": 1595, "q": "An advantage of the normal equation over gradient descent is that it:", "options": {"A": "Requires no learning rate and no iteration", "B": "Never requires matrix operations", "C": "Always works for neural networks", "D": "Handles millions of features easily"}, "ans": "A", "exp": "It jumps directly to the optimum."}, {"id": 1596, "q": "Multiple linear regression differs from simple linear regression in that it:", "options": {"A": "Uses several input features rather than one", "B": "Requires no cost function", "C": "Cannot use gradient descent", "D": "Predicts categories instead of numbers"}, "ans": "A", "exp": "The line becomes a hyperplane."}, {"id": 1597, "q": "R², the coefficient of determination, of 0.85 means that:", "options": {"A": "The model explains about 85% of the variance in the target", "B": "85% of predictions are exactly correct", "C": "The error is 85 units", "D": "85 features were used"}, "ans": "A", "exp": "It measures explained variation, not exact hits."}, {"id": 1598, "q": "An R² value close to 0 indicates that the model:", "options": {"A": "Fits the data perfectly", "B": "Has no bias term", "C": "Explains almost none of the variation in the target", "D": "Has too many features"}, "ans": "C", "exp": "It performs little better than predicting the mean."}, {"id": 1599, "q": "Adjusted R² is preferred over plain R² when comparing models because it:", "options": {"A": "Applies only to classification", "B": "Penalises the addition of features that do not genuinely improve fit", "C": "Always increases with more features", "D": "Ignores the residuals"}, "ans": "B", "exp": "Plain R² never decreases when features are added."}, {"id": 1600, "q": "Which is NOT one of the standard assumptions of linear regression?", "options": {"A": "Little or no multicollinearity among features", "B": "A linear relationship between features and target", "C": "Homoscedasticity of residuals", "D": "All features must be categorical"}, "ans": "D", "exp": "Linear regression is built for numeric inputs."}, {"id": 1601, "q": "Multicollinearity refers to:", "options": {"A": "The target having two classes", "B": "Two or more input features being highly correlated with each other", "C": "Multiple learning rates", "D": "Several output variables"}, "ans": "B", "exp": "It makes individual coefficients unstable and hard to interpret."}, {"id": 1602, "q": "Homoscedasticity means that the residuals:", "options": {"A": "Are all exactly zero", "B": "Are always negative", "C": "Increase steadily with the prediction", "D": "Have roughly constant variance across the range of predictions"}, "ans": "D", "exp": "A funnel-shaped residual plot signals a violation."}, {"id": 1603, "q": "Plotting residuals against predicted values is useful because:", "options": {"A": "It counts the training examples", "B": "It shows the learning rate", "C": "It measures training time", "D": "A clear pattern in the plot indicates the linear model is missing structure"}, "ans": "D", "exp": "Ideally the residuals look like random scatter."}, {"id": 1604, "q": "Polynomial regression extends linear regression by:", "options": {"A": "Using categorical outputs", "B": "Changing the cost function to cross-entropy", "C": "Adding powers of the input features as new terms", "D": "Removing the bias term"}, "ans": "C", "exp": "It remains linear in the parameters, though the curve bends."}, {"id": 1605, "q": "Increasing the polynomial degree indefinitely typically leads to:", "options": {"A": "A constant prediction", "B": "Overfitting, with the curve chasing noise in the training data", "C": "Better test performance without limit", "D": "Underfitting"}, "ans": "B", "exp": "Training error falls while test error rises."}, {"id": 1606, "q": "Ridge regression modifies the linear regression cost by adding a penalty proportional to:", "options": {"A": "The number of training rows", "B": "The sum of absolute weights", "C": "The sum of the squared weights", "D": "The learning rate"}, "ans": "C", "exp": "The L2 penalty shrinks weights smoothly toward zero."}, {"id": 1607, "q": "Lasso regression is often chosen over ridge when you want:", "options": {"A": "Categorical predictions", "B": "A faster learning rate", "C": "All features retained with small weights", "D": "Some coefficients driven exactly to zero, performing feature selection"}, "ans": "D", "exp": "The L1 penalty produces genuinely sparse solutions."}, {"id": 1608, "q": "Feature scaling matters for gradient descent in linear regression because:", "options": {"A": "It converts regression to classification", "B": "Features on very different scales create an elongated cost surface that slows convergence", "C": "It changes the target values", "D": "It removes the intercept"}, "ans": "B", "exp": "Scaled features give a more circular, faster-converging surface."}, {"id": 1609, "q": "Predicting a student's final examination score from hours studied is a task suited to:", "options": {"A": "k-means clustering", "B": "Logistic regression", "C": "A decision tree classifier", "D": "Linear regression"}, "ans": "D", "exp": "The target is a continuous number."}, {"id": 1610, "q": "If a linear regression model shows low training error and high test error, the problem is:", "options": {"A": "Underfitting", "B": "Too few parameters", "C": "Overfitting", "D": "Data leakage into the training set only"}, "ans": "C", "exp": "Regularisation or fewer features would help."}, {"id": 1611, "q": "Extrapolating a linear regression far beyond the range of the training data is risky because:", "options": {"A": "The model cannot compute values there", "B": "R² becomes negative automatically", "C": "The bias term disappears", "D": "The linear relationship observed within the data may not hold outside it"}, "ans": "D", "exp": "The fit carries no evidence about unobserved regions. Part 50: Logistic Regression & Classification II (Q1612–1641)"}, {"id": 1612, "q": "Linear regression is unsuitable for classification chiefly because its output:", "options": {"A": "Can fall outside the range 0 to 1 and cannot be read as a probability", "B": "Requires categorical inputs", "C": "Cannot be computed", "D": "Is always positive"}, "ans": "A", "exp": "Probabilities must lie between 0 and 1."}, {"id": 1613, "q": "The sigmoid function is defined as:", "options": {"A": "σ(z) = max(0, z)", "B": "σ(z) = z²", "C": "σ(z) = log(z)", "D": "σ(z) = 1 / (1 + e^(−z))"}, "ans": "D", "exp": "An S-shaped curve squashing the real line into (0, 1)."}, {"id": 1614, "q": "As z becomes very large and positive, σ(z) approaches:", "options": {"A": "1", "B": "Infinity", "C": "0", "D": "−1"}, "ans": "A", "exp": "And it approaches 0 as z becomes large and negative."}, {"id": 1615, "q": "σ(0) equals:", "options": {"A": "1", "B": "0.5", "C": "−1", "D": "0"}, "ans": "B", "exp": "The midpoint of the sigmoid curve."}, {"id": 1616, "q": "In logistic regression, the quantity fed into the sigmoid is:", "options": {"A": "The learning rate", "B": "A linear combination of the features, wᵀx + b", "C": "The label y", "D": "The cost function"}, "ans": "B", "exp": "Logistic regression is a linear model with a squashing output."}, {"id": 1617, "q": "Logistic regression is called a discriminative classifier because it:", "options": {"A": "Models the decision boundary between classes directly", "B": "Requires no training", "C": "Uses only unlabelled data", "D": "Generates new data samples"}, "ans": "A", "exp": "Naive Bayes, by contrast, is generative."}, {"id": 1618, "q": "The binary cross-entropy loss is written as:", "options": {"A": "Σ |ŷ − y|", "B": "(1/m) Σ (ŷ − y)²", "C": "−(1/m) Σ [y log(ŷ) + (1 − y) log(1 − ŷ)]", "D": "Σ max(0, ŷ − y + 1)"}, "ans": "C", "exp": "Only the term matching the true label contributes."}, {"id": 1619, "q": "Cross-entropy loss is preferred to MSE for logistic regression because MSE:", "options": {"A": "Is impossible to compute for probabilities", "B": "Requires categorical inputs", "C": "Cannot be minimised at all", "D": "Produces a non-convex cost surface when combined with the sigmoid"}, "ans": "D", "exp": "Cross-entropy restores convexity and gives healthier gradients."}, {"id": 1620, "q": "If the true label is 1 and the model predicts a probability of 0.01, the cross-entropy loss is:", "options": {"A": "Exactly zero", "B": "Very large", "C": "Very small", "D": "Negative"}, "ans": "B", "exp": "−log(0.01) ≈ 4.6; confident and wrong is punished hard."}, {"id": 1621, "q": "The default decision threshold in binary logistic regression is:", "options": {"A": "0.25", "B": "0.0", "C": "0.5", "D": "1.0"}, "ans": "C", "exp": "Above the threshold is the positive class."}, {"id": 1622, "q": "Lowering the decision threshold from 0.5 to 0.3 generally:", "options": {"A": "Has no effect on any metric", "B": "Decreases recall", "C": "Increases recall and decreases precision", "D": "Increases both precision and recall"}, "ans": "C", "exp": "More cases are flagged positive, catching more true cases and more false alarms."}, {"id": 1623, "q": "In a medical screening application, you would typically lower the threshold in order to:", "options": {"A": "Avoid missing genuine cases, accepting more false alarms", "B": "Reduce the number of tests performed", "C": "Minimise recall", "D": "Maximise precision above all"}, "ans": "A", "exp": "A missed diagnosis usually costs more than a follow-up test."}, {"id": 1624, "q": "The decision boundary of logistic regression with two features is:", "options": {"A": "Always a single point", "B": "A straight line in feature space", "C": "Always a circle", "D": "Impossible to draw"}, "ans": "B", "exp": "It is linear unless the features themselves are transformed."}, {"id": 1625, "q": "To obtain a curved decision boundary from logistic regression, you can:", "options": {"A": "Add polynomial or interaction terms to the features", "B": "Remove the sigmoid", "C": "Reduce the dataset size", "D": "Increase the learning rate"}, "ans": "A", "exp": "The model stays linear in parameters but curved in the original space."}, {"id": 1626, "q": "Softmax regression generalises logistic regression to:", "options": {"A": "Regression targets", "B": "Time-series forecasting", "C": "More than two mutually exclusive classes", "D": "Unlabelled data"}, "ans": "C", "exp": "Also known as multinomial logistic regression."}, {"id": 1627, "q": "The outputs of a softmax layer across all classes always:", "options": {"A": "Sum to 1", "B": "Are negative", "C": "Are all equal", "D": "Sum to the number of classes"}, "ans": "A", "exp": "They form a probability distribution."}, {"id": 1628, "q": "For a multi-label problem where an image may contain several objects at once, the appropriate output activation is:", "options": {"A": "Softmax", "B": "ReLU", "C": "A single linear unit", "D": "Independent sigmoids, one per label"}, "ans": "D", "exp": "Softmax forces the labels to compete, which is wrong here."}, {"id": 1629, "q": "Logistic regression coefficients are interpreted in terms of:", "options": {"A": "Change in the raw probability, always linearly", "B": "Change in the log-odds of the positive class per unit change in the feature", "C": "The number of misclassified points", "D": "The learning rate"}, "ans": "B", "exp": "Exponentiating gives the odds ratio."}, {"id": 1630, "q": "A positive coefficient in logistic regression indicates that as the feature increases:", "options": {"A": "The predicted probability of the positive class increases", "B": "The predicted probability decreases", "C": "The prediction is unaffected", "D": "The model becomes invalid"}, "ans": "A", "exp": "The sign gives the direction of the effect."}, {"id": 1631, "q": "Regularisation is applied to logistic regression primarily to:", "options": {"A": "Convert it into a regression model", "B": "Prevent overfitting, particularly with many correlated features", "C": "Remove the intercept", "D": "Speed up prediction"}, "ans": "B", "exp": "L1 and L2 penalties are both commonly used."}, {"id": 1632, "q": "With perfectly separable training data, unregularised logistic regression tends to:", "options": {"A": "Behave identically to linear regression", "B": "Produce zero probabilities everywhere", "C": "Fail to converge as weights grow without bound", "D": "Converge immediately to small weights"}, "ans": "C", "exp": "Regularisation is the standard remedy."}, {"id": 1633, "q": "Logistic regression is often used as a baseline model because it is:", "options": {"A": "Unable to overfit", "B": "Free of hyperparameters", "C": "The most accurate model available", "D": "Fast, interpretable and surprisingly strong on tabular data"}, "ans": "D", "exp": "A sensible first model before trying anything complex."}, {"id": 1634, "q": "In credit scoring, logistic regression remains popular largely because:", "options": {"A": "It cannot make mistakes", "B": "It requires no data", "C": "Its coefficients provide explainable reasons for a decision", "D": "It is the only legal option"}, "ans": "C", "exp": "Adverse-action notices require stated reasons."}, {"id": 1635, "q": "Which statement about logistic regression is FALSE?", "options": {"A": "It fits a linear decision boundary by default", "B": "It outputs probabilities", "C": "It is a classification algorithm despite its name", "D": "It minimises mean squared error by default"}, "ans": "D", "exp": "It minimises cross-entropy."}, {"id": 1636, "q": "The gradient of the cross-entropy loss with respect to the weights in logistic regression takes the form:", "options": {"A": "Σ log(xᵢ)", "B": "Σ yᵢ²", "C": "A constant independent of the data", "D": "Σ (ŷᵢ − yᵢ) xᵢ"}, "ans": "D", "exp": "Elegantly, the same shape as the linear regression gradient."}, {"id": 1637, "q": "Class probabilities from a logistic regression model are said to be well calibrated when:", "options": {"A": "Among cases predicted at 0.7, roughly 70% are actually positive", "B": "The threshold is 0.5", "C": "Accuracy exceeds 90%", "D": "All predictions are 0 or 1"}, "ans": "A", "exp": "Calibration concerns the reliability of the probability itself."}, {"id": 1638, "q": "Predicting whether a customer will churn (yes/no) from account activity is:", "options": {"A": "A dimensionality-reduction task", "B": "A clustering task", "C": "A binary classification task", "D": "A regression task"}, "ans": "C", "exp": "Two mutually exclusive outcomes."}, {"id": 1639, "q": "Which is a valid reason to prefer logistic regression over a deep neural network for a small tabular dataset?", "options": {"A": "Neural networks cannot handle tabular data at all", "B": "With limited data, the simpler model is less likely to overfit and is easier to explain", "C": "Neural networks require no training data", "D": "Logistic regression always achieves higher accuracy"}, "ans": "B", "exp": "Model capacity should match data volume."}, {"id": 1640, "q": "The output of logistic regression before the sigmoid is applied is often called the:", "options": {"A": "Gradient", "B": "Logit or score", "C": "Label", "D": "Residual"}, "ans": "B", "exp": "The log-odds of the positive class."}, {"id": 1641, "q": "If a logistic regression model predicts 0.48 for an example and the threshold is 0.5, the model:", "options": {"A": "Assigns the negative class, but with low confidence", "B": "Assigns the positive class", "C": "Refuses to classify", "D": "Returns an error"}, "ans": "A", "exp": "Predictions near the threshold are the least certain. Part 51: Decision Trees II (Q1642–1671)"}, {"id": 1642, "q": "A decision tree makes predictions by:", "options": {"A": "Fitting a straight line through the data", "B": "Following a sequence of if–then tests from the root to a leaf", "C": "Multiplying weight matrices", "D": "Computing distances to cluster centres"}, "ans": "B", "exp": "Each internal node tests one feature against a threshold."}, {"id": 1643, "q": "In a decision tree, a leaf node contains:", "options": {"A": "The learning rate", "B": "The full training dataset", "C": "A prediction — a class label or a numeric value", "D": "A feature test"}, "ans": "C", "exp": "Leaves are where the traversal stops."}, {"id": 1644, "q": "At each internal node, the tree-building algorithm chooses:", "options": {"A": "The last feature in the dataset", "B": "A random feature and threshold", "C": "The feature with the longest name", "D": "The feature and threshold giving the best improvement in node purity"}, "ans": "D", "exp": "The split is chosen greedily to maximise purity gain."}, {"id": 1645, "q": "Gini impurity for a node is calculated as:", "options": {"A": "Σ pₖ", "B": "Σ pₖ log pₖ", "C": "1 − Σ pₖ²", "D": "1 + Σ pₖ²"}, "ans": "C", "exp": "Where pₖ is the proportion of class k at that node."}, {"id": 1646, "q": "A node containing only examples of a single class has a Gini impurity of:", "options": {"A": "−1", "B": "1", "C": "0", "D": "0.5"}, "ans": "C", "exp": "A perfectly pure node."}, {"id": 1647, "q": "For a binary node split 50/50 between two classes, the Gini impurity is:", "options": {"A": "0", "B": "0.25", "C": "1", "D": "0.5"}, "ans": "D", "exp": "1 − (0.5² + 0.5²) = 0.5, the maximum for two classes."}, {"id": 1648, "q": "Entropy of a node is defined as:", "options": {"A": "Σ pₖ²", "B": "1 − Σ pₖ²", "C": "Σ |pₖ|", "D": "−Σ pₖ log₂ pₖ"}, "ans": "D", "exp": "It measures disorder in bits."}, {"id": 1649, "q": "The entropy of a node split evenly between two classes is:", "options": {"A": "1 bit", "B": "0.5 bits", "C": "0 bits", "D": "2 bits"}, "ans": "A", "exp": "Maximum uncertainty for a binary outcome."}, {"id": 1650, "q": "Information gain from a split is calculated as:", "options": {"A": "The sum of all child entropies", "B": "The number of examples in the node", "C": "The entropy of the parent minus the weighted entropy of the children", "D": "The parent entropy alone"}, "ans": "C", "exp": "Higher gain means a more informative split."}, {"id": 1651, "q": "In practice, Gini impurity and entropy:", "options": {"A": "Usually produce very similar trees, with Gini slightly cheaper to compute", "B": "Cannot be used for classification", "C": "Produce wildly different trees in almost every case", "D": "Are identical formulas"}, "ans": "A", "exp": "The choice rarely matters much in practice."}, {"id": 1652, "q": "For regression trees, the splitting criterion is typically:", "options": {"A": "Cross-entropy", "B": "Reduction in variance or mean squared error", "C": "Information gain", "D": "Gini impurity"}, "ans": "B", "exp": "Purity is replaced by numeric spread."}, {"id": 1653, "q": "An unconstrained decision tree grown to full depth will typically:", "options": {"A": "Underfit badly", "B": "Fail to train", "C": "Produce a single leaf", "D": "Achieve near-perfect training accuracy but generalise poorly"}, "ans": "D", "exp": "It can memorise the training set exactly."}, {"id": 1654, "q": "Which is NOT a standard way to control decision tree overfitting?", "options": {"A": "Increasing the number of features artificially", "B": "Setting a minimum number of samples per leaf", "C": "Pruning branches after growth", "D": "Limiting the maximum depth"}, "ans": "A", "exp": "More features generally worsens the problem."}, {"id": 1655, "q": "Pre-pruning (early stopping) means:", "options": {"A": "Removing the root node", "B": "Halting tree growth when a criterion such as max depth is reached", "C": "Deleting the training data", "D": "Growing the full tree, then removing branches"}, "ans": "B", "exp": "Post-pruning grows first and cuts back afterwards."}, {"id": 1656, "q": "The parameter max_depth in a decision tree controls:", "options": {"A": "The number of features", "B": "How many levels of splits the tree may grow", "C": "The number of trees", "D": "The learning rate"}, "ans": "B", "exp": "A small value produces a simple, high-bias model."}, {"id": 1657, "q": "Setting min_samples_leaf to a larger value tends to:", "options": {"A": "Have no effect", "B": "Produce a simpler, more regularised tree", "C": "Guarantee zero training error", "D": "Produce a more complex tree"}, "ans": "B", "exp": "Leaves must summarise more examples, smoothing predictions."}, {"id": 1658, "q": "A key practical advantage of decision trees is that they:", "options": {"A": "Are easy to interpret and can be visualised as a flowchart", "B": "Always outperform every other model", "C": "Require no training data", "D": "Cannot overfit"}, "ans": "A", "exp": "Every decision path can be read and explained."}, {"id": 1659, "q": "A significant disadvantage of a single decision tree is that it is:", "options": {"A": "Impossible to train", "B": "Highly sensitive to small changes in the data, producing different trees", "C": "Always underfitted", "D": "Unable to handle categorical features"}, "ans": "B", "exp": "This instability is precisely what ensembles exploit."}, {"id": 1660, "q": "Compared with linear models, decision trees handle non-linear relationships by:", "options": {"A": "Using gradient descent", "B": "Applying a sigmoid function", "C": "Partitioning the feature space into axis-aligned regions", "D": "Adding polynomial terms automatically"}, "ans": "C", "exp": "Each region receives its own constant prediction."}, {"id": 1661, "q": "Decision trees generally require:", "options": {"A": "Extensive feature scaling before training", "B": "All features to be normalised to [0,1]", "C": "Standardised features with mean zero", "D": "Little or no feature scaling, since splits depend only on ordering"}, "ans": "D", "exp": "A threshold test is unaffected by monotone rescaling."}, {"id": 1662, "q": "A decision tree can handle a mixture of numeric and categorical features because:", "options": {"A": "It requires one-hot encoding in every implementation", "B": "It ignores categorical features", "C": "It converts everything to images", "D": "Splits can be defined as thresholds on numbers or membership tests on categories"}, "ans": "D", "exp": "This flexibility is part of their appeal."}, {"id": 1663, "q": "Decision tree splits are described as \"greedy\" because the algorithm:", "options": {"A": "Considers every possible whole tree before choosing", "B": "Chooses the locally best split at each node without backtracking", "C": "Uses all the memory available", "D": "Trains on the test set"}, "ans": "B", "exp": "The globally optimal tree is not guaranteed."}, {"id": 1664, "q": "A decision tree with max_depth = 1, making a single split, is known as a:", "options": {"A": "Random forest", "B": "Deep tree", "C": "Leaf", "D": "Decision stump"}, "ans": "D", "exp": "Frequently used as a weak learner in boosting."}, {"id": 1665, "q": "If a decision tree shows 100% training accuracy and 62% test accuracy, you should:", "options": {"A": "Restrict tree growth through depth or leaf-size limits", "B": "Conclude the model is excellent", "C": "Remove the test set", "D": "Increase the tree depth further"}, "ans": "A", "exp": "A textbook case of overfitting."}, {"id": 1666, "q": "Feature importance in a decision tree is typically derived from:", "options": {"A": "The feature's variance alone", "B": "The alphabetical order of the features", "C": "The total impurity reduction contributed by splits on that feature", "D": "The number of missing values"}, "ans": "C", "exp": "Features used in high, impactful splits score highly."}, {"id": 1667, "q": "A limitation of decision-tree feature importance is that it:", "options": {"A": "Applies only to regression", "B": "Can be misleading when features are strongly correlated", "C": "Cannot be computed", "D": "Always sums to zero"}, "ans": "B", "exp": "Correlated features may share or split the credit arbitrarily."}, {"id": 1668, "q": "A decision tree predicting a continuous target outputs, at each leaf:", "options": {"A": "The root value", "B": "A class probability", "C": "The mean of the training targets that reached that leaf", "D": "A random number"}, "ans": "C", "exp": "Hence the characteristic step-shaped prediction surface."}, {"id": 1669, "q": "Which statement about decision boundaries of trees is TRUE?", "options": {"A": "They cannot exist in more than two dimensions", "B": "They are always straight diagonal lines", "C": "They are axis-aligned rectangles in feature space", "D": "They are smooth curves"}, "ans": "C", "exp": "A diagonal boundary must be approximated by many small steps."}, {"id": 1670, "q": "Decision trees are described in class as useful for data exploration because they:", "options": {"A": "Only work on images", "B": "Require heavy preprocessing", "C": "Hide the decision logic", "D": "Reveal which features drive the outcome and how they interact"}, "ans": "D", "exp": "A quick tree often exposes structure fast."}, {"id": 1671, "q": "The main reason random forests outperform a single decision tree is that they:", "options": {"A": "Average many decorrelated trees, greatly reducing variance", "B": "Require less data", "C": "Use deeper individual trees", "D": "Remove all randomness from training"}, "ans": "A", "exp": "Instability at the tree level becomes stability at the forest level. Part 52: Ensemble Methods II (Q1672–1701)"}, {"id": 1672, "q": "An ensemble method combines several base models in order to:", "options": {"A": "Produce one predictor that is better than any individual member", "B": "Speed up inference", "C": "Reduce the size of the training data", "D": "Remove the need for evaluation"}, "ans": "A", "exp": "Diverse errors partially cancel out."}, {"id": 1673, "q": "Bagging is short for:", "options": {"A": "Binary grouping", "B": "Bootstrap aggregating", "C": "Backward aggregating", "D": "Balanced gradient"}, "ans": "B", "exp": "Each model trains on a bootstrap resample of the data."}, {"id": 1674, "q": "A bootstrap sample is drawn from the training set:", "options": {"A": "From random noise", "B": "Without replacement, using every row exactly once", "C": "With replacement, so some rows repeat and others are omitted", "D": "From the test set"}, "ans": "C", "exp": "Roughly a third of rows are left out of each sample."}, {"id": 1675, "q": "Bagging primarily reduces:", "options": {"A": "Variance", "B": "The number of features", "C": "The training set size", "D": "Bias"}, "ans": "A", "exp": "Averaging many unstable models stabilises the prediction."}, {"id": 1676, "q": "Rows omitted from a particular bootstrap sample are called:", "options": {"A": "Outliers", "B": "Validation folds", "C": "Out-of-bag samples", "D": "Support vectors"}, "ans": "C", "exp": "They give a free internal estimate of generalisation error."}, {"id": 1677, "q": "The out-of-bag error estimate is valuable because it:", "options": {"A": "Provides validation performance without holding data back", "B": "Measures training speed", "C": "Requires a separate test set", "D": "Always equals zero"}, "ans": "A", "exp": "Each row is scored by the trees that never saw it."}, {"id": 1678, "q": "Random forests extend bagging by additionally:", "options": {"A": "Training a single tree", "B": "Removing the bootstrap step", "C": "Using a single feature for all splits", "D": "Selecting a random subset of features at each split"}, "ans": "D", "exp": "This decorrelates the trees far more effectively."}, {"id": 1679, "q": "Without random feature selection, bagged trees would tend to:", "options": {"A": "Fail to train", "B": "Underfit severely", "C": "Be perfectly independent", "D": "Be highly correlated because all trees split on the same dominant feature"}, "ans": "D", "exp": "Correlated errors do not average away."}, {"id": 1680, "q": "A random forest makes a classification prediction by:", "options": {"A": "Majority vote across all trees", "B": "Averaging the feature values", "C": "Using the first tree trained", "D": "Taking the single deepest tree's answer"}, "ans": "A", "exp": "For regression it averages the numeric outputs."}, {"id": 1681, "q": "Increasing the number of trees in a random forest generally:", "options": {"A": "Causes severe overfitting", "B": "Improves stability then plateaus, at the cost of compute", "C": "Reduces accuracy steadily", "D": "Removes the need for features"}, "ans": "B", "exp": "More trees rarely hurt accuracy; they cost time."}, {"id": 1682, "q": "Boosting differs fundamentally from bagging because its models are trained:", "options": {"A": "On the test set", "B": "Sequentially, with each model correcting its predecessors' errors", "C": "Without any data", "D": "Independently and in parallel"}, "ans": "B", "exp": "The ensemble is built additively."}, {"id": 1683, "q": "Boosting primarily reduces:", "options": {"A": "Variance only", "B": "The feature count", "C": "Bias", "D": "The number of examples"}, "ans": "C", "exp": "Which is why weak, high-bias learners are used as the base."}, {"id": 1684, "q": "AdaBoost adapts by:", "options": {"A": "Deleting misclassified examples", "B": "Randomising the labels", "C": "Using only the first model's predictions", "D": "Increasing the weight of examples the previous model misclassified"}, "ans": "D", "exp": "Later learners concentrate on the hard cases."}, {"id": 1685, "q": "Gradient boosting fits each new tree to:", "options": {"A": "The original labels", "B": "A random target", "C": "The residual errors of the current ensemble", "D": "The test set predictions"}, "ans": "C", "exp": "Each tree takes a step down the loss gradient."}, {"id": 1686, "q": "The learning rate (shrinkage) in gradient boosting controls:", "options": {"A": "How strongly each new tree contributes to the ensemble", "B": "The size of the dataset", "C": "The number of features", "D": "The depth of the first tree only"}, "ans": "A", "exp": "Smaller values need more trees but generalise better."}, {"id": 1687, "q": "Base learners in gradient boosting are typically:", "options": {"A": "Linear regressions only", "B": "Shallow trees, often of depth 3 to 6", "C": "Neural networks", "D": "Very deep, fully-grown trees"}, "ans": "B", "exp": "Weak learners combined additively."}, {"id": 1688, "q": "Compared with random forests, gradient boosting is generally:", "options": {"A": "Free of hyperparameters", "B": "Always worse", "C": "Impossible to overfit", "D": "More accurate when well tuned, but more sensitive to hyperparameters"}, "ans": "D", "exp": "Random forests are the more forgiving default."}, {"id": 1689, "q": "Boosting can overfit if:", "options": {"A": "The learning rate is very small", "B": "Too few trees are used", "C": "Too many trees are added with too high a learning rate", "D": "The base learners are shallow"}, "ans": "C", "exp": "Early stopping on a validation set is the usual guard."}, {"id": 1690, "q": "XGBoost and LightGBM improve on plain gradient boosting mainly through:", "options": {"A": "Using unlabelled data", "B": "Removing the trees entirely", "C": "Eliminating the learning rate", "D": "Regularisation, efficient split-finding and engineering optimisations"}, "ans": "D", "exp": "They are the standard choices for tabular competitions."}, {"id": 1691, "q": "Stacking combines models by:", "options": {"A": "Concatenating the training sets", "B": "Selecting only the best base model", "C": "Averaging their predictions equally", "D": "Training a meta-model on the base models' out-of-fold predictions"}, "ans": "D", "exp": "The meta-learner learns how best to weight each base model."}, {"id": 1692, "q": "Using in-sample rather than out-of-fold predictions to train a stacking meta-model causes:", "options": {"A": "Faster training with no downside", "B": "Leakage, since base models have already seen those rows", "C": "The meta-model to underfit", "D": "The base models to fail"}, "ans": "B", "exp": "The meta-model would trust overfitted predictions."}, {"id": 1693, "q": "A voting classifier using \"hard\" voting decides by:", "options": {"A": "Choosing the most confident model", "B": "Averaging the predicted probabilities", "C": "Taking the majority predicted class label", "D": "Random selection"}, "ans": "C", "exp": "Soft voting averages probabilities instead."}, {"id": 1694, "q": "Soft voting often outperforms hard voting because it:", "options": {"A": "Trains faster", "B": "Uses the confidence of each model rather than only its final label", "C": "Ignores weak models entirely", "D": "Requires fewer models"}, "ans": "B", "exp": "Confidence carries information a bare label discards."}, {"id": 1695, "q": "Ensembles work best when the individual models are:", "options": {"A": "Accurate and make different kinds of errors", "B": "Identical to one another", "C": "Trained on the same single example", "D": "All badly underfitted"}, "ans": "A", "exp": "Diversity is what makes averaging useful."}, {"id": 1696, "q": "The main practical cost of ensemble methods is:", "options": {"A": "Lower accuracy", "B": "Greater computation and reduced interpretability", "C": "The need for unlabelled data", "D": "Inability to handle numeric data"}, "ans": "B", "exp": "A hundred trees cannot be read like one tree."}, {"id": 1697, "q": "Random forests handle overfitting better than single trees mainly because:", "options": {"A": "They train on the test set", "B": "Their individual trees are shallower", "C": "They use fewer features overall", "D": "Averaging over many decorrelated trees cancels much of the noise-fitting"}, "ans": "D", "exp": "Individual trees may be deep and overfitted."}, {"id": 1698, "q": "In sklearn, the parameter n_estimators in a random forest sets the:", "options": {"A": "Number of trees in the forest", "B": "Number of features per split", "C": "Number of classes", "D": "Maximum depth of each tree"}, "ans": "A", "exp": "Commonly set to a few hundred."}, {"id": 1699, "q": "Random forests can be used for both classification and regression because:", "options": {"A": "Only classification is actually supported", "B": "The bootstrap differs", "C": "The aggregation step changes from majority vote to averaging", "D": "The trees change type between tasks"}, "ans": "C", "exp": "The forest structure is otherwise the same."}, {"id": 1700, "q": "Which describes the bias–variance behaviour of the two main ensemble families?", "options": {"A": "Both cut bias only", "B": "Bagging cuts variance; boosting cuts bias", "C": "Both cut variance only", "D": "Neither affects bias or variance"}, "ans": "B", "exp": "The reason they are built so differently."}, {"id": 1701, "q": "For a business problem where the decision must be explained to a regulator, an ensemble of 500 trees is:", "options": {"A": "Problematic, because the reasoning is difficult to communicate", "B": "Identical in transparency to a single tree", "C": "Ideal, since accuracy is all that matters", "D": "Illegal in all jurisdictions"}, "ans": "A", "exp": "Accuracy and explainability often pull in opposite directions. Part 53: Model Evaluation Metrics II (Q1702–1731)"}, {"id": 1702, "q": "In a confusion matrix, a False Positive occurs when the model predicts:", "options": {"A": "Negative for an actually positive case", "B": "Positive for an actually positive case", "C": "Negative for an actually negative case", "D": "Positive for an actually negative case"}, "ans": "D", "exp": "Also called a Type I error, or a false alarm."}, {"id": 1703, "q": "A False Negative occurs when the model:", "options": {"A": "Makes no prediction at all", "B": "Predicts positive for a negative case", "C": "Misses a genuinely positive case by predicting negative", "D": "Correctly identifies a positive case"}, "ans": "C", "exp": "A Type II error; in medicine, a missed diagnosis."}, {"id": 1704, "q": "Accuracy is calculated as:", "options": {"A": "(TP + TN) / (TP + TN + FP + FN)", "B": "TP / (TP + FP)", "C": "TP / (TP + FN)", "D": "TN / (TN + FP)"}, "ans": "A", "exp": "The proportion of all predictions that are correct."}, {"id": 1705, "q": "Specificity is defined as:", "options": {"A": "TP / (TP + FN)", "B": "TN / (TN + FP)", "C": "TP / (TP + FP)", "D": "FN / (FN + TP)"}, "ans": "B", "exp": "The true negative rate."}, {"id": 1706, "q": "Given TP = 40, FP = 10, FN = 20, TN = 30, precision equals:", "options": {"A": "0.67", "B": "0.57", "C": "0.40", "D": "0.80"}, "ans": "D", "exp": "40 / (40 + 10) = 0.80."}, {"id": 1707, "q": "With the same figures (TP = 40, FP = 10, FN = 20, TN = 30), recall equals:", "options": {"A": "0.80", "B": "0.50", "C": "0.67", "D": "0.75"}, "ans": "C", "exp": "40 / (40 + 20) ≈ 0.667."}, {"id": 1708, "q": "With the same figures, accuracy equals:", "options": {"A": "0.70", "B": "0.50", "C": "0.67", "D": "0.80"}, "ans": "A", "exp": "(40 + 30) / 100 = 0.70."}, {"id": 1709, "q": "The F1 score of a model with precision 0.8 and recall 0.6 is approximately:", "options": {"A": "0.60", "B": "0.70", "C": "0.48", "D": "0.69"}, "ans": "D", "exp": "2(0.8 × 0.6)/(0.8 + 0.6) ≈ 0.686."}, {"id": 1710, "q": "The harmonic mean is used for F1 rather than the arithmetic mean because it:", "options": {"A": "Always produces a larger value", "B": "Ignores recall entirely", "C": "Is easier to compute", "D": "Punishes a large imbalance between precision and recall"}, "ans": "D", "exp": "Precision 1.0 with recall 0.0 gives F1 = 0, not 0.5."}, {"id": 1711, "q": "In a dataset where 99% of cases are negative, a model predicting \"negative\" for everything achieves:", "options": {"A": "99% accuracy but zero recall on the positive class", "B": "50% accuracy", "C": "99% recall", "D": "Perfect precision and recall"}, "ans": "A", "exp": "The accuracy paradox in one line."}, {"id": 1712, "q": "The ROC curve plots:", "options": {"A": "Accuracy against epochs", "B": "Precision against recall", "C": "True positive rate against false positive rate across thresholds", "D": "Loss against learning rate"}, "ans": "C", "exp": "Sensitivity versus 1 − specificity."}, {"id": 1713, "q": "An AUC of 0.5 indicates a classifier that is:", "options": {"A": "Well calibrated", "B": "Perfectly wrong", "C": "No better than random guessing", "D": "Perfect"}, "ans": "C", "exp": "The diagonal line on the ROC plot."}, {"id": 1714, "q": "An AUC of 1.0 indicates:", "options": {"A": "A broken model", "B": "Random performance", "C": "Complete overfitting always", "D": "Perfect separation of the two classes at some threshold"}, "ans": "D", "exp": "Every positive ranks above every negative."}, {"id": 1715, "q": "AUC can be interpreted as the probability that:", "options": {"A": "The model is correct on any single case", "B": "Precision exceeds recall", "C": "A randomly chosen positive case is ranked above a randomly chosen negative case", "D": "The threshold equals 0.5"}, "ans": "C", "exp": "A ranking-quality measure, independent of threshold."}, {"id": 1716, "q": "Precision–recall curves are preferred to ROC curves when:", "options": {"A": "There are no false positives", "B": "The positive class is very rare", "C": "The model is a regression", "D": "Classes are balanced"}, "ans": "B", "exp": "ROC can look deceptively good under extreme imbalance."}, {"id": 1717, "q": "For a regression model, an appropriate evaluation metric is:", "options": {"A": "F1 score", "B": "Root Mean Squared Error", "C": "AUC", "D": "Confusion matrix"}, "ans": "B", "exp": "MAE and R² are also standard."}, {"id": 1718, "q": "RMSE is often preferred to MSE for reporting because it:", "options": {"A": "Is in the same units as the target variable", "B": "Requires no square root", "C": "Ignores large errors", "D": "Cannot be negative, unlike MSE"}, "ans": "A", "exp": "Easier to interpret against the quantity being predicted."}, {"id": 1719, "q": "Compared with RMSE, Mean Absolute Error is:", "options": {"A": "Identical in every case", "B": "Less sensitive to outliers", "C": "Only usable for classification", "D": "More sensitive to outliers"}, "ans": "B", "exp": "Errors are not squared."}, {"id": 1720, "q": "For a spam filter, a False Positive means:", "options": {"A": "A legitimate message being sent to the junk folder", "B": "A deleted account", "C": "A correctly filtered spam message", "D": "A spam message reaching the inbox"}, "ans": "A", "exp": "Usually the more damaging error, so precision matters."}, {"id": 1721, "q": "For a fraud detection system, which metric matters most if missing fraud is very costly?", "options": {"A": "Precision", "B": "Specificity", "C": "Training accuracy", "D": "Recall"}, "ans": "D", "exp": "Catching genuine fraud cases takes priority over false alarms."}, {"id": 1722, "q": "In a multi-class problem, macro-averaged F1:", "options": {"A": "Weights each class equally regardless of its size", "B": "Weights each class by its support", "C": "Ignores small classes", "D": "Equals accuracy always"}, "ans": "A", "exp": "Micro-averaging weights by frequency instead."}, {"id": 1723, "q": "Which statement about the confusion matrix is TRUE?", "options": {"A": "It applies only to binary problems", "B": "It can be extended to any number of classes as a k × k table", "C": "It requires probability outputs", "D": "It measures training time"}, "ans": "B", "exp": "The diagonal holds the correct predictions."}, {"id": 1724, "q": "Reporting only training accuracy is unsafe because it:", "options": {"A": "Requires a test set anyway", "B": "Always underestimates performance", "C": "Is impossible to compute", "D": "Says nothing about performance on unseen data"}, "ans": "D", "exp": "A memorising model scores perfectly on data it has seen."}, {"id": 1725, "q": "A baseline model is useful in evaluation because it:", "options": {"A": "Guarantees high accuracy", "B": "Is always the final deployed model", "C": "Requires no data", "D": "Provides the minimum performance any real model must beat"}, "ans": "D", "exp": "Predicting the majority class is a common baseline."}, {"id": 1726, "q": "Which pair of metrics typically trade off against each other as the threshold moves?", "options": {"A": "Precision and recall", "B": "Accuracy and AUC", "C": "MSE and RMSE", "D": "Bias and epochs"}, "ans": "A", "exp": "Raising one usually lowers the other."}, {"id": 1727, "q": "A model with high precision but low recall can be described as:", "options": {"A": "Aggressive — flags almost everything", "B": "Perfectly balanced", "C": "Cautious — rarely flags a case, but is usually right when it does", "D": "Untrained"}, "ans": "C", "exp": "It misses many true cases."}, {"id": 1728, "q": "A model with high recall but low precision:", "options": {"A": "Is perfectly calibrated", "B": "Never predicts positive", "C": "Catches most true cases but raises many false alarms", "D": "Misses most true cases"}, "ans": "C", "exp": "Often acceptable in screening applications."}, {"id": 1729, "q": "The single most important reason to choose a metric before training is that it:", "options": {"A": "Defines what \"better\" means, and different metrics favour different models", "B": "Reduces memory use", "C": "Removes the need for validation", "D": "Speeds up training"}, "ans": "A", "exp": "Optimising the wrong metric produces the wrong model."}, {"id": 1730, "q": "Cross-entropy (log loss) as an evaluation metric differs from accuracy because it:", "options": {"A": "Ignores the predicted probabilities", "B": "Rewards well-calibrated confidence, not just the final label", "C": "Requires a confusion matrix", "D": "Can only be used in regression"}, "ans": "B", "exp": "Confident errors are penalised heavily."}, {"id": 1731, "q": "If two models have identical accuracy but different AUC, the one with higher AUC:", "options": {"A": "Is always worse", "B": "Has fewer parameters", "C": "Ranks positive cases above negative ones more reliably across thresholds", "D": "Trains faster"}, "ans": "C", "exp": "Accuracy reflects one threshold; AUC reflects all of them. Part 54: Validation, Tuning & Leakage II (Q1732–1761)"}, {"id": 1732, "q": "The purpose of the validation set is to:", "options": {"A": "Train the model weights", "B": "Provide the final unbiased performance estimate", "C": "Replace the training set", "D": "Guide model selection and hyperparameter tuning during development"}, "ans": "D", "exp": "The test set is reserved for the end."}, {"id": 1733, "q": "The training set is used to:", "options": {"A": "Choose hyperparameters", "B": "Update the model's internal parameters", "C": "Report final results", "D": "Detect data leakage"}, "ans": "B", "exp": "The model directly sees and fits this data."}, {"id": 1734, "q": "The \"golden rule\" of the test set is that it should be:", "options": {"A": "Touched only once, at the very end", "B": "Used repeatedly during development", "C": "The largest of the three splits", "D": "Identical to the validation set"}, "ans": "A", "exp": "Repeated use quietly turns it into a validation set."}, {"id": 1735, "q": "In k-fold cross-validation with k = 5, each model is trained on:", "options": {"A": "None of the folds", "B": "4 folds and validated on the remaining 1", "C": "1 fold and validated on 4", "D": "All 5 folds"}, "ans": "B", "exp": "The process repeats five times, rotating the held-out fold."}, {"id": 1736, "q": "The reported cross-validation score is usually the:", "options": {"A": "Worst fold's score", "B": "Score of the first fold only", "C": "Mean across the folds, often with the standard deviation", "D": "Best fold's score"}, "ans": "C", "exp": "The spread across folds indicates stability."}, {"id": 1737, "q": "Cross-validation is particularly valuable when:", "options": {"A": "The model has no hyperparameters", "B": "The dataset is small, so a single split would give a noisy estimate", "C": "The dataset is very large", "D": "There are no labels"}, "ans": "B", "exp": "Every observation serves as validation exactly once."}, {"id": 1738, "q": "The main cost of k-fold cross-validation is:", "options": {"A": "Loss of labels", "B": "Training the model k times instead of once", "C": "Increased overfitting", "D": "Reduced data usage"}, "ans": "B", "exp": "Compute scales linearly with k."}, {"id": 1739, "q": "Leave-One-Out cross-validation is k-fold where k equals:", "options": {"A": "The number of features", "B": "The number of training examples", "C": "10", "D": "2"}, "ans": "B", "exp": "Nearly unbiased but extremely expensive."}, {"id": 1740, "q": "Stratified k-fold is used for classification in order to:", "options": {"A": "Remove the minority class", "B": "Randomise the labels", "C": "Preserve class proportions within each fold", "D": "Reduce the number of folds"}, "ans": "C", "exp": "Essential when classes are imbalanced."}, {"id": 1741, "q": "For time-series data, ordinary k-fold cross-validation is invalid because it:", "options": {"A": "Allows the model to train on future data and validate on the past", "B": "Uses too many folds", "C": "Requires labels", "D": "Cannot compute a mean score"}, "ans": "A", "exp": "Forward-chaining splits respect chronology."}, {"id": 1742, "q": "Grid search performs hyperparameter tuning by:", "options": {"A": "Using gradient descent on hyperparameters", "B": "Choosing values arbitrarily", "C": "Sampling combinations at random", "D": "Exhaustively evaluating every combination in a specified grid"}, "ans": "D", "exp": "Thorough but expensive as dimensions grow."}, {"id": 1743, "q": "Random search often outperforms grid search per unit of compute because:", "options": {"A": "It never samples poor values", "B": "It evaluates more combinations in total", "C": "It requires no validation set", "D": "It explores more distinct values of the hyperparameters that actually matter"}, "ans": "D", "exp": "Grid search wastes trials on unimportant dimensions."}, {"id": 1744, "q": "GridSearchCV in scikit-learn combines:", "options": {"A": "Grid search with cross-validation", "B": "Clustering with classification", "C": "Random search with bootstrapping", "D": "Gradient descent with early stopping"}, "ans": "A", "exp": "Each candidate configuration is scored by cross-validation."}, {"id": 1745, "q": "Bayesian optimisation for hyperparameter tuning is attractive because it:", "options": {"A": "Uses past evaluations to choose promising configurations next", "B": "Evaluates every possible combination", "C": "Requires no objective function", "D": "Works only on neural networks"}, "ans": "A", "exp": "Efficient when each evaluation is expensive."}, {"id": 1746, "q": "Data leakage is best defined as:", "options": {"A": "Missing values in a column", "B": "A security breach of the database", "C": "Information unavailable at prediction time influencing training", "D": "The loss of data during transfer"}, "ans": "C", "exp": "It produces results too good to be true."}, {"id": 1747, "q": "Which is a classic leakage mistake described in class?", "options": {"A": "Fitting the scaler on the combined train and test data before splitting", "B": "Applying stratified sampling", "C": "Reporting the standard deviation of fold scores", "D": "Using a validation set"}, "ans": "A", "exp": "The scaler encodes test-set statistics into training."}, {"id": 1748, "q": "The correct approach when applying preprocessing with cross-validation is to:", "options": {"A": "Preprocess everything once at the start", "B": "Skip preprocessing entirely", "C": "Preprocess only the test set", "D": "Fit preprocessing inside each fold, on that fold's training portion only"}, "ans": "D", "exp": "This is exactly what sklearn Pipelines enforce."}, {"id": 1749, "q": "A sklearn Pipeline is valuable mainly because it:", "options": {"A": "Makes code shorter only", "B": "Increases model accuracy directly", "C": "Ensures preprocessing steps are fitted within cross-validation folds, preventing leakage", "D": "Removes hyperparameters"}, "ans": "C", "exp": "Correctness, not just convenience."}, {"id": 1750, "q": "Overfitting to the validation set happens when:", "options": {"A": "The validation set is never used", "B": "Cross-validation is used", "C": "The training set is large", "D": "Many configurations are tried until one scores well by chance"}, "ans": "D", "exp": "The reason a final untouched test set matters."}, {"id": 1751, "q": "A large gap between cross-validation score and test score suggests:", "options": {"A": "Too few epochs", "B": "Possible leakage, distribution shift, or validation overfitting", "C": "The model generalises perfectly", "D": "The learning rate is too low"}, "ans": "B", "exp": "Worth investigating before deployment."}, {"id": 1752, "q": "Early stopping halts training when:", "options": {"A": "Training loss reaches zero", "B": "The dataset is exhausted once", "C": "Validation performance stops improving for a set number of rounds", "D": "The learning rate reaches zero"}, "ans": "C", "exp": "A form of regularisation via training time."}, {"id": 1753, "q": "The \"patience\" parameter in early stopping specifies:", "options": {"A": "The learning rate", "B": "The number of folds", "C": "How many epochs to wait without improvement before stopping", "D": "The batch size"}, "ans": "C", "exp": "It avoids stopping on a single noisy epoch."}, {"id": 1754, "q": "If a model performs well in cross-validation but poorly in production, the most likely explanation is:", "options": {"A": "The model has too few parameters", "B": "Production data differs from the data used to build the model", "C": "The code did not compile", "D": "Cross-validation is invalid in principle"}, "ans": "B", "exp": "Distribution shift is the classic production failure."}, {"id": 1755, "q": "Nested cross-validation is used to:", "options": {"A": "Tune hyperparameters and estimate generalisation without bias from the tuning itself", "B": "Speed up training", "C": "Reduce the dataset size", "D": "Replace the training set"}, "ans": "A", "exp": "An inner loop tunes; an outer loop evaluates."}, {"id": 1756, "q": "When the dataset is very large, a simple hold-out split is often preferred to k-fold because:", "options": {"A": "A single split already gives a stable estimate at far lower cost", "B": "Hold-out is more accurate in every case", "C": "k-fold cannot handle large data", "D": "Labels are unnecessary"}, "ans": "A", "exp": "The variance of the estimate shrinks with size."}, {"id": 1757, "q": "Group k-fold is required when:", "options": {"A": "Multiple rows belong to the same entity, such as several images of one patient", "B": "All rows are independent", "C": "The classes are balanced", "D": "The data is time-ordered"}, "ans": "A", "exp": "Otherwise the same patient appears in train and validation."}, {"id": 1758, "q": "Which of the following would NOT cause optimistic performance estimates?", "options": {"A": "Fitting imputation on the full dataset", "B": "Duplicate rows spanning train and test", "C": "Selecting features using the whole dataset before splitting", "D": "Using a separate, untouched test set"}, "ans": "D", "exp": "That is the correct procedure."}, {"id": 1759, "q": "Feature selection performed on the entire dataset before splitting causes leakage because:", "options": {"A": "It changes the labels", "B": "It reduces the number of rows", "C": "It requires cross-validation", "D": "The choice of features was informed by the test data"}, "ans": "D", "exp": "Selection is itself a model-fitting decision."}, {"id": 1760, "q": "The most reliable evidence that a model will work in production is:", "options": {"A": "A large number of parameters", "B": "Strong performance on data that resembles genuine future inputs and was never used in development", "C": "Fast training time", "D": "High training accuracy"}, "ans": "B", "exp": "Ideally confirmed by a live A/B test."}, {"id": 1761, "q": "A validation curve plots model performance against:", "options": {"A": "The number of classes", "B": "The number of rows in the dataset", "C": "The value of a single hyperparameter", "D": "Elapsed wall-clock time"}, "ans": "C", "exp": "A learning curve instead varies the training set size. Part 55: Clustering & Unsupervised Learning II (Q1762–1791)"}, {"id": 1762, "q": "The k in k-means refers to:", "options": {"A": "The number of clusters chosen in advance", "B": "The number of training examples", "C": "The number of iterations", "D": "The number of features"}, "ans": "A", "exp": "It must be specified before the algorithm runs."}, {"id": 1763, "q": "The k-means algorithm alternates between two steps:", "options": {"A": "Encoding and decoding", "B": "Assigning points to the nearest centroid, then recomputing centroids", "C": "Splitting and pruning nodes", "D": "Forward and backward passes"}, "ans": "B", "exp": "Repeated until assignments stop changing."}, {"id": 1764, "q": "k-means centroids are initialised:", "options": {"A": "At the data's maximum values", "B": "By the user, manually, in every implementation", "C": "Always at the origin", "D": "Randomly, or by a smarter scheme such as k-means++"}, "ans": "D", "exp": "Initialisation strongly affects the final result."}, {"id": 1765, "q": "k-means++ improves on random initialisation by:", "options": {"A": "Using more clusters", "B": "Skipping the assignment step", "C": "Removing outliers first", "D": "Choosing initial centres that are spread far apart"}, "ans": "D", "exp": "It reduces the chance of a poor local optimum."}, {"id": 1766, "q": "Running k-means several times with different seeds is recommended because the algorithm:", "options": {"A": "Requires labels", "B": "Never converges", "C": "Can converge to different local optima depending on initialisation", "D": "Is fully deterministic"}, "ans": "C", "exp": "The best run by inertia is usually kept."}, {"id": 1767, "q": "The objective k-means minimises is:", "options": {"A": "Between-cluster distance", "B": "Within-cluster sum of squared distances to the centroids", "C": "Cross-entropy", "D": "Classification error"}, "ans": "B", "exp": "Often reported as inertia."}, {"id": 1768, "q": "In the elbow method, the point of interest is where:", "options": {"A": "Inertia starts increasing", "B": "The number of features equals k", "C": "The rate of decrease in inertia sharply slows", "D": "Inertia reaches zero"}, "ans": "C", "exp": "Adding further clusters buys little after the bend."}, {"id": 1769, "q": "Inertia always decreases as k increases, which means that:", "options": {"A": "Inertia alone cannot select k", "B": "k-means cannot be evaluated", "C": "The largest k is always best", "D": "Inertia is meaningless"}, "ans": "A", "exp": "With k equal to the number of points, inertia reaches zero."}, {"id": 1770, "q": "The silhouette score measures:", "options": {"A": "The number of iterations to converge", "B": "How similar a point is to its own cluster compared with other clusters", "C": "Training time", "D": "The number of features"}, "ans": "B", "exp": "Values near 1 indicate well-separated clusters."}, {"id": 1771, "q": "A silhouette score close to 0 for many points indicates:", "options": {"A": "Excellent separation", "B": "Points lying near the boundary between clusters", "C": "Missing data", "D": "A perfect model"}, "ans": "B", "exp": "Negative values suggest points assigned to the wrong cluster."}, {"id": 1772, "q": "k-means assumes clusters that are:", "options": {"A": "Nested inside one another", "B": "Roughly spherical and similar in size", "C": "Arbitrary elongated shapes", "D": "Defined by density only"}, "ans": "B", "exp": "Which is why it fails on crescent-shaped data."}, {"id": 1773, "q": "Feature scaling is essential before k-means because the algorithm:", "options": {"A": "Uses distances, which are dominated by large-scale features", "B": "Ignores the features entirely", "C": "Cannot handle numeric data", "D": "Requires categorical inputs"}, "ans": "A", "exp": "Income in naira would swamp age in years."}, {"id": 1774, "q": "k-means is sensitive to outliers because centroids are computed as:", "options": {"A": "Random points", "B": "Modes", "C": "Means, which are pulled toward extreme values", "D": "Medians"}, "ans": "C", "exp": "k-medoids is the more robust alternative."}, {"id": 1775, "q": "A key limitation of k-means is that it:", "options": {"A": "Cannot be run more than once", "B": "Requires labelled data", "C": "Works only in two dimensions", "D": "Requires k to be specified in advance"}, "ans": "D", "exp": "Choosing k is itself a modelling decision."}, {"id": 1776, "q": "Hierarchical agglomerative clustering works by:", "options": {"A": "Assigning points to k fixed centroids", "B": "Training a neural network", "C": "Splitting one large cluster repeatedly only", "D": "Starting with every point as its own cluster and merging the closest pairs"}, "ans": "D", "exp": "A bottom-up procedure."}, {"id": 1777, "q": "The diagram showing the merge history of hierarchical clustering is a:", "options": {"A": "ROC curve", "B": "Scatter plot", "C": "Dendrogram", "D": "Confusion matrix"}, "ans": "C", "exp": "Cutting it at a chosen height yields the clusters."}, {"id": 1778, "q": "An advantage of hierarchical clustering over k-means is that it:", "options": {"A": "Requires no distance measure", "B": "Does not require the number of clusters to be fixed in advance", "C": "Always finds the global optimum", "D": "Runs faster on very large datasets"}, "ans": "B", "exp": "You choose where to cut afterwards."}, {"id": 1779, "q": "DBSCAN defines clusters as:", "options": {"A": "Equal-sized partitions", "B": "Nodes of a decision tree", "C": "Regions of high point density separated by sparse regions", "D": "Points nearest to k centroids"}, "ans": "C", "exp": "Density-Based Spatial Clustering of Applications with Noise."}, {"id": 1780, "q": "A distinctive strength of DBSCAN is that it:", "options": {"A": "Can find arbitrarily shaped clusters and label outliers as noise", "B": "Requires k in advance", "C": "Always produces spherical clusters", "D": "Needs labelled data"}, "ans": "A", "exp": "Points in no dense region are simply not assigned."}, {"id": 1781, "q": "DBSCAN's two main parameters are:", "options": {"A": "Depth and number of trees", "B": "k and the learning rate", "C": "Batch size and epochs", "D": "eps (neighbourhood radius) and minPts (minimum neighbours)"}, "ans": "D", "exp": "Both must be chosen with care."}, {"id": 1782, "q": "Customer segmentation for a marketing campaign is a natural application of:", "options": {"A": "Binary classification with labels", "B": "Linear reg
