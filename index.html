ression", "C": "Clustering", "D": "Backpropagation"}, "ans": "C", "exp": "No predefined segment labels exist."}, {"id": 1783, "q": "Document clustering groups texts by:", "options": {"A": "Creation date only", "B": "File size", "C": "Alphabetical order of filenames", "D": "Similarity of content after conversion to numeric vectors"}, "ans": "D", "exp": "Topics emerge without predefined categories."}, {"id": 1784, "q": "Anomaly detection can be framed as an unsupervised task because:", "options": {"A": "Normal behaviour can be modelled and deviations flagged without anomaly labels", "B": "It requires balanced classes", "C": "It uses cross-entropy only", "D": "Anomalies are always labelled"}, "ans": "A", "exp": "Genuine anomalies are usually too rare to label well."}, {"id": 1785, "q": "PCA is described as unsupervised because it:", "options": {"A": "Requires reinforcement signals", "B": "Cannot be computed without classes", "C": "Uses only the input features, ignoring any labels", "D": "Uses the target labels to find components"}, "ans": "C", "exp": "It finds directions of maximum variance in x alone."}, {"id": 1786, "q": "The first principal component is the direction that:", "options": {"A": "Has the smallest variance", "B": "Best separates the classes", "C": "Is always the first original feature", "D": "Captures the most variance in the data"}, "ans": "D", "exp": "Later components are orthogonal to it, capturing progressively less."}, {"id": 1787, "q": "Choosing how many principal components to keep is commonly guided by:", "options": {"A": "The class count", "B": "The learning rate", "C": "The cumulative proportion of variance explained", "D": "The number of rows"}, "ans": "C", "exp": "Retaining components up to, say, 95% of variance."}, {"id": 1788, "q": "A drawback of PCA is that the resulting components are:", "options": {"A": "Unable to reduce dimensionality", "B": "Linear combinations of original features and therefore harder to interpret", "C": "Always fewer than two", "D": "Identical to the original features"}, "ans": "B", "exp": "\"Component 1\" has no natural business meaning."}, {"id": 1789, "q": "t-SNE is used mainly for:", "options": {"A": "Reducing training time", "B": "Visualising high-dimensional data in two or three dimensions", "C": "Training classifiers", "D": "Predicting continuous targets"}, "ans": "B", "exp": "Distances between well-separated clusters should not be over-interpreted."}, {"id": 1790, "q": "Which task is NOT unsupervised?", "options": {"A": "Predicting house prices from labelled sales", "B": "PCA", "C": "Density-based anomaly detection without labels", "D": "k-means clustering"}, "ans": "A", "exp": "Labelled targets make it supervised."}, {"id": 1791, "q": "Evaluating clustering is harder than evaluating classification because:", "options": {"A": "There is no ground-truth label to compare against", "B": "Distances cannot be computed", "C": "The algorithms never converge", "D": "Clusters cannot be visualised"}, "ans": "A", "exp": "Internal measures such as silhouette are used instead. Part 56: Neural Network Fundamentals II (Q1792–1821)"}, {"id": 1792, "q": "A single artificial neuron computes:", "options": {"A": "The median of its inputs", "B": "A weighted sum of its inputs plus a bias, passed through an activation function", "C": "The product of all inputs only", "D": "A random value"}, "ans": "B", "exp": "z = Σwᵢxᵢ + b, then a = f(z)."}, {"id": 1793, "q": "In the equation z = w₁x₁ + w₂x₂ + … + wₙxₙ + b, the weights represent:", "options": {"A": "The number of layers", "B": "The importance the neuron assigns to each input", "C": "The learning rate", "D": "The output classes"}, "ans": "B", "exp": "They are learned during training."}, {"id": 1794, "q": "The bias term allows a neuron to:", "options": {"A": "Shift its activation threshold independently of the inputs", "B": "Remove the activation function", "C": "Increase the number of inputs", "D": "Reduce the learning rate"}, "ans": "A", "exp": "Without it the decision boundary must pass through the origin."}, {"id": 1795, "q": "An input layer of a neural network:", "options": {"A": "Contains the output classes", "B": "Always has one neuron", "C": "Applies an activation function to raw data", "D": "Holds the raw feature values and performs no computation"}, "ans": "D", "exp": "Which is why it is excluded from the layer count."}, {"id": 1796, "q": "A network described as having 3072 → 100 → 10 units has:", "options": {"A": "3072 hidden units", "B": "Ten hidden layers", "C": "One hidden layer of 100 units", "D": "Three hidden layers"}, "ans": "C", "exp": "Input 3072, hidden 100, output 10."}, {"id": 1797, "q": "In a fully-connected layer with 100 inputs and 50 outputs, the number of weights (excluding biases) is:", "options": {"A": "150", "B": "100", "C": "5 000", "D": "50"}, "ans": "C", "exp": "100 × 50, plus 50 bias terms."}, {"id": 1798, "q": "The output layer of a network performing 10-class classification typically has:", "options": {"A": "10 neurons with a softmax activation", "B": "100 neurons", "C": "1 neuron", "D": "2 neurons"}, "ans": "A", "exp": "One score per class, normalised to probabilities."}, {"id": 1799, "q": "A multilayer perceptron is characterised by:", "options": {"A": "Decision splits", "B": "Recurrent connections", "C": "Convolutional filters", "D": "Fully-connected layers with non-linear activations"}, "ans": "D", "exp": "The classic feed-forward architecture."}, {"id": 1800, "q": "The Universal Approximation Theorem states that a network with one hidden layer can:", "options": {"A": "Train without data", "B": "Solve any problem in constant time", "C": "Always generalise perfectly", "D": "Approximate any continuous function to arbitrary accuracy, given enough units"}, "ans": "D", "exp": "It says nothing about how easily such weights can be found."}, {"id": 1801, "q": "Deep networks are often preferred to very wide shallow ones because they:", "options": {"A": "Cannot overfit", "B": "Avoid the need for activation functions", "C": "Require fewer training examples in every case", "D": "Build hierarchical representations more parameter-efficiently"}, "ans": "D", "exp": "Later layers compose features found by earlier ones."}, {"id": 1802, "q": "A forward pass through a network computes:", "options": {"A": "Gradients with respect to the weights", "B": "The confusion matrix", "C": "Outputs from inputs, layer by layer", "D": "The learning rate schedule"}, "ans": "C", "exp": "The backward pass then computes gradients."}, {"id": 1803, "q": "Weights in a neural network should be initialised:", "options": {"A": "All to one", "B": "To very large values", "C": "All to zero", "D": "To small random values that break symmetry between neurons"}, "ans": "D", "exp": "Identical weights would give identical gradients forever."}, {"id": 1804, "q": "Initialising all weights to zero causes:", "options": {"A": "Every neuron in a layer to learn the same thing", "B": "An error at compile time", "C": "Faster convergence", "D": "An immediate perfect fit"}, "ans": "A", "exp": "The symmetry is never broken."}, {"id": 1805, "q": "Xavier and He initialisation set the initial weight scale based on:", "options": {"A": "The learning rate", "B": "The batch size", "C": "The number of classes", "D": "The number of input and output connections of the layer"}, "ans": "D", "exp": "This keeps activation variance stable across layers."}, {"id": 1806, "q": "An epoch is completed when:", "options": {"A": "The learning rate decays", "B": "One minibatch has been processed", "C": "The entire training set has been passed through the network once", "D": "The loss reaches zero"}, "ans": "C", "exp": "Training usually runs for many epochs."}, {"id": 1807, "q": "With 10 000 training examples and a batch size of 100, one epoch consists of:", "options": {"A": "100 updates", "B": "10 000 updates", "C": "1 update", "D": "1 000 updates"}, "ans": "A", "exp": "10 000 / 100 = 100 minibatches."}, {"id": 1808, "q": "A larger batch size generally gives:", "options": {"A": "Fewer parameters", "B": "Smoother gradient estimates and better hardware utilisation, but less regularising noise", "C": "Noisier gradients and slower hardware utilisation", "D": "Guaranteed better generalisation"}, "ans": "B", "exp": "Very large batches can generalise slightly worse."}, {"id": 1809, "q": "The vanishing gradient problem is most severe with:", "options": {"A": "Saturating activations such as sigmoid in deep networks", "B": "ReLU activations in shallow networks", "C": "Linear activations", "D": "Large learning rates only"}, "ans": "A", "exp": "Repeated multiplication by small derivatives shrinks the signal."}, {"id": 1810, "q": "Exploding gradients are commonly controlled by:", "options": {"A": "Adding more layers", "B": "Removing the bias terms", "C": "Gradient clipping", "D": "Increasing the learning rate"}, "ans": "C", "exp": "The gradient norm is capped at a threshold."}, {"id": 1811, "q": "Residual (skip) connections help train very deep networks by:", "options": {"A": "Eliminating the loss function", "B": "Providing a direct path for gradients to flow backwards", "C": "Reducing the number of layers", "D": "Removing the activation functions"}, "ans": "B", "exp": "They address degradation in very deep stacks."}, {"id": 1812, "q": "Dropout regularises a network by:", "options": {"A": "Deleting layers permanently", "B": "Randomly deactivating a fraction of units during training", "C": "Removing training examples", "D": "Reducing the learning rate over time"}, "ans": "B", "exp": "It prevents units from co-adapting."}, {"id": 1813, "q": "At inference time, dropout is:", "options": {"A": "Applied twice", "B": "Switched off, with activations scaled appropriately", "C": "Applied with the same probability as during training", "D": "Replaced by batch normalisation"}, "ans": "B", "exp": "Predictions must be deterministic."}, {"id": 1814, "q": "Batch normalisation normalises:", "options": {"A": "Layer activations using statistics computed over the minibatch", "B": "The labels", "C": "The raw input images only", "D": "The learning rate"}, "ans": "A", "exp": "It permits higher learning rates and faster convergence."}, {"id": 1815, "q": "The biological neuron analogy is described in class as:", "options": {"A": "Applicable only to CNNs", "B": "Exact in every respect", "C": "Loose — real dendrites, synapses and firing patterns are far more complex", "D": "Entirely without foundation"}, "ans": "C", "exp": "\"Be very careful with your brain analogies.\""}, {"id": 1816, "q": "A neural network without any non-linear activation function is equivalent to:", "options": {"A": "A deep hierarchy of features", "B": "A decision tree", "C": "A clustering algorithm", "D": "A single linear model, regardless of depth"}, "ans": "D", "exp": "Composed linear maps collapse into one linear map."}, {"id": 1817, "q": "The number of parameters in a network is a rough proxy for its:", "options": {"A": "Number of classes", "B": "Learning rate", "C": "Training speed only", "D": "Capacity to fit complex functions"}, "ans": "D", "exp": "Higher capacity raises the risk of overfitting on small data."}, {"id": 1818, "q": "Feed-forward means that information flows:", "options": {"A": "From input to output without loops", "B": "Between neurons in the same layer", "C": "In cycles between layers", "D": "Backwards only"}, "ans": "A", "exp": "Recurrent networks are the ones with cycles."}, {"id": 1819, "q": "Which is the correct sequence for one training step?", "options": {"A": "Compute loss → update weights → forward pass", "B": "Forward pass → compute loss → backward pass → update weights", "C": "Update weights → forward pass → compute loss", "D": "Backward pass → forward pass → compute loss"}, "ans": "B", "exp": "The cycle repeats for every minibatch."}, {"id": 1820, "q": "Training a neural network is fundamentally an exercise in:", "options": {"A": "Counting the number of layers", "B": "Compressing the dataset", "C": "Minimising a loss function with respect to the parameters", "D": "Sorting the training data"}, "ans": "C", "exp": "Optimisation is the engine underneath."}, {"id": 1821, "q": "If a network's training loss falls steadily while validation loss rises, you should:", "options": {"A": "Remove the validation set", "B": "Increase the number of parameters", "C": "Continue training for many more epochs", "D": "Apply regularisation or stop early"}, "ans": "D", "exp": "The divergence point marks the onset of overfitting. Part 57: Activation Functions & Training Dynamics (Q1822–1851)"}, {"id": 1822, "q": "The essential role of an activation function is to:", "options": {"A": "Introduce non-linearity so the network can model complex relationships", "B": "Select the learning rate", "C": "Normalise the labels", "D": "Reduce the number of parameters"}, "ans": "A", "exp": "Without it, depth adds no expressive power."}, {"id": 1823, "q": "ReLU is defined as:", "options": {"A": "max(0, x)", "B": "1/(1 + e^(−x))", "C": "tanh(x)", "D": "x²"}, "ans": "A", "exp": "Zero for negative inputs, identity for positive."}, {"id": 1824, "q": "The main advantage of ReLU over sigmoid is that it:", "options": {"A": "Outputs values between 0 and 1", "B": "Does not saturate for positive inputs, so gradients flow better", "C": "Always produces negative outputs", "D": "Is smoother everywhere"}, "ans": "B", "exp": "It also costs almost nothing to compute."}, {"id": 1825, "q": "The \"dying ReLU\" problem occurs when a unit:", "options": {"A": "Has too many connections", "B": "Outputs very large values", "C": "Always receives negative input, so its gradient is zero and it stops learning", "D": "Produces probabilities"}, "ans": "C", "exp": "The unit is effectively dead for the rest of training."}, {"id": 1826, "q": "Leaky ReLU addresses the dying ReLU problem by:", "options": {"A": "Squashing outputs to (0, 1)", "B": "Removing negative inputs entirely", "C": "Adding a bias term", "D": "Allowing a small non-zero slope for negative inputs"}, "ans": "D", "exp": "Typically f(x) = x for x > 0 and 0.01x otherwise."}, {"id": 1827, "q": "The tanh activation outputs values in the range:", "options": {"A": "(0, 1)", "B": "All real numbers", "C": "(−1, 1)", "D": "[0, ∞)"}, "ans": "C", "exp": "Zero-centred, unlike sigmoid."}, {"id": 1828, "q": "Tanh is often preferred to sigmoid in hidden layers because it is:", "options": {"A": "Linear", "B": "Faster to compute", "C": "Free of saturation", "D": "Zero-centred, which tends to speed up convergence"}, "ans": "D", "exp": "Both still saturate at the extremes."}, {"id": 1829, "q": "The sigmoid activation is still used in:", "options": {"A": "The output layer for binary classification", "B": "Convolutional filters", "C": "Pooling layers", "D": "Every hidden layer of modern deep networks"}, "ans": "A", "exp": "Its (0,1) output is exactly a probability."}, {"id": 1830, "q": "Softmax differs from sigmoid in that softmax:", "options": {"A": "Operates on a single value independently", "B": "Is used only in hidden layers", "C": "Produces outputs that sum to 1 across all classes", "D": "Outputs negative values"}, "ans": "C", "exp": "The classes compete for probability mass."}, {"id": 1831, "q": "ELU (Exponential Linear Unit) differs from ReLU by:", "options": {"A": "Producing outputs above 1 only", "B": "Saturating to a negative value for large negative inputs", "C": "Being exactly zero everywhere", "D": "Having no gradient"}, "ans": "B", "exp": "This pushes mean activations closer to zero."}, {"id": 1832, "q": "Maxout units compute:", "options": {"A": "A fixed constant", "B": "The maximum over several linear functions of the input", "C": "The sigmoid of the sum", "D": "The mean of the inputs"}, "ans": "B", "exp": "Generalising ReLU and Leaky ReLU at the cost of more parameters."}, {"id": 1833, "q": "The derivative of ReLU for positive inputs is:", "options": {"A": "0", "B": "x", "C": "Undefined", "D": "1"}, "ans": "D", "exp": "And 0 for negative inputs, which is what stalls dead units."}, {"id": 1834, "q": "The derivative of the sigmoid reaches its maximum value of:", "options": {"A": "0.5", "B": "1.0", "C": "0.25", "D": "0"}, "ans": "C", "exp": "At z = 0; repeated multiplication by ≤0.25 causes vanishing gradients."}, {"id": 1835, "q": "For a hidden layer in a modern deep network, the usual default activation is:", "options": {"A": "Softmax", "B": "A linear function", "C": "ReLU or one of its variants", "D": "Sigmoid"}, "ans": "C", "exp": "Simple, fast and empirically effective."}, {"id": 1836, "q": "For a regression output layer predicting an unbounded quantity, the appropriate activation is:", "options": {"A": "Sigmoid", "B": "No activation — a linear output", "C": "ReLU always", "D": "Softmax"}, "ans": "B", "exp": "Squashing would restrict the achievable range."}, {"id": 1837, "q": "A learning curve that plateaus at a high loss for both training and validation indicates:", "options": {"A": "Underfitting — insufficient capacity or training", "B": "Perfect generalisation", "C": "Data leakage", "D": "Overfitting"}, "ans": "A", "exp": "The model cannot even fit the training data."}, {"id": 1838, "q": "A training loss that decreases while validation loss increases indicates:", "options": {"A": "A learning rate that is too small", "B": "Overfitting", "C": "Vanishing gradients", "D": "Underfitting"}, "ans": "B", "exp": "Stop at the divergence point."}, {"id": 1839, "q": "If the loss becomes NaN during training, the most common cause is:", "options": {"A": "Using ReLU", "B": "Too small a learning rate", "C": "Too many training examples", "D": "Numerical instability from an excessive learning rate or exploding gradients"}, "ans": "D", "exp": "Lowering the learning rate is the first thing to try."}, {"id": 1840, "q": "A loss curve that oscillates wildly between epochs usually suggests:", "options": {"A": "The learning rate is too high or the batch size too small", "B": "Dropout is disabled", "C": "The dataset is too large", "D": "The model has converged"}, "ans": "A", "exp": "Reduce the step size or increase the batch."}, {"id": 1841, "q": "Learning rate schedules reduce the learning rate over training in order to:", "options": {"A": "Add more parameters", "B": "Take large steps early and fine, careful steps near the minimum", "C": "Reduce the dataset size", "D": "Increase the loss deliberately"}, "ans": "B", "exp": "Step, cosine and exponential decay are common."}, {"id": 1842, "q": "Learning rate warmup increases the rate gradually at the start of training to:", "options": {"A": "Skip the first epoch", "B": "Avoid destabilising updates while weights are still random", "C": "Reduce the batch size", "D": "Save memory"}, "ans": "B", "exp": "Especially useful with large batches."}, {"id": 1843, "q": "If a model achieves 100% training accuracy within the first epoch, you should suspect:", "options": {"A": "An excellent model", "B": "Vanishing gradients", "C": "Data leakage or a trivially easy target", "D": "An underfitted model"}, "ans": "C", "exp": "Real problems rarely fall that easily."}, {"id": 1844, "q": "Gradient checking compares analytic gradients against:", "options": {"A": "Numerical gradients computed by finite differences", "B": "The batch size", "C": "The loss value", "D": "The learning rate"}, "ans": "A", "exp": "A standard way to catch implementation bugs."}, {"id": 1845, "q": "Weight decay is another name for:", "options": {"A": "Early stopping", "B": "Learning rate decay", "C": "Dropout", "D": "L2 regularisation applied to the weights"}, "ans": "D", "exp": "It shrinks weights toward zero each update."}, {"id": 1846, "q": "Increasing model capacity when the model is already overfitting will typically:", "options": {"A": "Make overfitting worse", "B": "Fix vanishing gradients", "C": "Improve validation performance", "D": "Have no effect"}, "ans": "A", "exp": "Regularise or add data instead."}, {"id": 1847, "q": "The most reliable cure for overfitting, when available, is:", "options": {"A": "Fewer evaluation metrics", "B": "More layers", "C": "More representative training data", "D": "A higher learning rate"}, "ans": "C", "exp": "Regularisation is a substitute for data you do not have."}, {"id": 1848, "q": "If training and validation loss are both still falling when training ends, you should:", "options": {"A": "Add dropout", "B": "Reduce the model size", "C": "Stop and deploy immediately", "D": "Train for longer"}, "ans": "D", "exp": "The model has not yet converged."}, {"id": 1849, "q": "Normalising input features before training a neural network helps because it:", "options": {"A": "Reduces the number of classes", "B": "Keeps activations and gradients in a well-conditioned range", "C": "Changes the labels", "D": "Removes the need for a bias"}, "ans": "B", "exp": "Unscaled inputs produce erratic updates."}, {"id": 1850, "q": "Shuffling the training data between epochs is important because:", "options": {"A": "It reduces the dataset size", "B": "It increases the learning rate", "C": "It prevents the model from learning patterns tied to example ordering", "D": "It removes outliers"}, "ans": "C", "exp": "Especially important if the data is sorted by class."}, {"id": 1851, "q": "Transfer learning is attractive for a small image dataset because:", "options": {"A": "Features learned on a large dataset can be reused, needing far less new data", "B": "It only works with linear models", "C": "It requires no labels at all", "D": "It removes overfitting entirely"}, "ans": "A", "exp": "Early layers learn generic edges and textures. Part 58: Backpropagation II (Q1852–1881)"}, {"id": 1852, "q": "Backpropagation exists because, for large networks:", "options": {"A": "Forward passes are too slow", "B": "The loss is always zero", "C": "Gradients cannot be defined", "D": "Writing gradient formulas by hand for every parameter is impractical"}, "ans": "D", "exp": "The graph structure lets gradients be computed mechanically."}, {"id": 1853, "q": "The mathematical rule underpinning backpropagation is:", "options": {"A": "The pigeonhole principle", "B": "The central limit theorem", "C": "Bayes' theorem", "D": "The chain rule of calculus"}, "ans": "D", "exp": "Applied recursively along the computational graph."}, {"id": 1854, "q": "In the backward pass, information flows:", "options": {"A": "In a random order", "B": "Only within a single layer", "C": "From the loss backwards toward the inputs and parameters", "D": "From inputs toward the loss"}, "ans": "C", "exp": "Each node receives an upstream gradient."}, {"id": 1855, "q": "The \"upstream gradient\" at a node is:", "options": {"A": "The derivative of the final loss with respect to that node's output", "B": "The learning rate", "C": "The node's weight", "D": "The node's own input value"}, "ans": "A", "exp": "It arrives from the layer closer to the loss."}, {"id": 1856, "q": "The \"local gradient\" at a node is:", "options": {"A": "The full derivative of the loss", "B": "The batch size", "C": "The activation value", "D": "The derivative of the node's output with respect to its input"}, "ans": "D", "exp": "It depends only on the node's own operation."}, {"id": 1857, "q": "For f = x·y with x = 3 and y = −2, the local gradient ∂f/∂x is:", "options": {"A": "3", "B": "−2", "C": "−6", "D": "1"}, "ans": "B", "exp": "For a multiplication gate, each input's gradient is the other input."}, {"id": 1858, "q": "For f = x + y, the local gradients with respect to both x and y are:", "options": {"A": "1 and 1", "B": "y and x", "C": "x and y", "D": "0 and 0"}, "ans": "A", "exp": "Which is why the add gate simply distributes the gradient."}, {"id": 1859, "q": "A max gate with inputs 4 and 7 passes the upstream gradient to:", "options": {"A": "The input with value 4 only", "B": "Both inputs equally", "C": "The input with value 7 only", "D": "Neither input"}, "ans": "C", "exp": "The smaller input did not influence the output."}, {"id": 1860, "q": "The reason a multiplication gate is called a \"gradient switcher\" is that:", "options": {"A": "It reverses the sign of the gradient", "B": "Each input's gradient is scaled by the other input's forward value", "C": "It swaps the input values in the forward pass", "D": "It blocks the gradient entirely"}, "ans": "B", "exp": "A large input amplifies the other's gradient."}, {"id": 1861, "q": "If a very large input value multiplies a small one, backpropagation through that gate will:", "options": {"A": "Fail to compute", "B": "Produce equal gradients for both", "C": "Produce a large gradient for the small input and a small one for the large input", "D": "Produce zero gradients"}, "ans": "C", "exp": "A reason feature scaling matters."}, {"id": 1862, "q": "When a single variable feeds into two different downstream branches, its total gradient is:", "options": {"A": "Zero", "B": "The sum of the gradients from both branches", "C": "The product of the branch gradients", "D": "The larger of the two branch gradients"}, "ans": "B", "exp": "The multivariable chain rule adds contributions."}, {"id": 1863, "q": "In a computational graph, the forward pass must be completed before the backward pass because:", "options": {"A": "Local gradients depend on the values computed in the forward pass", "B": "Weights change during the forward pass", "C": "The loss is computed first alphabetically", "D": "The graph is destroyed afterwards"}, "ans": "A", "exp": "Which is why activations are cached in memory."}, {"id": 1864, "q": "The dominant memory cost of training a deep network comes from:", "options": {"A": "Storing the weights", "B": "The dataset file size", "C": "The learning rate schedule", "D": "Storing intermediate activations needed for the backward pass"}, "ans": "D", "exp": "Larger batches therefore consume more memory."}, {"id": 1865, "q": "For a sigmoid gate whose output is 0.9, the local gradient is:", "options": {"A": "0.5", "B": "0.09", "C": "0.9", "D": "1.0"}, "ans": "B", "exp": "σ(1 − σ) = 0.9 × 0.1 = 0.09."}, {"id": 1866, "q": "The sigmoid local gradient is largest when the output is:", "options": {"A": "Close to 1", "B": "Close to 0", "C": "Exactly 1", "D": "Close to 0.5"}, "ans": "D", "exp": "Saturated units at either extreme learn very slowly."}, {"id": 1867, "q": "Grouping several elementary operations into one gate with a known derivative is done to:", "options": {"A": "Simplify implementation and reduce the number of backward steps", "B": "Make gradients approximate", "C": "Change the mathematical result", "D": "Remove the need for a forward pass"}, "ans": "A", "exp": "Sigmoid is the standard example."}, {"id": 1868, "q": "For vector inputs and outputs, the local gradient generalises to:", "options": {"A": "A single row vector always", "B": "A scalar", "C": "The Jacobian matrix", "D": "The Hessian matrix"}, "ans": "C", "exp": "With dimensions output-size by input-size."}, {"id": 1869, "q": "For an element-wise operation on a 4096-dimensional vector, the Jacobian is:", "options": {"A": "Undefined", "B": "4096 × 4096 and diagonal, so never formed explicitly", "C": "1 × 1", "D": "Dense and must be stored"}, "ans": "B", "exp": "Each output depends only on the corresponding input."}, {"id": 1870, "q": "A useful sanity check during backpropagation implementation is that:", "options": {"A": "The gradient with respect to a variable has the same shape as that variable", "B": "Gradients must be integers", "C": "All gradients must be positive", "D": "Gradients must sum to 1"}, "ans": "A", "exp": "Shape mismatches expose bugs immediately."}, {"id": 1871, "q": "In a modular deep learning framework, each layer must implement:", "options": {"A": "A forward method and a backward method", "B": "A training loop", "C": "Only a forward method", "D": "A loss function"}, "ans": "A", "exp": "The framework then chains them automatically."}, {"id": 1872, "q": "Automatic differentiation in frameworks such as PyTorch works by:", "options": {"A": "Using random gradients", "B": "Numerically approximating every derivative", "C": "Recording the operations performed and applying the chain rule through that record", "D": "Asking the user for the derivative"}, "ans": "C", "exp": "The computational graph is built as the code runs."}, {"id": 1873, "q": "Backpropagation computes gradients; the actual change to the weights is made by:", "options": {"A": "The loss function", "B": "The activation function", "C": "The optimiser, using those gradients", "D": "The forward pass"}, "ans": "C", "exp": "Backprop and optimisation are separate steps."}, {"id": 1874, "q": "For f = (x + y)·z with x = −2, y = 5, z = −4, the forward value of f is:", "options": {"A": "3", "B": "−4", "C": "12", "D": "−12"}, "ans": "D", "exp": "q = 3, then f = 3 × (−4) = −12."}, {"id": 1875, "q": "In that same example, ∂f/∂q equals:", "options": {"A": "3", "B": "−12", "C": "−4", "D": "0"}, "ans": "C", "exp": "For f = qz, the derivative with respect to q is z."}, {"id": 1876, "q": "In that example, ∂f/∂x equals:", "options": {"A": "1", "B": "3", "C": "−12", "D": "−4"}, "ans": "D", "exp": "The add gate passes ∂f/∂q = −4 unchanged to x."}, {"id": 1877, "q": "Gradient checkpointing (activation recomputation) trades:", "options": {"A": "Data for labels", "B": "Extra computation for reduced memory", "C": "Memory for accuracy", "D": "Accuracy for speed"}, "ans": "B", "exp": "Some activations are recomputed rather than stored."}, {"id": 1878, "q": "Vanishing gradients arise in backpropagation because gradients are:", "options": {"A": "Added across layers", "B": "Multiplied across layers, so small factors compound", "C": "Randomly reset each layer", "D": "Divided by the batch size"}, "ans": "B", "exp": "Twenty layers of 0.25 factors leave almost nothing."}, {"id": 1879, "q": "If a layer's gradients are all exactly zero, the most likely explanation is:", "options": {"A": "Saturated or dead activations blocking the gradient", "B": "Too many training examples", "C": "A large batch size", "D": "The layer has converged perfectly"}, "ans": "A", "exp": "Dead ReLUs and saturated sigmoids both do this."}, {"id": 1880, "q": "Backpropagation is applied to the parameters of a network in order to:", "options": {"A": "Normalise the inputs", "B": "Compute the loss value", "C": "Select the architecture", "D": "Determine how each weight should change to reduce the loss"}, "ans": "D", "exp": "The gradient points in the direction of steepest increase."}, {"id": 1881, "q": "The computational cost of the backward pass is roughly:", "options": {"A": "Zero", "B": "A thousand times the forward pass", "C": "Of the same order as the forward pass, commonly around twice its cost", "D": "Negligible compared with the forward pass"}, "ans": "C", "exp": "Which is why training costs far more than inference. Part 59: Loss Functions & Regularisation II (Q1882–1911)"}, {"id": 1882, "q": "A loss function quantifies:", "options": {"A": "The number of parameters", "B": "The size of the dataset", "C": "How long training takes", "D": "How badly the model's predictions match the training data"}, "ans": "D", "exp": "The full loss averages the per-example losses."}, {"id": 1883, "q": "In the multiclass SVM loss, the margin constant is conventionally set to:", "options": {"A": "1", "B": "The number of classes", "C": "10", "D": "0"}, "ans": "A", "exp": "Its exact value is absorbed by the weight scale."}, {"id": 1884, "q": "For scores [10, 9, 9] where the correct class scores 10, with margin 1, the multiclass SVM loss is:", "options": {"A": "2", "B": "0", "C": "1", "D": "19"}, "ans": "B", "exp": "Each incorrect class contributes max(0, 9 − 10 + 1) = 0, so both margins are exactly met."}, {"id": 1885, "q": "If all class scores were identical and there are C classes, the multiclass SVM loss would equal:", "options": {"A": "C", "B": "0", "C": "1", "D": "C − 1"}, "ans": "D", "exp": "Each of the C−1 incorrect classes contributes exactly the margin."}, {"id": 1886, "q": "Checking that the initial loss equals C − 1 at the start of training is useful as:", "options": {"A": "A sanity check that the implementation is correct", "B": "A regularisation term", "C": "A learning rate schedule", "D": "A measure of final accuracy"}, "ans": "A", "exp": "With small random weights, all scores start near zero."}, {"id": 1887, "q": "The hinge loss is called \"hinge\" because the function:", "options": {"A": "Has no derivative anywhere", "B": "Oscillates periodically", "C": "Is zero once the margin is satisfied, then rises linearly", "D": "Is always quadratic"}, "ans": "C", "exp": "The kink at the margin gives it the name."}, {"id": 1888, "q": "Softmax loss differs from hinge loss in that softmax:", "options": {"A": "Requires exactly two classes", "B": "Stops caring once a margin is met", "C": "Cannot be used for classification", "D": "Continues to push for higher confidence even when the answer is already correct"}, "ans": "D", "exp": "It is never fully satisfied."}, {"id": 1889, "q": "For softmax probabilities [0.13, 0.87, 0.00] with the true class being the second, the loss is approximately:", "options": {"A": "−log(0.87) ≈ 0.14", "B": "0.87", "C": "0", "D": "−log(0.13) ≈ 2.04"}, "ans": "A", "exp": "Negative log likelihood of the correct class."}, {"id": 1890, "q": "The minimum and maximum values of the softmax loss are:", "options": {"A": "0 and 1", "B": "0 and infinity", "C": "−1 and 1", "D": "1 and C"}, "ans": "B", "exp": "Zero requires a predicted probability of exactly 1."}, {"id": 1891, "q": "Numerical stability in softmax is improved by:", "options": {"A": "Adding 1 to every score", "B": "Subtracting the maximum score before exponentiating", "C": "Removing the exponential", "D": "Dividing by the number of classes"}, "ans": "B", "exp": "This prevents overflow from large exponents."}, {"id": 1892, "q": "Regularisation is added to the loss because:", "options": {"A": "It increases training accuracy", "B": "It removes the need for data", "C": "The data loss alone may be minimised by many different weight settings", "D": "It speeds up the forward pass"}, "ans": "C", "exp": "It expresses a preference for simpler models."}, {"id": 1893, "q": "The principle \"among competing hypotheses, the simplest is best\" is known as:", "options": {"A": "The chain rule", "B": "Moravec's paradox", "C": "Occam's razor", "D": "Bayes' rule"}, "ans": "C", "exp": "Invoked in class to justify regularisation."}, {"id": 1894, "q": "In L = data loss + λR(W), increasing λ will:", "options": {"A": "Favour simpler models, potentially underfitting", "B": "Increase the number of parameters", "C": "Have no effect", "D": "Fit the training data more closely"}, "ans": "A", "exp": "λ controls the trade-off."}, {"id": 1895, "q": "Setting λ to zero means:", "options": {"A": "Training cannot proceed", "B": "No regularisation is applied", "C": "All weights become zero", "D": "The data loss is ignored"}, "ans": "B", "exp": "The model fits the data with no simplicity preference."}, {"id": 1896, "q": "Setting λ extremely large drives the weights toward:", "options": {"A": "Random values", "B": "Exactly one", "C": "Very large values", "D": "Zero, producing a severely underfitted model"}, "ans": "D", "exp": "The penalty dominates the data term."}, {"id": 1897, "q": "L2 regularisation prefers weight vectors that are:", "options": {"A": "Negative", "B": "Sparse, with most entries exactly zero", "C": "Very large in a single dimension", "D": "Diffuse, spreading influence across many features"}, "ans": "D", "exp": "It dislikes any single large weight."}, {"id": 1898, "q": "L1 regularisation is distinctive because it:", "options": {"A": "Requires convolution", "B": "Applies only to biases", "C": "Drives some weights to exactly zero, selecting features", "D": "Never changes the weights"}, "ans": "C", "exp": "The absolute-value penalty has a corner at zero."}, {"id": 1899, "q": "Elastic net regularisation combines:", "options": {"A": "Hinge and softmax losses", "B": "Two learning rates", "C": "Dropout and batch normalisation", "D": "L1 and L2 penalties"}, "ans": "D", "exp": "Useful with many correlated features."}, {"id": 1900, "q": "Which of the following is NOT a form of regularisation?", "options": {"A": "Increasing the learning rate", "B": "Dropout", "C": "Data augmentation", "D": "Weight decay"}, "ans": "A", "exp": "That is an optimisation setting, not a complexity penalty."}, {"id": 1901, "q": "Regularisation is generally NOT applied to the bias terms because they:", "options": {"A": "Do not control model complexity in the same way as weights", "B": "Are always zero", "C": "Have no gradient", "D": "Are not learned"}, "ans": "A", "exp": "Penalising them mainly restricts the model's offset."}, {"id": 1902, "q": "Max-norm regularisation constrains:", "options": {"A": "The batch size", "B": "The learning rate", "C": "The magnitude of each weight vector to a fixed upper bound", "D": "The number of layers"}, "ans": "C", "exp": "A hard constraint rather than a soft penalty."}, {"id": 1903, "q": "Mean Squared Error is the natural loss for:", "options": {"A": "Multi-class classification", "B": "Binary classification", "C": "Regression with continuous targets", "D": "Clustering"}, "ans": "C", "exp": "Cross-entropy is the classification counterpart."}, {"id": 1904, "q": "Which loss would you choose for a model predicting one of 1 000 image classes?", "options": {"A": "Hinge loss with a single margin", "B": "Softmax cross-entropy", "C": "Mean Absolute Error", "D": "Mean Squared Error"}, "ans": "B", "exp": "The standard for multi-class classification."}, {"id": 1905, "q": "Huber loss behaves like:", "options": {"A": "Hinge loss", "B": "Squared error for small residuals and absolute error for large ones", "C": "A constant", "D": "Cross-entropy everywhere"}, "ans": "B", "exp": "Combining MSE's smoothness with MAE's outlier robustness."}, {"id": 1906, "q": "Class weighting in the loss function is used to:", "options": {"A": "Make errors on a rare class cost more than errors on a common one", "B": "Speed up training", "C": "Reduce the number of features", "D": "Normalise the inputs"}, "ans": "A", "exp": "A standard response to class imbalance."}, {"id": 1907, "q": "Label smoothing modifies the targets so that the correct class receives:", "options": {"A": "A negative value", "B": "Slightly less than 1, with the remainder spread over other classes", "C": "A probability of exactly 1", "D": "A probability of 0"}, "ans": "B", "exp": "It discourages overconfident predictions."}, {"id": 1908, "q": "A loss function must be differentiable (almost everywhere) so that:", "options": {"A": "It can be stored in memory", "B": "It can be printed", "C": "The data can be scaled", "D": "Gradient-based optimisation can be applied"}, "ans": "D", "exp": "Accuracy itself is not differentiable, which is why it is not optimised directly."}, {"id": 1909, "q": "Accuracy is used as an evaluation metric but not as a training loss because it:", "options": {"A": "Requires probabilities", "B": "Cannot be measured", "C": "Has zero gradient almost everywhere", "D": "Is too easy to compute"}, "ans": "C", "exp": "Small weight changes rarely flip a prediction."}, {"id": 1910, "q": "The full training objective for a linear classifier consists of:", "options": {"A": "The regularisation term only", "B": "The learning rate times the gradient", "C": "The data loss only", "D": "The data loss plus the regularisation term"}, "ans": "D", "exp": "Fit the data, but stay simple."}, {"id": 1911, "q": "If a model achieves zero training loss but poor test performance, the appropriate response is to:", "options": {"A": "Increase regularisation or gather more data", "B": "Increase the learning rate", "C": "Remove regularisation", "D": "Add more layers"}, "ans": "A", "exp": "Classic overfitting. Part 60: Optimization & Gradient Descent II (Q1912–1941)"}, {"id": 1912, "q": "Optimisation in machine learning refers to the search for:", "options": {"A": "The fastest programming language", "B": "Parameter values that minimise the loss function", "C": "The largest dataset", "D": "The best evaluation metric"}, "ans": "B", "exp": "\"How do we find the best W?\""}, {"id": 1913, "q": "Random search as an optimisation strategy is described in class as:", "options": {"A": "Faster than gradient descent", "B": "The industry standard", "C": "A very bad idea that nonetheless beats chance slightly", "D": "Guaranteed to find the optimum"}, "ans": "C", "exp": "It reached roughly 15% on CIFAR-10 against a state of the art near 95%."}, {"id": 1914, "q": "The gradient of a function points in the direction of:", "options": {"A": "Steepest ascent", "B": "Zero change", "C": "The nearest data point", "D": "Steepest descent"}, "ans": "A", "exp": "Which is why the update moves in the negative gradient direction."}, {"id": 1915, "q": "In one dimension, the derivative of a function measures:", "options": {"A": "The area under the curve", "B": "The number of turning points", "C": "The instantaneous rate of change, or slope", "D": "The maximum value"}, "ans": "C", "exp": "The gradient generalises this to many dimensions."}, {"id": 1916, "q": "The finite-difference approximation of a derivative is:", "options": {"A": "(f(x + h) − f(x)) / h for a small h", "B": "f(x + h) × f(x)", "C": "f(x) × h", "D": "f(x) / h"}, "ans": "A", "exp": "The numerical gradient."}, {"id": 1917, "q": "Computing the numerical gradient for a network with a million parameters requires:", "options": {"A": "A single backward pass", "B": "No loss evaluations", "C": "One loss evaluation", "D": "Roughly a million separate loss evaluations"}, "ans": "D", "exp": "Hopelessly slow, which is why it is used only for checking."}, {"id": 1918, "q": "The analytic gradient is preferred in practice because it is:", "options": {"A": "Always correct with no risk of bugs", "B": "Exact and fast, obtained in one backward pass", "C": "Approximate but easy", "D": "Independent of the loss"}, "ans": "B", "exp": "Its risk is implementation error, not accuracy."}, {"id": 1919, "q": "The gradient descent update rule is:", "options": {"A": "W := W × ∇L", "B": "W := W + α∇L", "C": "W := α∇L", "D": "W := W − α∇L"}, "ans": "D", "exp": "Step downhill, scaled by the learning rate."}, {"id": 1920, "q": "Batch (full) gradient descent computes the gradient using:", "options": {"A": "The entire training set", "B": "One example", "C": "The test set", "D": "A minibatch"}, "ans": "A", "exp": "Accurate but expensive for large N."}, {"id": 1921, "q": "Stochastic gradient descent in its strictest sense uses:", "options": {"A": "Only the validation set", "B": "The whole dataset", "C": "A single example per update", "D": "No data"}, "ans": "C", "exp": "In practice \"SGD\" usually means minibatch SGD."}, {"id": 1922, "q": "Minibatch gradient descent is the standard compromise because it:", "options": {"A": "Requires no learning rate", "B": "Gives a reasonable gradient estimate at a fraction of the cost", "C": "Is exactly equivalent to full-batch descent", "D": "Removes all noise"}, "ans": "B", "exp": "And it maps well onto GPU hardware."}, {"id": 1923, "q": "The noise in stochastic gradient estimates:", "options": {"A": "Is purely harmful", "B": "Increases with batch size", "C": "Prevents convergence entirely", "D": "Can help the optimiser escape sharp, poor minima"}, "ans": "D", "exp": "A mild regularising effect."}, {"id": 1924, "q": "A local minimum is a point where the loss is:", "options": {"A": "Undefined", "B": "Always zero", "C": "Lower than at all nearby points, but possibly not the lowest overall", "D": "The lowest possible value globally"}, "ans": "C", "exp": "Deep networks tend to have many roughly equivalent ones."}, {"id": 1925, "q": "A saddle point is a location where the gradient is zero but the point is:", "options": {"A": "The global optimum", "B": "Outside the parameter space", "C": "A minimum in every direction", "D": "A minimum in some directions and a maximum in others"}, "ans": "D", "exp": "In high dimensions these outnumber local minima."}, {"id": 1926, "q": "Momentum improves gradient descent by:", "options": {"A": "Accumulating a velocity term from past gradients", "B": "Reducing the batch size", "C": "Removing the gradient", "D": "Increasing the learning rate every step"}, "ans": "A", "exp": "It damps oscillation and accelerates along consistent directions."}, {"id": 1927, "q": "Nesterov momentum differs from classical momentum by:", "options": {"A": "Using a fixed step size", "B": "Evaluating the gradient at the anticipated future position", "C": "Requiring full-batch gradients", "D": "Removing the velocity term"}, "ans": "B", "exp": "A \"look-ahead\" correction."}, {"id": 1928, "q": "AdaGrad adapts the learning rate per parameter based on:", "options": {"A": "The number of layers", "B": "The accumulated sum of squared past gradients", "C": "The loss value alone", "D": "The batch size"}, "ans": "B", "exp": "Rarely-updated parameters receive larger steps."}, {"id": 1929, "q": "A known weakness of AdaGrad is that its learning rate:", "options": {"A": "Becomes negative", "B": "Grows without bound", "C": "Never changes", "D": "Shrinks monotonically and may stall training"}, "ans": "D", "exp": "RMSProp fixes this with a decaying average."}, {"id": 1930, "q": "RMSProp maintains:", "options": {"A": "The exact Hessian", "B": "An exponentially decaying average of squared gradients", "C": "The full dataset in memory", "D": "A list of all past gradients"}, "ans": "B", "exp": "Recent gradients dominate the scaling."}, {"id": 1931, "q": "Adam combines the ideas of:", "options": {"A": "Momentum and per-parameter adaptive learning rates", "B": "Dropout and batch normalisation", "C": "L1 and L2 regularisation", "D": "Bagging and boosting"}, "ans": "A", "exp": "It tracks first and second moments of the gradient."}, {"id": 1932, "q": "A common default learning rate for Adam is around:", "options": {"A": "100", "B": "1.0", "C": "0.5", "D": "0.001"}, "ans": "D", "exp": "Often a reasonable starting point."}, {"id": 1933, "q": "The most important hyperparameter to tune in gradient-based training is generally:", "options": {"A": "The random seed", "B": "The number of classes", "C": "The file format", "D": "The learning rate"}, "ans": "D", "exp": "It affects both whether and how fast training converges."}, {"id": 1934, "q": "If the loss decreases very slowly and steadily with no instability, the learning rate is probably:", "options": {"A": "Too high", "B": "Irrelevant", "C": "Too low", "D": "Exactly right"}, "ans": "C", "exp": "Increase it cautiously."}, {"id": 1935, "q": "Second-order methods such as Newton's method are rarely used for deep networks because:", "options": {"A": "Computing and inverting the Hessian is prohibitively expensive at scale", "B": "They cannot reduce the loss", "C": "They require no derivatives", "D": "They ignore the gradient"}, "ans": "A", "exp": "Millions of parameters make the Hessian intractable."}, {"id": 1936, "q": "Convergence in optimisation means that:", "options": {"A": "All gradients become positive", "B": "Further updates produce negligible change in loss or parameters", "C": "Training has run for one epoch", "D": "The loss reaches exactly zero"}, "ans": "B", "exp": "Not necessarily at a global optimum."}, {"id": 1937, "q": "Optimising a non-convex loss surface, as in deep learning, means:", "options": {"A": "The loss is always linear", "B": "Gradients cannot be computed", "C": "Different initialisations may lead to different solutions", "D": "A single global minimum is guaranteed to be found"}, "ans": "C", "exp": "In practice many of these solutions perform comparably."}, {"id": 1938, "q": "The learning rate α interacts with the batch size in that larger batches often permit:", "options": {"A": "No learning rate at all", "B": "Fewer parameters", "C": "A larger learning rate, since the gradient estimate is less noisy", "D": "A smaller learning rate only"}, "ans": "C", "exp": "A common scaling heuristic in large-scale training."}, {"id": 1939, "q": "Which sequence describes a single SGD update correctly?", "options": {"A": "Sample a minibatch → forward pass → compute loss → backward pass → update weights", "B": "Backward pass → forward pass → update weights", "C": "Compute loss → sample minibatch → forward pass", "D": "Update weights → sample a minibatch → compute loss"}, "ans": "A", "exp": "Repeated until convergence."}, {"id": 1940, "q": "Gradient descent is guaranteed to reach the global minimum when the loss surface is:", "options": {"A": "Discontinuous", "B": "Convex", "C": "Random", "D": "Non-convex"}, "ans": "B", "exp": "Linear and logistic regression enjoy this property."}, {"id": 1941, "q": "If training loss plateaus early and refuses to fall further, a reasonable diagnosis is:", "options": {"A": "The learning rate is too small, the model lacks capacity, or gradients are vanishing", "B": "The batch size is exactly right", "C": "The dataset is too small only", "D": "The test set is contaminated"}, "ans": "A", "exp": "Each is worth checking in turn. Part 61: CNN Architectures & Mechanics II (Q1942–1971)"}, {"id": 1942, "q": "Stretching a 32×32×3 image into a 3072×1 vector for a fully-connected layer:", "options": {"A": "Is required for convolution", "B": "Reduces the number of parameters", "C": "Preserves the spatial structure", "D": "Destroys the spatial arrangement of neighbouring pixels"}, "ans": "D", "exp": "Convolution exists precisely to preserve that structure."}, {"id": 1943, "q": "A convolutional filter applied to an input volume of depth 3 must itself have depth:", "options": {"A": "Any value", "B": "3", "C": "32", "D": "1"}, "ans": "B", "exp": "Filters always extend the full depth of the input volume."}, {"id": 1944, "q": "Convolving a 32×32×3 image with one 5×5×3 filter produces a single:", "options": {"A": "32×32×3 volume", "B": "Scalar value", "C": "28×28×1 activation map", "D": "5×5 map"}, "ans": "C", "exp": "One filter yields one activation map."}, {"id": 1945, "q": "Each value in an activation map is the result of:", "options": {"A": "The maximum pixel in the image", "B": "A random draw", "C": "A dot product between the filter and a local patch, plus a bias", "D": "The sum of the entire image"}, "ans": "C", "exp": "For a 5×5×3 filter this is a 75-dimensional dot product."}, {"id": 1946, "q": "Applying six 5×5×3 filters to a 32×32×3 input produces an output of:", "options": {"A": "28×28×6", "B": "32×32×3", "C": "6×6×28", "D": "28×28×3"}, "ans": "A", "exp": "The filters' outputs are stacked along the depth dimension."}, {"id": 1947, "q": "The general formula for the spatial output size of a convolution is:", "options": {"A": "N/F − stride", "B": "(N + F) × stride", "C": "N × F × stride", "D": "(N − F)/stride + 1"}, "ans": "D", "exp": "With padding P, N becomes N + 2P."}, {"id": 1948, "q": "For a 7×7 input with a 3×3 filter and stride 1, the output is:", "options": {"A": "4×4", "B": "5×5", "C": "7×7", "D": "3×3"}, "ans": "B", "exp": "(7 − 3)/1 + 1 = 5."}, {"id": 1949, "q": "For a 7×7 input with a 3×3 filter and stride 2, the output is:", "options": {"A": "2×2", "B": "7×7", "C": "5×5", "D": "3×3"}, "ans": "D", "exp": "(7 − 3)/2 + 1 = 3."}, {"id": 1950, "q": "A 3×3 filter applied to a 7×7 input with stride 3:", "options": {"A": "Does not fit, since (7 − 3)/3 + 1 is not an integer", "B": "Produces a 1×1 output", "C": "Produces a 3×3 output", "D": "Produces a 2×2 output"}, "ans": "A", "exp": "The arithmetic gives 2.33, so the configuration is invalid."}, {"id": 1951, "q": "Zero padding of 1 pixel applied to a 7×7 input with a 3×3 filter and stride 1 gives an output of:", "options": {"A": "7×7", "B": "5×5", "C": "3×3", "D": "9×9"}, "ans": "A", "exp": "(7 + 2 − 3)/1 + 1 = 7, preserving the spatial size."}, {"id": 1952, "q": "The padding that preserves spatial dimensions for a filter of size F with stride 1 is:", "options": {"A": "P = 1 always", "B": "P = (F − 1)/2", "C": "P = F", "D": "P = 0"}, "ans": "B", "exp": "So F = 3 needs P = 1, and F = 5 needs P = 2."}, {"id": 1953, "q": "Repeated convolution without padding is undesirable because volumes:", "options": {"A": "Grow uncontrollably", "B": "Become one-dimensional immediately", "C": "Change colour", "D": "Shrink rapidly, losing information especially at the borders"}, "ans": "D", "exp": "32 → 28 → 24 shrinks fast in a deep stack."}, {"id": 1954, "q": "For an input of 32×32×3 with ten 5×5 filters at stride 1 and padding 2, the parameter count is:", "options": {"A": "7 500", "B": "750", "C": "760", "D": "76"}, "ans": "C", "exp": "Each filter holds 5×5×3 + 1 = 76 parameters; 76 × 10 = 760."}, {"id": 1955, "q": "The \"+1\" in the per-filter parameter count represents:", "options": {"A": "The activation function", "B": "The bias term", "C": "The stride", "D": "The padding"}, "ans": "B", "exp": "One bias per filter."}, {"id": 1956, "q": "Weight sharing in a convolutional layer means that:", "options": {"A": "All layers share one weight", "B": "Weights are not learned", "C": "The same filter weights are applied at every spatial location", "D": "Every position uses a different filter"}, "ans": "C", "exp": "This is what makes CNNs parameter-efficient."}, {"id": 1957, "q": "A neuron in a convolutional layer is connected to:", "options": {"A": "The entire input volume", "B": "A single pixel", "C": "A small local region of the input, across its full depth", "D": "The output layer directly"}, "ans": "C", "exp": "Its receptive field."}, {"id": 1958, "q": "The receptive field of neurons in deeper layers:", "options": {"A": "Stays exactly the same", "B": "Grows with depth, covering more of the original image", "C": "Becomes one pixel", "D": "Shrinks with depth"}, "ans": "B", "exp": "Which is how later layers see larger structures."}, {"id": 1959, "q": "A 1×1 convolution is useful because it:", "options": {"A": "Does nothing at all", "B": "Removes the bias", "C": "Increases spatial resolution", "D": "Mixes information across the depth dimension and can change the channel count"}, "ans": "D", "exp": "Each filter performs a dot product across all input channels."}, {"id": 1960, "q": "Applying 32 filters of size 1×1 to a 56×56×64 input produces:", "options": {"A": "56×56×32", "B": "1×1×32", "C": "28×28×32", "D": "56×56×64"}, "ans": "A", "exp": "Spatial size unchanged, depth reduced."}, {"id": 1961, "q": "Max pooling with a 2×2 filter and stride 2 applied to a 32×32 map gives:", "options": {"A": "8×8", "B": "64×64", "C": "32×32", "D": "16×16"}, "ans": "D", "exp": "Each 2×2 window is reduced to a single value."}, {"id": 1962, "q": "Pooling operates:", "options": {"A": "On the labels", "B": "Across all activation maps jointly", "C": "On each activation map independently, leaving the depth unchanged", "D": "Only on the first channel"}, "ans": "C", "exp": "Depth is preserved."}, {"id": 1963, "q": "Pooling layers contain:", "options": {"A": "One weight per input pixel", "B": "Many learnable parameters", "C": "A bias for each map", "D": "No learnable parameters"}, "ans": "D", "exp": "The operation is fixed."}, {"id": 1964, "q": "The two most common pooling configurations mentioned in class are:", "options": {"A": "F = 5, S = 1 only", "B": "F = 2, S = 2 and F = 3, S = 2", "C": "F = 1, S = 1", "D": "F = 7, S = 7"}, "ans": "B", "exp": "Both roughly halve the spatial dimensions."}, {"id": 1965, "q": "The purpose of pooling is to:", "options": {"A": "Make representations smaller and more manageable, adding local invariance", "B": "Add non-linearity only", "C": "Normalise the labels", "D": "Increase the number of parameters"}, "ans": "A", "exp": "Small shifts in the input then matter less."}, {"id": 1966, "q": "A fully-connected layer at the end of a CNN:", "options": {"A": "Performs convolution", "B": "Has no parameters", "C": "Connects to the entire input volume, as in an ordinary neural network", "D": "Connects to a local region only"}, "ans": "C", "exp": "It lled the:", "options": {"A": "Train–test gap", "B": "Generalisation gap", "C": "Semantic gap", "D": "Bias–variance gap"}, "ans": "C", "exp": "Bridging it is the central problem of computer vision."}, {"id": 1974, "q": "Which challenge refers to the same object appearing different when photographed from another angle?", "options": {"A": "Illumination variation", "B": "Viewpoint variation", "C": "Intra-class variation", "D": "Occlusion"}, "ans": "B", "exp": "The pixel values change completely while the object does not."}, {"id": 1975, "q": "Occlusion, as a vision challenge, means that:", "options": {"A": "Objects of the same class look different", "B": "The background is cluttered", "C": "Lighting conditions change", "D": "Part of the object is hidden behind something else"}, "ans": "D", "exp": "A cat behind a chair is still a cat."}, {"id": 1976, "q": "Intra-class variation refers to:", "options": {"A": "Changes in camera angle", "B": "Two different classes looking alike", "C": "Wide differences in appearance among members of the same class", "D": "Poor lighting"}, "ans": "C", "exp": "Chairs come in enormously varied forms."}, {"id": 1977, "q": "Semantic segmentation differs from image classification because it:", "options": {"A": "Assigns one label to the whole image", "B": "Assigns a class label to every pixel", "C": "Draws a single bounding box", "D": "Generates a caption"}, "ans": "B", "exp": "The finest-grained of the labelling tasks."}, {"id": 1978, "q": "Image captioning requires a model to:", "options": {"A": "Generate a natural-language description of the image content", "B": "Cluster similar images", "C": "Classify the image into one of ten classes", "D": "Compress the image"}, "ans": "A", "exp": "It combines vision with language generation."}, {"id": 1979, "q": "Object detection outputs:", "options": {"A": "Class labels together with bounding-box locations", "B": "A compressed file", "C": "A single class label only", "D": "Pixel-level masks only"}, "ans":  1986, "q": "ImageNet's importance to the field was that it:", "options": {"A": "Removed the need for benchmarks", "B": "Introduced the first neural network", "C": "Replaced the need for GPUs", "D": "Provided labelled data at a scale that made deep learning viable"}, "ans": "D", "exp": "Scale of supervision was the missing ingredient."}, {"id": 1987, "q": "The main reason CNNs replaced hand-designed feature pipelines is that they:", "options": {"A": "Learn features directly from data, jointly with the classifier", "B": "Require less data", "C": "Need no training", "D": "Are simpler to describe"}, "ans": "A", "exp": "End-to-end learning consistently outperformed fixed features."}, {"id": 1988, "q": "Which of these is a hand-designed feature representation rather than a learned one?", "options": {"A": "The output of a trained convolutional layer", "B": "Histogram of Oriented Gradients", "C": "A learned filter bank", "D": "An embedding from a deep network"}, "ans": "B", "exp": "HoG is specified by a human, not learned."}, {"id": 1989, "q": "Algorithmic bias in a vision system most often originates from:", "options": {"A": "Training data that under-represents certain groups", "B": "Excessive processor speed", "C": "The choice of programming language", "D": "The image file format"}, "ans": "A", "exp": "The model mirrors the distribution it was shown."}, {"id": 1990, "q": "The Gender Shades study demonstrated that commercial facial analysis systems:", "options": {"A": "Were never deployed", "B": "Performed equally well across all groups", "C": "Had far higher error rates for darker-skinned women", "D": "Could not detect faces at all"}, "ans": "C", "exp": "Buolamwini and Gebru, 2018."}, {"id": 1991, "q": "The \"black box\" problem refers to models that are:", "options": {"A": "Unable to make predictions", "B": "Always inaccurate", "C": "Accurate yet difficult or impossible to explain", "D": "Physically enclosed in a box"}, "ans": "C", "exp": "A decision tree sits at the opposite end of this spectrum."}, {"id": 1992, "q": "A simple decision tree is more explainable than a deep network because:", "options": {"A": "It uses more parameters", "B": "It is more accurate", "C": "It requires no data", "D": "Every decision step can be traced and stated in words"}, "ans": "D", "exp": "Accuracy and explainability often trade off."}, {"id": 1993, "q": "If a hiring model is trained on a decade of past hiring decisions that favoured one group, the model will most likely:", "options": {"A": "Ignore the training data", "B": "Refuse to make predictions", "C": "Correct the historical imbalance automatically", "D": "Reproduce and potentially amplify that pattern"}, "ans": "D", "exp": "The data encodes the prejudice as signal."}, {"id": 1994, "q": "Which is the most effective first step toward reducing bias in a deployed model?", "options": {"A": "Removing the evaluation stage", "B": "Auditing performance separately for each affected group", "C": "Increasing model size", "D": "Raising the learning rate"}, "ans": "B", "exp": "Aggregate accuracy conceals per-group disparities."}, {"id": 1995, "q": "Privacy concerns in machine learning arise partly because trained models can:", "options": {"A": "Leak information about individuals in the training data", "B": "Only be run on one computer", "C": "Never be copied", "D": "Store no information"}, "ans": "A", "exp": "Membership inference and model inversion are studied attacks."}, {"id": 1996, "q": "The environmental concern associated with large-scale model training relates to:", "options": {"A": "Paper consumption", "B": "Office noise", "C": "Cable manufacturing", "D": "Electricity use and the resulting carbon emissions"}, "ans": "D", "exp": "Large training runs are energy-intensive."}, {"id": 1997, "q": "Facial recognition deployed for public surveillance raises concerns principally about:", "options": {"A": "Consent, civil liberties and disproportionate error rates for some groups", "B": "Screen resolution", "C": "Programming language choice", "D": "File storage costs"}, "ans": "A", "exp": "Technical accuracy alone does not settle the question."}, {"id": 1998, "q": "A responsible response to a model that performs well overall but poorly for one subgroup is to:", "options": {"A": "Remove the subgroup from the test set", "B": "Deploy it and report only overall accuracy", "C": "Increase the learning rate", "D": "Investigate the data, report the disparity, and address it before deployment"}, "ans": "D", "exp": "Hiding the disparity does not remove the harm."}, {"id": 1999, "q": "Computer vision applied to medical imaging is promising but requires particular care because:", "options": {"A": "Errors carry serious clinical consequences and models must be validated on external data", "B": "Doctors cannot read images", "C": "Images are large files", "D": "The models train slowly"}, "ans": "A", "exp": "Internal validation alone overstates real-world performance."}, {"id": 2000, "q": "The overall lesson of the course regarding AI systems is best summarised as:", "options": {"A": "They are neutral tools with no social consequences", "B": "They are powerful statistical systems whose behaviour reflects the data and objectives we give them", "C": "They will always be accurate", "D": "They understand the world as humans do"}, "ans": "B", "exp": "Capability and responsibility advance together."}];

    const BATCH_SIZE = 100;
    const TOTAL_QUESTIONS = fullQuestionBank.length;
    const TOTAL_BATCHES = Math.ceil(TOTAL_QUESTIONS / BATCH_SIZE);

    let currentBatchIndex = 0; // 0 for Q1-100, 1 for Q101-200, ...
    let currentQuestions = [];
    let currentIndex = 0;
    const userAnswers = {};
    const flagged = new Set();
    let timeLeft = 90 * 60; // 90 minutes per 100 questions
    let timerInterval = null;

    function populateBatchDropdown() {
      const select = document.getElementById('batchSelect');
      select.innerHTML = '';
      for (let i = 0; i < TOTAL_BATCHES; i++) {
        const startQ = i * BATCH_SIZE + 1;
        const endQ = Math.min((i + 1) * BATCH_SIZE, TOTAL_QUESTIONS);
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Block ${i + 1}: Q${startQ} - Q${endQ}`;
        select.appendChild(opt);
      }
    }

    function loadBatch(batchIdx) {
      currentBatchIndex = batchIdx;
      document.getElementById('batchSelect').value = batchIdx;
      
      const start = batchIdx * BATCH_SIZE;
      const end = Math.min(start + BATCH_SIZE, TOTAL_QUESTIONS);
      currentQuestions = fullQuestionBank.slice(start, end);
      currentIndex = 0;

      // Clear answers for the new batch
      for (const k of Object.keys(userAnswers)) {
        delete userAnswers[k];
      }
      flagged.clear();

      document.getElementById('palette-title').textContent = `Palette (Q${start + 1} - Q${end})`;
      document.getElementById('quiz-view').style.display = 'grid';
      document.getElementById('results-view').style.display = 'none';

      timeLeft = 90 * 60;
      renderPalette();
      loadQuestion(0);
      startTimer();
    }

    function onBatchSelectChange(val) {
      if (confirm(`Switch to Block ${parseInt(val) + 1} (Q${parseInt(val)*BATCH_SIZE + 1} - Q${Math.min((parseInt(val)+1)*BATCH_SIZE, TOTAL_QUESTIONS)})? Unsaved answers will be cleared.`)) {
        loadBatch(parseInt(val));
      } else {
        document.getElementById('batchSelect').value = currentBatchIndex;
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      const timerEl = document.getElementById('timer');
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert('Time has expired for this 100-question block! Submitting your answers now.');
          submitExam();
        }
      }, 1000);
    }

    function loadQuestion(index) {
      currentIndex = index;
      const q = currentQuestions[index];
      const startQ = currentBatchIndex * BATCH_SIZE + 1;
      const endQ = Math.min((currentBatchIndex + 1) * BATCH_SIZE, TOTAL_QUESTIONS);

      document.getElementById('q-label').textContent = `Question ${index + 1} of ${currentQuestions.length}`;
      document.getElementById('q-origin').textContent = `Global ID: Q${q.id} / ${TOTAL_QUESTIONS}`;
      document.getElementById('q-text').textContent = q.q;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      for (const [key, val] of Object.entries(q.options)) {
        const item = document.createElement('label');
        item.className = 'option-item' + (userAnswers[q.id] === key ? ' selected' : '');
        item.innerHTML = `
          <input type="radio" name="q_opt" value="${key}" ${userAnswers[q.id] === key ? 'checked' : ''} onchange="selectOption('${key}')">
          <span><strong>${key})</strong> ${val}</span>
        `;
        container.appendChild(item);
      }

      document.getElementById('btn-prev').disabled = index === 0;
      document.getElementById('btn-next').disabled = index === currentQuestions.length - 1;
      document.getElementById('btn-flag').textContent = flagged.has(q.id) ? 'Unflag' : 'Flag for Review';

      updatePaletteUI();
    }

    function selectOption(optKey) {
      const qId = currentQuestions[currentIndex].id;
      userAnswers[qId] = optKey;
      loadQuestion(currentIndex);
    }

    function toggleFlag() {
      const qId = currentQuestions[currentIndex].id;
      if (flagged.has(qId)) {
        flagged.delete(qId);
      } else {
        flagged.add(qId);
      }
      loadQuestion(currentIndex);
    }

    function prevQuestion() {
      if (currentIndex > 0) loadQuestion(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
    }

    function renderPalette() {
      const palette = document.getElementById('palette');
      palette.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.id = `pal-${q.id}`;
        btn.textContent = idx + 1;
        btn.onclick = () => loadQuestion(idx);
        palette.appendChild(btn);
      });
    }

    function updatePaletteUI() {
      currentQuestions.forEach((q, idx) => {
        const btn = document.getElementById(`pal-${q.id}`);
        if (!btn) return;
        btn.className = 'palette-btn';
        if (idx === currentIndex) btn.classList.add('active');
        if (userAnswers[q.id]) btn.classList.add('answered');
        if (flagged.has(q.id)) btn.classList.add('flagged');
      });
    }

    function submitExam() {
      const answeredCount = Object.keys(userAnswers).length;
      if (confirm(`You have answered ${answeredCount} of ${currentQuestions.length} questions. Submit now?`)) {
        clearInterval(timerInterval);
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('results-view').style.display = 'block';
        window.scrollTo(0, 0);
        calculateResults();
      }
    }

    function nextBatchPrompt() {
      if (currentBatchIndex < TOTAL_BATCHES - 1) {
        if (confirm(`Proceed directly to Block ${currentBatchIndex + 2} (Q${(currentBatchIndex+1)*BATCH_SIZE + 1} - Q${Math.min((currentBatchIndex+2)*BATCH_SIZE, TOTAL_QUESTIONS)})?`)) {
          loadBatch(currentBatchIndex + 1);
        }
      } else {
        alert("You have reached the final 100 questions of the curriculum!");
      }
    }

    function retakeCurrentBatch() {
      loadBatch(currentBatchIndex);
    }

    function goToNextBatch() {
      if (currentBatchIndex < TOTAL_BATCHES - 1) {
        loadBatch(currentBatchIndex + 1);
      } else {
        alert("Congratulations! You have completed all 2,000 questions across all 20 blocks!");
      }
    }

    function calculateResults() {
      let score = 0;
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';

      const startQ = currentBatchIndex * BATCH_SIZE + 1;
      const endQ = Math.min((currentBatchIndex + 1) * BATCH_SIZE, TOTAL_QUESTIONS);
      document.getElementById('result-title').textContent = `Results: Questions ${startQ} to ${endQ}`;

      currentQuestions.forEach((q, idx) => {
        const userChoice = userAnswers[q.id];
        const isCorrect = userChoice === q.ans;
        if (isCorrect) score++;

        const reviewCard = document.createElement('div');
        reviewCard.className = `review-item ${isCorrect ? 'pass' : 'fail'}`;
        reviewCard.innerHTML = `
          <div style="font-weight: 700; margin-bottom: 0.4rem;">Question ${idx + 1} (Bank ID: Q${q.id}): ${q.q}</div>
          <div style="font-size: 0.95rem; margin-bottom: 0.25rem;">
            Your Answer: <strong style="color: ${isCorrect ? 'var(--accent)' : 'var(--danger)'};">
              ${userChoice ? `${userChoice}) ${q.options[userChoice]}` : 'Unanswered'}
            </strong>
          </div>
          <div style="font-size: 0.95rem;">
            Correct Answer: <strong style="color: var(--accent);">${q.ans}) ${q.options[q.ans]}</strong>
          </div>
          ${q.exp ? `<div class="explanation-box"><strong>Explanation:</strong> ${q.exp}</div>` : ''}
        `;
        reviewList.appendChild(reviewCard);
      });

      document.getElementById('score-text').textContent = `${score} / ${currentQuestions.length}`;
      const pct = ((score / currentQuestions.length) * 100).toFixed(1);
      document.getElementById('percentage-text').textContent = `Final Grade for Block: ${pct}%`;

      const btnNextBlock = document.getElementById('btn-next-block');
      if (currentBatchIndex >= TOTAL_BATCHES - 1) {
        btnNextBlock.style.display = 'none';
      } else {
        btnNextBlock.style.display = 'inline-block';
        btnNextBlock.textContent = `Proceed to Block ${currentBatchIndex + 2} (Q${(currentBatchIndex+1)*BATCH_SIZE + 1} - Q${Math.min((currentBatchIndex+2)*BATCH_SIZE, TOTAL_QUESTIONS)}) →`;
      }
    }

    window.onload = () => {
      populateBatchDropdown();
      loadBatch(0);
    };
  </script>
</body>
</html>
