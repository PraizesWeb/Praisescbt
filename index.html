s", "D": "Maximise class separation"}, "ans": "A", "exp": "LDA, in contrast, maximises class separability."}, {"id": 975, "q": "The vanishing gradient problem primarily affects:", "options": {"A": "Shallow linear models", "B": "k-means clustering", "C": "Deep networks using saturating activations like sigmoid or tanh", "D": "Decision trees"}, "ans": "C", "exp": "ReLU, residual connections and normalisation are the standard remedies."}, {"id": 976, "q": "ReLU is defined as:", "options": {"A": "tanh(x)", "B": "1/(1 + e^(−x))", "C": "x²", "D": "max(0, x)"}, "ans": "D", "exp": "Cheap to compute and non-saturating for positive inputs."}, {"id": 977, "q": "The softmax function is used in the output layer to:", "options": {"A": "Prevent overfitting", "B": "Produce a probability distribution over mutually exclusive classes", "C": "Compute the gradient", "D": "Normalise the input features"}, "ans": "B", "exp": "Sigmoid is used instead for multi-label problems."}, {"id": 978, "q": "Dropout regularises a network by:", "options": {"A": "Increasing the batch size", "B": "Removing layers permanently", "C": "Reducing the learning rate", "D": "Randomly deactivating units during training"}, "ans": "D", "exp": "It approximates training an ensemble of subnetworks."}, {"id": 979, "q": "Batch normalisation improves training by:", "options": {"A": "Increasing parameter count substantially", "B": "Removing all non-linearities", "C": "Normalising layer inputs, allowing higher learning rates and faster convergence", "D": "Deleting outlier samples"}, "ans": "C", "exp": "Layer normalisation is preferred in transformers."}, {"id": 980, "q": "Convolutional layers exploit which properties of image data?", "options": {"A": "Local spatial correlation and translation equivariance", "B": "Sequential temporal dependency", "C": "Tabular independence", "D": "Graph connectivity"}, "ans": "A", "exp": "Weight sharing dramatically reduces parameters."}, {"id": 981, "q": "Pooling layers in a CNN serve to:", "options": {"A": "Increase spatial resolution", "B": "Downsample feature maps and provide local translation invariance", "C": "Normalise the labels", "D": "Add trainable parameters"}, "ans": "B", "exp": "Max and average pooling are the common variants."}, {"id": 982, "q": "Residual (skip) connections in ResNet address:", "options": {"A": "Degradation and vanishing gradients in very deep networks", "B": "Label noise", "C": "Insufficient training data", "D": "Slow data loading"}, "ans": "A", "exp": "The identity shortcut gives gradients a direct path."}, {"id": 983, "q": "RNNs are suited to sequential data because they:", "options": {"A": "Maintain a hidden state carrying information across time steps", "B": "Require fixed-length input only", "C": "Process all inputs simultaneously", "D": "Use convolution over space"}, "ans": "A", "exp": "They struggle with long-range dependencies in practice."}, {"id": 984, "q": "LSTM networks control information flow using:", "options": {"A": "Attention heads only", "B": "Convolution kernels", "C": "Input, forget and output gates", "D": "Pooling windows"}, "ans": "C", "exp": "The cell state carries long-term information with minimal decay."}, {"id": 985, "q": "The transformer architecture's core mechanism is:", "options": {"A": "Recurrence", "B": "Self-attention", "C": "Convolution", "D": "Pooling"}, "ans": "B", "exp": "\"Attention Is All You Need\", Vaswani et al., 2017."}, {"id": 986, "q": "Positional encoding is required in transformers because:", "options": {"A": "Self-attention is permutation-invariant and has no inherent notion of order", "B": "Embeddings are too small", "C": "Tokens are too long", "D": "Gradients vanish"}, "ans": "A", "exp": "Sinusoidal, learned and rotary encodings are all in use."}, {"id": 987, "q": "Multi-head attention allows the model to:", "options": {"A": "Process multiple batches at once", "B": "Remove the feedforward layer", "C": "Attend to information from different representation subspaces simultaneously", "D": "Reduce the vocabulary size"}, "ans": "C", "exp": "Heads specialise on different relational patterns."}, {"id": 988, "q": "BERT is pretrained using which objective?", "options": {"A": "Autoregressive next-token prediction", "B": "Contrastive image matching", "C": "Reinforcement learning", "D": "Masked language modelling with next-sentence prediction"}, "ans": "D", "exp": "Its bidirectional encoding suits understanding tasks."}, {"id": 989, "q": "GPT-style models are pretrained with:", "options": {"A": "Reward maximisation only", "B": "Masked token reconstruction", "C": "Clustering", "D": "Autoregressive next-token prediction"}, "ans": "D", "exp": "Decoder-only causal attention is what enables free generation."}, {"id": 990, "q": "Word2Vec's skip-gram model predicts:", "options": {"A": "The target word given context", "B": "Context words given a target word", "C": "The document topic", "D": "The sentence sentiment"}, "ans": "B", "exp": "CBOW is the reverse formulation."}, {"id": 991, "q": "Subword tokenisation (BPE, WordPiece) is used to:", "options": {"A": "Increase vocabulary size indefinitely", "B": "Translate between languages", "C": "Handle rare and unseen words with a fixed vocabulary", "D": "Remove all punctuation"}, "ans": "C", "exp": "It eliminates most out-of-vocabulary failures."}, {"id": 992, "q": "A GAN consists of:", "options": {"A": "Two identical classifiers", "B": "An encoder and decoder trained jointly on reconstruction", "C": "A policy and a value network", "D": "A generator and a discriminator trained adversarially"}, "ans": "D", "exp": "Goodfellow et al., 2014."}, {"id": 993, "q": "Mode collapse in GAN training occurs when the generator:", "options": {"A": "Fails to produce any output", "B": "Produces limited varieties of output, ignoring parts of the data distribution", "C": "Memorises the test set", "D": "Overpowers the discriminator permanently"}, "ans": "B", "exp": "A well-known instability of adversarial training."}, {"id": 994, "q": "A variational autoencoder differs from a plain autoencoder by:", "options": {"A": "Using no neural networks", "B": "Having no decoder", "C": "Requiring labels", "D": "Learning a probability distribution over the latent space"}, "ans": "D", "exp": "The reparameterisation trick makes sampling differentiable."}, {"id": 995, "q": "Diffusion models generate data by:", "options": {"A": "Adversarial competition between two networks", "B": "Clustering latent vectors", "C": "Directly copying training images", "D": "Learning to reverse a gradual noising process"}, "ans": "D", "exp": "They now dominate high-quality image synthesis."}, {"id": 996, "q": "Transfer learning is effective because:", "options": {"A": "Models cannot be trained from scratch", "B": "Features learned on a large source task generalise to related target tasks", "C": "It removes the need for evaluation", "D": "Labels are unnecessary"}, "ans": "B", "exp": "Especially valuable when target data is scarce."}, {"id": 997, "q": "Zero-shot learning means the model:", "options": {"A": "Is trained without any data", "B": "Only classifies known categories", "C": "Performs a task it received no training examples for", "D": "Receives thousands of examples"}, "ans": "C", "exp": "Few-shot learning supplies a handful of in-context examples."}, {"id": 998, "q": "A rational agent, in AI terms, is one that:", "options": {"A": "Acts to maximise its expected performance measure given its knowledge", "B": "Never takes any action", "C": "Mimics human errors", "D": "Always achieves the perfect outcome"}, "ans": "A", "exp": "Rationality is bounded by available information and resources."}, {"id": 999, "q": "In the PEAS framework, the components are:", "options": {"A": "Performance measure, Environment, Actuators, Sensors", "B": "Prediction, Error, Accuracy, Score", "C": "Policy, Evaluation, Action, State", "D": "Planning, Execution, Analysis, Search"}, "ans": "A", "exp": "Used to specify an agent's task environment precis e at runtime physically nonsensical mapping"}, "ans": "B", "exp": "Default logic/circumscription respond to this challenge directly."}, {"id": 1354, "q": "The ramification problem relates to indirect consequences of actions being:", "options": {"A": "Numerous/implicit complicating effect specifications beyond direct effects listed", "B": "Identical to preconditions confused terminology interchangeably incorrectly", "C": "Nonexistent since actions have only stated effects assumption contradicted routinely", "D": "Irrelevant to planning systems which ignore them safely proven wrong empirically"}, "ans": "A", "exp": "Distinguished from qualification problem carefully in literature."}, {"id": 1355, "q": "The symbol grounding problem is partially addressed empirically by:", "options": {"A": "Larger text-only corpora resolving semantics through scale alone claimed controversially", "B": "Multimodal models linking language with vision/audio sensorimotor data streams", "C": "Faster processors accelerating symbol manipulation without meaning changes irrelevantly", "D": "Bigger dictionaries defining symbols via more symbols circularly unhelpfully still"}, "ans": "B", "exp": "Embodied/embedded cognition research continues probing foundations."}, {"id": 1356, "q": "Moravec's paradox explains why AI conquered chess before reliable housekeeping robots because:", "options": {"A": "Housekeeping rules are simpler formalizing easily compared to chess complexity reversed assessment wrongly", "B": "Abstract reasoning requires little computation while perception/motor skills demand enormous resources", "C": "Robots avoid games preferring chores by design priorities culturally determined whimsically", "D": "Chess is physically demanding requiring robotic arms specifically inverted logic amusingly"}, "ans": "B", "exp": "Evolutionary optimization history underlies the asymmetry fundamentally."}, {"id": 1357, "q": "In minimax game trees, the horizon effect is mitigated by:", "options": {"A": "Ignoring evaluation functions trusting material counts alone simplistically insufficiently", "B": "Random move selection eliminating systematic blind spots chaotically risky", "C": "Reducing search depth deliberately hiding threats temporarily counterproductively", "D": "Quiescence search extending unstable positions plus progressive deepening strategies"}, "ans": "D", "exp": "Standard techniques in classical game engines universally adopted."}, {"id": 1358, "q": "Iterative deepening's overhead versus plain BFS amounts to only a small factor because:", "options": {"A": "Heuristics guide ID search making it uninformed-category misclassification technically", "B": "Memory savings eliminate recomputation automatically contradicting algorithm mechanics wrongly", "C": "Every node re-expanded equally many times costing factorial overhead catastrophically false", "D": "Node counts dominated by deepest iteration geometrically making repeats cheap relatively"}, "ans": "D", "exp": "Why ID / IDA became default choices for large spaces."}, {"id": 1359, "q": "Bidirectional search requires computing predecessors because:", "options": {"A": "Graphs are always undirected so successors equal predecessors trivially special case only", "B": "Predecessors speed heuristics computation exclusively secondary benefit tangential main reason", "C": "Backward frontier grows from goals needing inverse action applications", "D": "Forward search alone suffices making predecessors unnecessary contradicting definition"}, "ans": "C", "exp": "Reversible actions assumption often violated in practice limiting applicability."}, {"id": 1360, "q": "Uniform-cost search differs from BFS when step costs vary because UCS:", "options": {"A": "Ignores costs entirely focusing purely on depth matching DFS behavior instead wrongly", "B": "Behaves identically to BFS producing same expansion order always contradicted when costs differ", "C": "Requires admissible heuristics to function at all mischaracterization confusing UCS with A*", "D": "Expands lowest g-cost nodes yielding optimal paths regardless of depth ordering"}, "ans": "D", "exp": "UCS reduces to BFS exactly when all costs equal unit values."}, {"id": 1361, "q": "Greedy best-first search can loop infinitely without explored-set bookkeeping because:", "options": {"A": "Goal tests occur before expansions eliminating cycles structurally impossible arrangement described wrongly", "B": "h-based choices may revisit states along non-improving cycles pathologically", "C": "Heuristics guarantee monotonic progress preventing revisits mathematically false claim", "D": "Explored sets are built-in mandatory components of greedy algorithms definitionally incorrect"}, "ans": "B", "exp": "Graph-search variant with closed list restores completeness practically."}, {"id": 1362, "q": "Admissible heuristic construction methods include relaxed problems whose solutions:", "options": {"A": "Lower-bound original problem costs by removing constraints simplifying structure", "B": "Overestimate costs ensuring aggressive pruning optimality sacrificed knowingly sometimes weighted variants", "C": "Equal exact costs always making search equivalent to brute force pointless exercise ironically", "D": "Ignore problem structure deriving numbers randomly unprincipled guessing rejected academically"}, "ans": "A", "exp": "Pattern databases systematize this relaxation principle powerfully."}, {"id": 1363, "q": "The AND-OR graph search returns conditional plans because nondeterministic outcomes require:", "options": {"A": "Single linear plans sufficient despite uncertainty assumption contradicted fundamentally", "B": "No plan at all since randomness prevents any strategy usefulness nihilistic conclusion rejected", "C": "Probabilistic expected-value computations replacing contingency structures entirely different MDP framework", "D": "Branches covering every possible outcome with AND nodes demanding all succeed covered"}, "ans": "D", "exp": "Online replanning complements contingent planning approaches practically."}, {"id": 1364, "q": "Learning agents' problem generator component proposes exploratory actions because:", "options": {"A": "Critics forbid exploratory moves enforcing conservative behavior strictly contradicts purpose", "B": "Exploitation alone guarantees optimal learning convergence falsely assuming no local optima exist", "C": "Short-term suboptimal exploration discovers better long-term policies trading immediate performance", "D": "Performance element handles exploration internally making generators redundant architecture question resolved differently"}, "ans": "C", "exp": "Exploration/exploitation balance embodied architecturally elegantly."}, {"id": 1365, "q": "Deep Blue evaluated ~200 million positions per second using:", "options": {"A": "Neural networks trained end-to-end from pixels anachronistically describing AlphaZero instead", "B": "Monte Carlo tree search random rollouts characterizing later Go engines misattributed here", "C": "Pure brute force without any evaluation guidance until terminal states impossibly slow actually", "D": "Specialized hardware plus hand-tuned evaluation features and opening/endgame databases"}, "ans": "D", "exp": "Symbolic-era peak achievement preceding learning-based paradigms historically."}, {"id": 1366, "q": "Watson's DeepQA architecture distinguished itself by:", "options": {"A": "Human operators typing answers during broadcast scandalously alleged baselessly", "B": "Massive parallel candidate generation/hypothesis scoring over heterogeneous evidence sources", "C": "Rule-based lookup in curated fact tables only simplistic characterization inaccurate", "D": "Single neural sequence model generating answers token-by-token anachronistic LLM description"}, "ans": "B", "exp": "Evidence theory fusion scored candidate answers probabilistically."}, {"id": 1367, "q": "AlphaGo's policy network narrowed MCTS branching because:", "options": {"A": "Learned move priors concentrated search on promising candidates mimicking human intuition computationally", "B": "Exhaustive minimax evaluated every continuation feasible contrary to Go complexity facts", "C": "Human operators pruned bad moves live during matches against regulations allegedly falsely", "D": "Uniform random rollouts sampled all 361 points equally wastefully baseline approach superseded"}, "ans": "A", "exp": "Policy+value networks guided search synergistically breakthrough combination."}, {"id": 1368, "q": "Transfer learning's negative transfer occurs when source tasks:", "options": {"A": "Mislead target adaptation due to distribution/task mismatches harming performance measurably", "B": "Have smaller datasets necessarily causing harm size correlation assumed incorrectly", "C": "Are identical to targets making transfer redundant trivially true degenerate case only", "D": "Always improve targets universally beneficial guaranteed scaling claims oversimplified"}, "ans": "A", "exp": "Task relatedness/distance metrics research quantifies transferability prospects."}, {"id": 1369, "q": "Meta-learning's model-agnostic formulation (MAML) optimizes for:", "options": {"A": "Zero-shot performance exclusively excluding few-shot scenarios scope narrowing unnecessarily", "B": "Largest possible architectures maximizing capacity irrespective of adaptation objectives orthogonal concern", "C": "Fine-tuning sensitivity where few gradient steps adapt rapidly to new tasks", "D": "Fixed parameters serving all tasks frozen forever contradicting adaptation goal"}, "ans": "C", "exp": "Second-order gradients compute meta-objective efficiently approximated first-order variants."}, {"id": 1370, "q": "Continual/lifelong learning's catastrophic forgetting means new task training:", "options": {"A": "Is impossible since neural nets cannot learn sequentially absolute claim falsified by systems existing", "B": "Improves old task performance simultaneously free lunch claimed disproven consistently", "C": "Overwrites prior task capabilities unless rehearsal/regularization/architecture strategies intervene", "D": "Preserves all previous knowledge perfectly automatically contradicting empirical findings repeatedly documented"}, "ans": "C", "exp": "Elastic weight consolidation/replay buffers represent mitigation families."}, {"id": 1371, "q": "Neural architecture search automates design but raises cost concerns because naive RL searches consumed:", "options": {"A": "Zero training since architectures evaluated analytically without instantiation magically convenient false", "B": "Thousands of GPU-days motivating weight sharing/one-shot supernet efficiency innovations subsequently", "C": "Negligible compute comparable to single training runs modest claims historically inaccurate", "D": "Only CPU hours keeping carbon footprints minimal reassuringly incorrect accounting exposed later"}, "ans": "B", "exp": "DARTS/ENAS line reduced search costs orders of magnitude."}, {"id": 1372, "q": "Model interpretability tension with accuracy manifests because:", "options": {"A": "Interpretable models always dominate accuracy across domains contradicting benchmark evidence broadly", "B": "Accuracy metrics capture everything stakeholders need rendering explanations unnecessary dismissed concern widely contested", "C": "Interpretability has zero regulatory value since laws ignore explainability requirements factually wrong EU AI Act", "D": "Highly flexible models (deep ensembles) often outperform interpretable ones (sparse linear) on complex tasks"}, "ans": "D", "exp": "Rudin argues for interpretable-by-design in high-stakes settings influentially."}, {"id": 1373, "q": "Benchmark contamination (test leakage into training corpora) undermines evaluations because reported scores:", "options": {"A": "Remain unaffected since models cannot memorize anything established myth disproven by extraction attacks", "B": "Apply only to vision benchmarks never language tasks scope claim contradicted extensively documented LLM cases", "C": "Underestimate true abilities systematically reverse direction claim unsupported generally", "D": "Inflate beyond genuine capability necessitating held-out/private/dynamic benchmark designs responses"}, "ans": "D", "exp": "LiveBench/canary strings/rotating test sets represent mitigations deployed."}, {"id": 1374, "q": "The alignment problem intensifies with capability because stronger optimizers:", "options": {"A": "Pursue misspecified objectives more effectively making specification errors consequential catastrophically", "B": "Require less precise specifications converging universally identical behaviors uniformity assumption empirically false", "C": "Become incapable of acting on any objective whatsoever paradoxical incoherence suggested baselessly", "D": "Automatically correct their own goals toward benevolence mysteriously assumed hopeful claim unsupported"}, "ans": "A", "exp": "Scalable oversight/debate/iterated amplification research responds proactively."}, {"id": 1375, "q": "The most defensible summary of current AI (2026) states that systems demonstrate:", "options": {"A": "Zero practical value outside laboratories dismissing transformative deployments documented across industries absurdly", "B": "Perfect alignment with human values requiring no further governance attention complacent position contradicted by incident literature", "C": "Remarkable narrow-to-broad pattern capabilities yet lack robust agency/common sense guaranteeing continued safety research importance alongside deployment benefits", "D": "Complete general intelligence surpassing humans everywhere settled conclusively premature claim rejected by evidence"}, "ans": "C", "exp": "Balanced view matching expert surveys and observed deployments honestly. GET 324 Course-Specific Questions 1376–1461 Part 41: GET 324 Syllabus-Specific Items (Q1376–1391)"}, {"id": 1376, "q": "Tom Mitchell's classic definition states that a program learns from experience E with respect to task T and performance measure P if:", "options": {"A": "It requires no experience E to perform T", "B": "Its performance at T, as measured by P, improves with experience E", "C": "It stores every example in E permanently", "D": "Its runtime on T decreases as E grows"}, "ans": "B", "exp": "The E/T/P formulation from Mitchell (1997)."}, {"id": 1377, "q": "The fundamental difference between traditional programming and machine learning is that:", "options": {"A": "They differ only in the programming language used", "B": "Traditional programming takes data and rules to produce answers; ML takes data and answers to produce rules", "C": "Traditional programming needs no data at all", "D": "ML requires the programmer to write more explicit rules"}, "ans": "B", "exp": "ML infers the rules instead of having them hand-written."}, {"id": 1378, "q": "The correct relationship between Artificial Intelligence, Machine Learning and Deep Learning is:", "options": {"A": "All three are entirely separate fields", "B": "AI is a subset of Deep Learning", "C": "Deep Learning is a subset of Machine Learning, which is a subset of Artificial Intelligence", "D": "Machine Learning is a subset of Deep Learning, which is a subset of AI"}, "ans": "C", "exp": "Nested: AI ⊃ ML ⊃ DL."}, {"id": 1379, "q": "In simple linear regression, the hypothesis is written as:", "options": {"A": "h(x) = 1 / (1 + e^(−x))", "B": "h(x) = max(0, x)", "C": "h(x) = w·x + b", "D": "h(x) = log(x)"}, "ans": "C", "exp": "A weighted sum of the inputs plus a bias (intercept) term."}, {"id": 1380, "q": "The cost function used to train linear regression is Mean Squared Error because it:", "options": {"A": "Penalises larger errors more heavily and is smooth and differentiable", "B": "Cannot be minimised by gradient descent", "C": "Ignores the size of the errors", "D": "Counts only the number of wrong predictions"}, "ans": "A", "exp": "Squaring makes the cost convex and differentiable, so gradient descent applies."}, {"id": 1381, "q": "In gradient descent, the learning rate controls:", "options": {"A": "The number of training examples used", "B": "The value of the bias term at initialisation", "C": "The number of features in the dataset", "D": "The size of the step taken in the direction of steepest descent"}, "ans": "D", "exp": "Too large overshoots the minimum; too small converges very slowly."}, {"id": 1382, "q": "The normal equation w = (XᵀX)⁻¹Xᵀy differs from gradient descent because it:", "options": {"A": "Requires many more iterations than gradient descent", "B": "Solves for the optimal weights directly in one step, with no learning rate or iteration", "C": "Needs a learning rate to be tuned", "D": "Only works for classification problems"}, "ans": "B", "exp": "It becomes impractical when the number of features is very large, due to matrix inversion cost."}, {"id": 1383, "q": "In regression, the coefficient of determination R² indicates:", "options": {"A": "The proportion of variance in the dependent variable explained by the model", "B": "The number of iterations to convergence", "C": "The number of independent variables used", "D": "The learning rate of the algorithm"}, "ans": "A", "exp": "R² closer to 1 indicates a better fit to the observed variation."}, {"id": 1384, "q": "Logistic regression is used for classification rather than regression because the sigmoid function:", "options": {"A": "Outputs values from −∞ to +∞", "B": "Always outputs exactly 0 or 1", "C": "Squashes any real-valued input into the range 0 to 1, which can be read as a probability", "D": "Removes the need for weights and bias"}, "ans": "C", "exp": "σ(z) = 1/(1 + e^(−z))."}, {"id": 1385, "q": "Binary cross-entropy (log loss) is preferred over MSE for logistic regression because it:", "options": {"A": "Punishes confident wrong predictions far more heavily and keeps the cost convex", "B": "Produces outputs greater than 1", "C": "Ignores the predicted probabilities entirely", "D": "Is easier to compute than MSE"}, "ans": "A", "exp": "A confident wrong prediction drives the loss towards infinity."}, {"id": 1386, "q": "In binary logistic regression, a predicted probability of 0.72 with a decision threshold of 0.5 is classified as:", "options": {"A": "The positive class", "B": "The negative class", "C": "Undetermined, requiring another model", "D": "An error condition"}, "ans": "A", "exp": "Any probability above the threshold is assigned to the positive class."}, {"id": 1387, "q": "An input volume of 32×32×3 is convolved with 10 filters of size 5×5, using stride 1 and padding 2. The output volume is:", "options": {"A": "32 × 32 × 10", "B": "28 × 28 × 10", "C": "32 × 32 × 3", "D": "30 × 30 × 10"}, "ans": "A", "exp": "(32 + 2×2 − 5)/1 + 1 = 32 spatially, with depth equal to the number of filters."}, {"id": 1388, "q": "For that same layer — 10 filters of size 5×5 applied to a 32×32×3 input — the number of learnable parameters is:", "options": {"A": "250", "B": "760", "C": "750", "D": "7 600"}, "ans": "B", "exp": "Each filter has 5×5×3 + 1 = 76 parameters, and 76 × 10 = 760."}, {"id": 1389, "q": "Zero padding is applied around the border of an input volume mainly to:", "options": {"A": "Remove noise from the image", "B": "Increase the number of filters automatically", "C": "Preserve the spatial size of the output, preventing rapid shrinkage in deep networks", "D": "Reduce the depth of the volume"}, "ans": "C", "exp": "Repeated unpadded convolution shrinks volumes and loses border information."}, {"id": 1390, "q": "Applying max pooling with a 2×2 filter and stride 2 to a 28×28 activation map produces:", "options": {"A": "A 14×14 map, keeping the strongest response in each window", "B": "A 56×56 map", "C": "A 27×27 map", "D": "A 28×28 map with the same values"}, "ans": "A", "exp": "Pooling downsamples each activation map independently."}, {"id": 1391, "q": "Bank transaction records stored in neat rows and columns are an example of:", "options": {"A": "Reinforcement signals", "B": "Unstructured data", "C": "Model hyperparameters", "D": "Structured data"}, "ans": "D", "exp": "Images, audio and free text are the usual unstructured counterexamples. Part 42: Computer Vision History & Image Classification (Q1392–1411)"}, {"id": 1392, "q": "Hubel and Wiesel's experiments on the cat visual cortex established that early visual processing involves:", "options": {"A": "Random, untuned responses across the cortex", "B": "Colour processing only, with no edge detection", "C": "A single cell recognising an entire object at once", "D": "Simple cells responding to oriented edges and complex cells responding to movement and position invariance"}, "ans": "D", "exp": "Their hierarchical finding directly inspired convolutional architectures."}, {"id": 1393, "q": "Larry Roberts' \"Block World\" (1963) is regarded as significant because it:", "options": {"A": "Trained the first neural network on images", "B": "Was one of the first attempts to extract 3-D structure from 2-D images using edges", "C": "Introduced the ImageNet dataset", "D": "Solved general object recognition completely"}, "ans": "B", "exp": "Often cited as the first computer vision PhD thesis."}, {"id": 1394, "q": "David Marr's framework proposed that vision proceeds through the stages:", "options": {"A": "Training → validation → testing", "B": "Input image → classification → regression → output", "C": "Input image → primal sketch → 2½-D sketch → 3-D model", "D": "Pixels → pooling → softmax"}, "ans": "C", "exp": "A staged, representational theory of vision set out in the 1970s."}, {"id": 1395, "q": "Early object recognition approaches such as Generalized Cylinders (Brooks & Binford) and Pictorial Structures (Fischler & Elschlager) both represented objects as:", "options": {"A": "Single flat templates with no parts", "B": "Learned convolutional filters", "C": "Simpler parts arranged in a spatial configuration", "D": "Raw pixel arrays only"}, "ans": "C", "exp": "Part-based representation is the shared idea."}, {"id": 1396, "q": "SIFT (Lowe, 1999) advanced object recognition because its features are:", "options": {"A": "Sensitive to every small change in the image", "B": "Invariant to scale and rotation, allowing matching across viewpoints", "C": "Only usable on binary images", "D": "Learned end-to-end by a deep network"}, "ans": "B", "exp": "Matching a few invariant keypoints proved more robust than whole-object matching."}, {"id": 1397, "q": "The Viola–Jones detector (2001) is best known as the first:", "options": {"A": "Semantic segmentation algorithm", "B": "Real-time face detection system, later deployed in consumer cameras", "C": "Deep convolutional network", "D": "Image captioning model"}, "ans": "B", "exp": "It used Haar-like features with a boosted cascade."}, {"id": 1398, "q": "Histogram of Oriented Gradients (HoG), introduced by Dalal and Triggs (2005), works by:", "options": {"A": "Clustering the image into superpixels", "B": "Applying a recurrent network over pixel rows", "C": "Averaging the raw pixel intensities of the whole image", "D": "Dividing the image into small cells and quantising edge orientations into bins within each cell"}, "ans": "D", "exp": "In the lecture example, 8×8 pixel regions with 9 orientation bins."}, {"id": 1399, "q": "In a Bag of Words approach to image classification, the \"visual words\" are obtained by:", "options": {"A": "Taking the output of the final softmax layer", "B": "Using the image file names", "C": "Reading text captions attached to the images", "D": "Clustering many extracted image patches to build a codebook"}, "ans": "D", "exp": "Images are then encoded as histograms over that codebook."}, {"id": 1400, "q": "The PASCAL Visual Object Challenge benchmark contained:", "options": {"A": "22 000 object categories", "B": "1 000 object categories", "C": "20 object categories", "D": "10 object categories"}, "ans": "C", "exp": "ImageNet later scaled the problem by orders of magnitude."}, {"id": 1401, "q": "ImageNet (Deng, Dong, Socher, Li, Li & Fei-Fei, 2009) was assembled at a scale of roughly:", "options": {"A": "10 categories and 50 000 images", "B": "20 categories and 5 000 images", "C": "22 000 categories and 14 million images", "D": "1 000 categories and 60 000 images"}, "ans": "C", "exp": "The annual ILSVRC challenge used a 1 000-class subset."}, {"id": 1402, "q": "The ImageNet Large Scale Visual Recognition Challenge (ILSVRC) classification task used:", "options": {"A": "1 000 object classes over roughly 1.4 million images", "B": "20 classes over 11 000 images", "C": "100 classes over 100 000 images", "D": "22 000 classes over 14 million images"}, "ans": "A", "exp": "The benchmark on which the 2012 breakthrough was measured."}, {"id": 1403, "q": "The decisive moment for convolutional networks in computer vision was:", "options": {"A": "The Viola–Jones detector in 2001", "B": "The release of PASCAL VOC in 2006", "C": "The publication of SIFT in 1999", "D": "The 2012 ILSVRC win by Krizhevsky, Sutskever and Hinton's deep CNN"}, "ans": "D", "exp": "Error rates dropped sharply and the field shifted to deep learning."}, {"id": 1404, "q": "Although CNNs became dominant in 2012, the core architecture dates back to:", "options": {"A": "AlexNet itself, invented from scratch in 2012", "B": "LeCun et al.'s LeNet-5 for document recognition in 1998", "C": "Marr's 1970s vision framework", "D": "The Viola–Jones cascade"}, "ans": "B", "exp": "The lecture stresses that CNNs \"were not invented overnight\"."}, {"id": 1405, "q": "The two developments that made deep CNNs practical between 1998 and 2012 were:", "options": {"A": "Vastly more labelled training data and far greater compute, especially GPUs", "B": "Faster hard disks and better monitors", "C": "New programming languages only", "D": "Smaller datasets and simpler models"}, "ans": "A", "exp": "The lecture contrasts 10⁷ training pixels and 10⁶ transistors with 10¹⁴ and 10⁹."}, {"id": 1406, "q": "In computer vision, image classification is defined as:", "options": {"A": "Generating a sentence describing the image", "B": "Drawing bounding boxes around every object present", "C": "Assigning a single label to an entire image from a fixed set of categories", "D": "Labelling every pixel with a class"}, "ans": "C", "exp": "The other options describe detection, segmentation and captioning."}, {"id": 1407, "q": "Object detection differs from image classification because it must also:", "options": {"A": "Produce a natural-language caption", "B": "Cluster the images without labels", "C": "Localise each object, typically with a bounding box", "D": "Compress the image"}, "ans": "C", "exp": "Classification plus localisation, for possibly many objects."}, {"id": 1408, "q": "The \"semantic gap\" in computer vision refers to the difference between:", "options": {"A": "Two competing benchmark datasets", "B": "The raw grid of pixel values a computer sees and the meaning a human perceives", "C": "Training accuracy and test accuracy", "D": "The speed of CPUs and GPUs"}, "ans": "B", "exp": "The image is just a large array of numbers to the machine."}, {"id": 1409, "q": "Which of the following makes image classification genuinely difficult?", "options": {"A": "The small size of image files", "B": "The absence of any labelled datasets", "C": "The fact that images are two-dimensional", "D": "Viewpoint variation, illumination, deformation, occlusion, clutter and intra-class variation"}, "ans": "D", "exp": "A classifier must be robust to all of these simultaneously."}, {"id": 1410, "q": "A data-driven approach to image classification means that:", "options": {"A": "Rather than hand-coding rules for each class, the system learns from many labelled examples", "B": "Images are classified by file size", "C": "No data is used during development", "D": "The programmer writes explicit rules for what a cat looks like"}, "ans": "A", "exp": "The train/predict split is the core of the paradigm."}, {"id": 1411, "q": "Compared with hand-designed feature pipelines such as HoG or Bag of Words, convolutional networks:", "options": {"A": "Discard the training labels", "B": "Cannot be trained with gradient descent", "C": "Learn the feature representation and the classifier jointly from raw pixels", "D": "Require features to be designed by hand first"}, "ans": "C", "exp": "End-to-end learning replaced the fixed feature-extraction stage. Part 43: Loss Functions & Optimization (Q1412–1436)"}, {"id": 1412, "q": "A linear classifier computes class scores using:", "options": {"A": "f(x, W) = max(0, x)", "B": "f(x, W) = x²", "C": "f(x, W) = 1/(1 + e^(−x))", "D": "f(x, W) = Wx + b"}, "ans": "D", "exp": "A matrix of weights times the stretched image, plus a bias vector."}, {"id": 1413, "q": "In supervised classification, a loss function is used to:", "options": {"A": "Count the number of parameters", "B": "Select the programming language", "C": "Measure how fast the model runs", "D": "Quantify how unhappy we are with the scores the current classifier produces"}, "ans": "D", "exp": "The full loss is the average of the per-example losses."}, {"id": 1414, "q": "The multiclass SVM (hinge) loss for an example is written as:", "options": {"A": "Lᵢ = |s_j − s_{yᵢ}|", "B": "Lᵢ = Σ_{j≠yᵢ} max(0, s_j − s_{yᵢ} + 1)", "C": "Lᵢ = −log(e^{s_{yᵢ}} / Σ_j e^{s_j})", "D": "Lᵢ = (s_j − y)²"}, "ans": "B", "exp": "It sums the margin violations over all incorrect classes."}, {"id": 1415, "q": "For scores cat = 3.2, car = 5.1, frog = −1.7 with the true class \"cat\" and margin 1, the multiclass SVM loss is:", "options": {"A": "2.9", "B": "12.9", "C": "5.1", "D": "0"}, "ans": "A", "exp": "max(0, 5.1 − 3.2 + 1) + max(0, −1.7 − 3.2 + 1) = 2.9 + 0 = 2.9."}, {"id": 1416, "q": "The multiclass SVM loss for an example is zero when:", "options": {"A": "All scores are equal", "B": "The correct class score exceeds every incorrect class score by at least the margin", "C": "The weights are all zero", "D": "The correct class score is the lowest"}, "ans": "B", "exp": "Once the margin is satisfied, further increases change nothing."}, {"id": 1417, "q": "The minimum and maximum possible values of the multiclass SVM loss are:", "options": {"A": "−infinity and 0", "B": "0 and 1", "C": "0 and infinity", "D": "−1 and 1"}, "ans": "C", "exp": "Hinge loss is bounded below by zero but unbounded above."}, {"id": 1418, "q": "If a weight matrix W achieves zero multiclass SVM loss, then:", "options": {"A": "W is not unique — scaling it, for example to 2W, also gives zero loss", "B": "W is the single unique solution", "C": "Training cannot proceed", "D": "The loss must be negative"}, "ans": "A", "exp": "This ambiguity is a key motivation for adding regularisation."}, {"id": 1419, "q": "In the full objective L = data loss + λR(W), the regularisation term expresses the preference that:", "options": {"A": "The dataset should be larger", "B": "The model should be simple, so that it generalises to test data", "C": "The model should fit the training data as exactly as possible", "D": "The learning rate should be large"}, "ans": "B", "exp": "The lecture invokes Occam's razor for this."}, {"id": 1420, "q": "In the regularised objective, λ is:", "options": {"A": "The number of classes", "B": "A learned parameter updated by gradient descent", "C": "The size of the minibatch", "D": "The regularisation strength, a hyperparameter trading off data loss against model simplicity"}, "ans": "D", "exp": "It is chosen by validation, not learned from the training data."}, {"id": 1421, "q": "L2 regularisation, R(W) = Σ W², is also known as:", "options": {"A": "Weight decay, which spreads influence across many features", "B": "Sparsity regularisation, which zeroes most weights", "C": "Dropout", "D": "Batch normalisation"}, "ans": "A", "exp": "L1 instead encourages sparse weight vectors."}, {"id": 1422, "q": "The softmax classifier is also referred to as:", "options": {"A": "A support vector machine", "B": "A k-nearest-neighbour classifier", "C": "Multinomial logistic regression", "D": "A decision tree"}, "ans": "C", "exp": "It generalises logistic regression to more than two classes."}, {"id": 1423, "q": "In a softmax classifier, the raw scores produced by Wx + b are interpreted as:", "options": {"A": "Class labels", "B": "Already-normalised probabilities", "C": "Gradients of the loss", "D": "Unnormalised log probabilities of the classes"}, "ans": "D", "exp": "Exponentiating and normalising converts them to probabilities."}, {"id": 1424, "q": "The correct order of operations in computing softmax probabilities from scores is:", "options": {"A": "Square the scores, then divide by the maximum", "B": "Exponentiate the scores, then normalise by their sum", "C": "Take the logarithm, then subtract the mean", "D": "Normalise the scores, then exponentiate"}, "ans": "B", "exp": "For scores 3.2, 5.1, −1.7 this gives 24.5, 164.0, 0.18 → 0.13, 0.87, 0.00."}, {"id": 1425, "q": "The softmax (cross-entropy) loss for an example is:", "options": {"A": "The squared error of the scores", "B": "The negative log likelihood of the correct class, −log P(Y = yᵢ | X = xᵢ)", "C": "The sum of margin violations", "D": "The absolute difference of probabilities"}, "ans": "B", "exp": "Minimising it maximises the log likelihood of the correct class."}, {"id": 1426, "q": "If a softmax classifier assigns the correct class a probability of exactly 1.0, the loss is:", "options": {"A": "1", "B": "−1", "C": "Infinity", "D": "0"}, "ans": "D", "exp": "−log(1) = 0; as the probability tends to zero the loss tends to infinity."}, {"id": 1427, "q": "Consider a datapoint whose correct-class score already exceeds all others by a wide margin, and suppose its scores are jiggled slightly. Then:", "options": {"A": "Neither loss changes ever", "B": "Both losses change by the same amount", "C": "The SVM loss stays at zero, while the softmax loss always changes", "D": "The softmax loss stays fixed while the SVM loss changes"}, "ans": "C", "exp": "Softmax is never fully satisfied, and always pushes for more."}, {"id": 1428, "q": "Random search as an optimisation strategy for a linear classifier on CIFAR-10:", "options": {"A": "Matches gradient descent exactly", "B": "Works very poorly, reaching roughly 15% accuracy against a state of the art near 95%", "C": "Guarantees the global optimum quickly", "D": "Is the standard method in practice"}, "ans": "B", "exp": "The lecture presents it as \"a first very bad idea\"."}, {"id": 1429, "q": "In several dimensions, the gradient of the loss is:", "options": {"A": "The vector of partial derivatives along each dimension", "B": "A single scalar value", "C": "Always zero at initialisation", "D": "The same as the loss itself"}, "ans": "A", "exp": "Its direction is that of steepest ascent."}, {"id": 1430, "q": "The numerical gradient, computed with finite differences (f(W + h) − f(W))/h, is:", "options": {"A": "Approximate and slow, but easy to write", "B": "Never useful for any purpose", "C": "Exact and fast, and always preferred", "D": "Exact and fast, but hard to write"}, "ans": "A", "exp": "It must be evaluated separately for every parameter."}, {"id": 1431, "q": "The analytic gradient, derived with calculus, is:", "options": {"A": "Impossible to compute for neural networks", "B": "Independent of the loss function", "C": "Approximate and slow", "D": "Exact and fast, but error-prone to implement"}, "ans": "D", "exp": "Correctness is confirmed with a numerical gradient check."}, {"id": 1432, "q": "Standard practice when implementing gradients is therefore to:", "options": {"A": "Use random search instead", "B": "Skip gradient computation entirely", "C": "Use the analytic gradient, but verify the implementation with a numerical gradient check", "D": "Use the numerical gradient in production"}, "ans": "C", "exp": "\"Always use analytic gradient, but check implementation with numerical gradient.\""}, {"id": 1433, "q": "In gradient descent, the parameter update moves in the direction of:", "options": {"A": "The largest weight", "B": "A random vector", "C": "The negative gradient", "D": "The positive gradient"}, "ans": "C", "exp": "The step size is set by the learning rate."}, {"id": 1434, "q": "Stochastic Gradient Descent is used instead of full-batch gradient descent because:", "options": {"A": "The full sum is impossible to define", "B": "It removes the need for a learning rate", "C": "Minibatches give exact gradients", "D": "Summing the loss over the whole dataset is too expensive when N is large"}, "ans": "D", "exp": "A minibatch approximates the full-data gradient."}, {"id": 1435, "q": "Typical minibatch sizes used in practice are:", "options": {"A": "The entire dataset every step", "B": "1 million examples", "C": "32, 64 or 128 examples", "D": "Exactly 2 examples"}, "ans": "C", "exp": "Powers of two are chosen to suit hardware."}, {"id": 1436, "q": "The traditional image-classification pipeline extracted features such as colour histograms, HoG and bag-of-words, then trained a linear classifier on top. Convolutional networks differ in that:", "options": {"A": "They discard the classifier stage", "B": "They require hand-designed features first", "C": "They cannot be trained with SGD", "D": "The features themselves are learned during training rather than fixed in advance"}, "ans": "D", "exp": "Feature extraction and classification are optimised together. Part 44: Backpropagation & Neural Networks (Q1437–1461)"}, {"id": 1437, "q": "A computational graph represents a function as:", "options": {"A": "A network of nodes, each performing one operation, through which values flow forward", "B": "A list of hyperparameters", "C": "A single monolithic equation that cannot be decomposed", "D": "A table of training examples"}, "ans": "A", "exp": "Expressing the model this way is what makes backpropagation systematic."}, {"id": 1438, "q": "Backpropagation is best defined as:", "options": {"A": "A method for randomly searching the weight space", "B": "The forward evaluation of the network's output", "C": "A technique for compressing the training data", "D": "Recursive application of the chain rule along a computational graph to obtain gradients for all inputs and parameters"}, "ans": "D", "exp": "It is needed because writing gradient formulas by hand is impractical at scale."}, {"id": 1439, "q": "At each node during the backward pass, the gradient passed to an input is computed as:", "options": {"A": "The local gradient added to the upstream gradient", "B": "The local gradient multiplied by the upstream gradient", "C": "The local gradient alone, ignoring anything upstream", "D": "The upstream gradient divided by the local gradient"}, "ans": "B", "exp": "This product rule is the chain rule applied node by node."}, {"id": 1440, "q": "For the function f = (x + y)z with x = −2, y = 5, z = −4, the forward pass gives q = x + y = 3 and f = −12. The gradient ∂f/∂z is:", "options": {"A": "3", "B": "1", "C": "−4", "D": "−12"}, "ans": "A", "exp": "∂f/∂z = q = 3."}, {"id": 1441, "q": "For that same graph, f = qz, the gradients ∂f/∂x and ∂f/∂y are both:", "options": {"A": "3", "B": "0", "C": "1", "D": "−4"}, "ans": "D", "exp": "∂f/∂q = z = −4, and the add gate passes it unchanged to both inputs."}, {"id": 1442, "q": "In backward flow, an addition gate acts as a:", "options": {"A": "Gradient switcher, swapping the input values", "B": "Gradient eliminator, setting everything to zero", "C": "Gradient distributor, passing the same upstream gradient to all its inputs", "D": "Gradient router, sending it to only one input"}, "ans": "C", "exp": "Its local gradient is 1 with respect to each input."}, {"id": 1443, "q": "In backward flow, a max gate acts as a:", "options": {"A": "Gradient router, sending the full gradient to the largest input and zero to the others", "B": "Gradient switcher", "C": "Gradient distributor to every input equally", "D": "Gate with no gradient at all"}, "ans": "A", "exp": "Only the input that actually determined the output receives gradient."}, {"id": 1444, "q": "In backward flow, a multiplication gate acts as a:", "options": {"A": "Gradient distributor", "B": "Gradient switcher, scaling each input's gradient by the other input's value", "C": "Gate that blocks all gradient", "D": "Gradient router"}, "ans": "B", "exp": "For f = xy, ∂f/∂x = y and ∂f/∂y = x."}, {"id": 1445, "q": "When a variable is used at more than one place in the graph, its gradients:", "options": {"A": "Cancel one another out", "B": "Add together at the branch", "C": "Are multiplied together", "D": "Take only the largest of the branches"}, "ans": "B", "exp": "The multivariable chain rule sums contributions from every path."}, {"id": 1446, "q": "The local gradient of the sigmoid function σ(x) is:", "options": {"A": "(1 − σ(x))·σ(x)", "B": "e^x", "C": "1 − σ(x)", "D": "σ(x)²"}, "ans": "A", "exp": "For an output of 0.73 this evaluates to (1 − 0.73)(0.73) ≈ 0.2."}, {"id": 1447, "q": "Grouping several elementary operations into a single \"sigmoid gate\" with a known analytic derivative is worthwhile because it:", "options": {"A": "Removes the need for a forward pass", "B": "Simplifies the graph and avoids backpropagating through each small step separately", "C": "Changes the value of the final output", "D": "Makes the gradient approximate"}, "ans": "B", "exp": "Staging the computation is standard practice in implementations."}, {"id": 1448, "q": "For vector-valued inputs and outputs, the local gradient at a node becomes:", "options": {"A": "The identity matrix always", "B": "The Hessian matrix", "C": "The Jacobian matrix, holding the derivative of each output element with respect to each input element", "D": "A single scalar"}, "ans": "C", "exp": "Its dimensions are (output size × input size)."}, {"id": 1449, "q": "For an element-wise operation with a 4096-dimensional input and a 4096-dimensional output, the Jacobian matrix has size:", "options": {"A": "4096 × 1, and must be stored in full", "B": "1 × 1", "C": "8192 × 8192", "D": "4096 × 4096, but it is diagonal, so it is never formed explicitly"}, "ans": "D", "exp": "Element-wise operations touch each dimension independently."}, {"id": 1450, "q": "A useful implementation check during backpropagation is that:", "options": {"A": "The gradient with respect to a variable always has the same shape as that variable", "B": "Gradients are always positive", "C": "Gradients always sum to one", "D": "Gradients must be integers"}, "ans": "A", "exp": "A shape mismatch signals a bug immediately."}, {"id": 1451, "q": "In a modular forward/backward API, each gate or layer must implement:", "options": {"A": "Only a forward method", "B": "Only a loss function", "C": "A training loop of its own", "D": "A forward method computing its output, and a backward method computing input gradients from the upstream gradient"}, "ans": "D", "exp": "Frameworks such as Caffe, Torch and PyTorch are built on this pattern."}, {"id": 1452, "q": "During the forward pass, a node typically caches its input values because:", "options": {"A": "The loss cannot be computed otherwise", "B": "They are needed to compute the local gradients in the backward pass", "C": "It reduces memory consumption", "D": "They must be printed for the user"}, "ans": "B", "exp": "This is why activations dominate memory use during training."}, {"id": 1453, "q": "A two-layer neural network is written as:", "options": {"A": "f = max(0, W₁x)", "B": "f = W₂ max(0, W₁x)", "C": "f = W₁x + b", "D": "f = W₂W₁x"}, "ans": "B", "exp": "The non-linearity between the two matrix multiplies is essential."}, {"id": 1454, "q": "If the non-linearity were removed, so that f = W₂W₁x, the network would:", "options": {"A": "Become strictly more expressive", "B": "Train faster and generalise better", "C": "Collapse into a single linear classifier, since the product of two matrices is one matrix", "D": "Be unable to compute any output"}, "ans": "C", "exp": "Depth without non-linearity buys nothing."}, {"id": 1455, "q": "In the lecture's example architecture with dimensions 3072 → 100 → 10, the value 100 is:", "options": {"A": "The size of the hidden layer", "B": "The number of input pixels", "C": "The number of output classes", "D": "The minibatch size"}, "ans": "A", "exp": "3072 is the stretched CIFAR image and 10 the class scores."}, {"id": 1456, "q": "A network described as a \"2-layer neural net\" is equivalently described as:", "options": {"A": "A network with no hidden layers", "B": "A 2-hidden-layer neural net", "C": "A 1-hidden-layer neural net", "D": "A 3-layer neural net"}, "ans": "C", "exp": "Layer counting conventionally excludes the input layer."}, {"id": 1457, "q": "Layers in which every neuron connects to every element of the previous layer's output are called:", "options": {"A": "Fully-connected layers", "B": "Recurrent layers", "C": "Convolutional layers", "D": "Pooling layers"}, "ans": "A", "exp": "Arranging neurons this way allows efficient matrix multiplication."}, {"id": 1458, "q": "The neuron analogy in neural networks is described in the lecture as loose because real biological neurons:", "options": {"A": "Contain no connections at all", "B": "Cannot transmit any signal", "C": "Come in many types, have dendrites performing non-linear computation, and synapses far more complex than a single weight", "D": "Are exactly equivalent to artificial units"}, "ans": "C", "exp": "\"Be very careful with your brain analogies.\""}, {"id": 1459, "q": "Which of the following is NOT an activation function discussed in the lecture?", "options": {"A": "ELU", "B": "Softmax gate", "C": "Maxout", "D": "Leaky ReLU"}, "ans": "B", "exp": "Sigmoid, tanh, ReLU, Leaky ReLU, Maxout and ELU were the ones listed."}, {"id": 1460, "q": "The main practical advantage of arranging neurons into layers is that it:", "options": {"A": "Reduces the number of training examples required to one", "B": "Guarantees the global optimum", "C": "Removes the need for activation functions", "D": "Allows the whole layer to be evaluated with efficient vectorised matrix operations"}, "ans": "D", "exp": "One matrix multiply evaluates every neuron in the layer at once."}, {"id": 1461, "q": "The reason backpropagation, rather than hand-derived formulas, is used for modern networks is that:", "options": {"A": "Gradients are unnecessary for training", "B": "Networks are far too large for gradient expressions to be written out by hand for every parameter", "C": "The chain rule does not apply to neural networks", "D": "Analytic gradients are always wrong"}, "ans": "B", "exp": "The graph structure lets gradients be computed mechanically. Part 45: AI Foundations & Definitions II (Q1462–1491)"}, {"id": 1462, "q": "A system is best described as \"artificially intelligent\" when it:", "options": {"A": "Contains more than one million lines of code", "B": "Is connected to the internet", "C": "Performs tasks that would normally require human intelligence", "D": "Runs on specialised hardware"}, "ans": "C", "exp": "The defining feature is the nature of the task, not the implementation."}, {"id": 1463, "q": "Which of the following is NOT one of the four subsets of AI presented in the course?", "options": {"A": "Database indexing", "B": "Reasoning", "C": "Natural language processing", "D": "Planning"}, "ans": "A", "exp": "Reasoning, NLP, Planning and Machine Learning were the four given."}, {"id": 1464, "q": "Machine reasoning is best illustrated by a system that:", "options": {"A": "Stores facts without using them", "B": "Compresses a file to save space", "C": "Displays data in a chart", "D": "Combines known facts and rules to reach a new conclusion"}, "ans": "D", "exp": "Reasoning fills in what nobody explicitly told the machine."}, {"id": 1465, "q": "Planning, as a subset of AI, is concerned with:", "options": {"A": "Storing data efficiently", "B": "Rendering graphics quickly", "C": "Translating between two languages", "D": "Choosing a sequence of actions that achieves a goal"}, "ans": "D", "exp": "It is a whole chain of decisions, not a single next step."}, {"id": 1466, "q": "A smart thermostat that learns your daily preferences and adjusts itself:", "options": {"A": "Is not AI, because it has no screen", "B": "Is AI, because it adapts its behaviour from experience", "C": "Is not AI, because the task is simple", "D": "Is AI only if it is connected to a phone"}, "ans": "B", "exp": "The bar for AI is lower than science fiction suggests."}, {"id": 1467, "q": "Machine learning is a subset of AI, and deep learning is a subset of:", "options": {"A": "Robotics", "B": "Machine learning", "C": "Expert systems", "D": "Natural language processing"}, "ans": "B", "exp": "AI ⊃ ML ⊃ DL, each nested inside the previous."}, {"id": 1468, "q": "An expert system that applies thousands of hand-written if–then rules is:", "options": {"A": "A clustering algorithm", "B": "Not AI at all", "C": "AI, but without any learning component", "D": "A form of deep learning"}, "ans": "C", "exp": "Early AI achieved capability through rules rather than learning."}, {"id": 1469, "q": "Which best characterises \"narrow AI\"?", "options": {"A": "A system that performs well within one bounded domain", "B": "A system with human-level general intelligence", "C": "A system that cannot be deployed commercially", "D": "A conscious machine"}, "ans": "A", "exp": "Every system in production today is narrow in this sense."}, {"id": 1470, "q": "The claim that a suitably programmed machine would genuinely have a mind and understanding is associated with:", "options": {"A": "Strong AI", "B": "Weak AI", "C": "Symbolic AI", "D": "Narrow AI"}, "ans": "A", "exp": "Weak AI makes no such claim about inner experience."}, {"id": 1471, "q": "In the course's framing, roughly what proportion of the last decade's headline AI breakthroughs came from machine learning rather than the other subsets?", "options": {"A": "About 10%", "B": "About 50%", "C": "About 25%", "D": "Over 90%"}, "ans": "D", "exp": "Which is why the semester concentrates on ML."}, {"id": 1472, "q": "Which of these is the clearest example of AI you may have used before breakfast?", "options": {"A": "A calculator adding two numbers", "B": "A torch turning on", "C": "A digital clock displaying the time", "D": "Face unlock matching your face to a stored pattern"}, "ans": "D", "exp": "Pattern recognition under variation is a learning problem."}, {"id": 1473, "q": "An agent, in AI terms, is anything that:", "options": {"A": "Runs in the background of an operating system", "B": "Must be physically embodied as a robot", "C": "Perceives its environment through sensors and acts on it through actuators", "D": "Stores data in a table"}, "ans": "C", "exp": "Software agents qualify as readily as physical ones."}, {"id": 1474, "q": "A rational agent is one that acts so as to:", "options": {"A": "Maximise its expected performance measure given what it knows", "B": "Avoid taking any action that could fail", "C": "Copy human behaviour exactly, mistakes included", "D": "Minimise the amount of computation performed"}, "ans": "A", "exp": "Rationality is bounded by available information and resources."}, {"id": 1475, "q": "Which is the strongest reason AI is described as an interdisciplinary field?", "options": {"A": "It uses the English language", "B": "It draws on computer science, mathematics, neuroscience, psychology and linguistics", "C": "It is taught in universities", "D": "It requires expensive hardware"}, "ans": "B", "exp": "Computer vision alone borrows from biology, physics and cognitive science."}, {"id": 1476, "q": "The main practical difference between automation and artificial intelligence is that automation:", "options": {"A": "Requires more data than AI", "B": "Repeats a fixed, pre-defined procedure, while AI adapts to new inputs", "C": "Is always faster than AI", "D": "Cannot be implemented in software"}, "ans": "B", "exp": "Rule-based robotic process automation illustrates the distinction."}, {"id": 1477, "q": "Which statement about AI is FALSE?", "options": {"A": "All AI systems are neural networks", "B": "Machine learning is currently the dominant approach to AI", "C": "AI systems can be narrow in scope", "D": "AI includes approaches that do not learn from data"}, "ans": "A", "exp": "Search, logic and rule-based expert systems are AI without neural networks."}, {"id": 1478, "q": "A spam filter that improves as users mark messages as junk is an example of:", "options": {"A": "A planning system", "B": "A hand-coded rule system", "C": "A supervised learning system improving with labelled experience", "D": "An unsupervised clustering system"}, "ans": "C", "exp": "Each user correction supplies a label."}, {"id": 1479, "q": "In the Turing Test, the machine passes if:", "options": {"A": "It answers every question correctly", "B": "It computes faster than the human", "C": "A human judge cannot reliably distinguish it from a human in conversation", "D": "It defeats a human at a board game"}, "ans": "C", "exp": "It measures behavioural indistinguishability, not correctness."}, {"id": 1480, "q": "A common criticism of the Turing Test is that it:", "options": {"A": "Applies only to robots", "B": "Requires quantum hardware", "C": "Cannot be conducted in practice", "D": "Rewards convincing imitation rather than genuine understanding"}, "ans": "D", "exp": "Searle's Chinese Room argument presses exactly this point."}, {"id": 1481, "q": "Which of the following tasks is currently EASIEST for AI relative to humans?", "options": {"A": "Walking over uneven ground", "B": "Recognising a friend's face in an unfamiliar crowd", "C": "Understanding sarcasm in casual conversation", "D": "Ranking millions of documents by relevance in a second"}, "ans": "D", "exp": "Moravec's paradox: what humans find easy is often hardest for machines."}, {"id": 1482, "q": "The statement \"AI is only as good as the data it learns from\" is significant because:", "options": {"A": "Algorithms are irrelevant to performance", "B": "Data volume determines processor speed", "C": "Poor or biased data produces poor or biased models regardless of the algorithm", "D": "Data must always be numeric"}, "ans": "C", "exp": "Garbage in, garbage out applies with full force to ML."}, {"id": 1483, "q": "Which of these is an example of AI applied in a Nigerian context, as discussed in class?", "options": {"A": "Mobile money platforms screening every transaction for fraud with ML", "B": "Manufacturing SIM cards", "C": "Painting bank branches", "D": "Printing bank statements"}, "ans": "A", "exp": "OPay, PalmPay and Kuda were cited as examples."}, {"id": 1484, "q": "The term \"artificial intelligence\" was first used at a conference in which year?", "options": {"A": "1943", "B": "1956", "C": "1974", "D": "1969"}, "ans": "B", "exp": "The Dartmouth Conference, widely treated as the birth of the field."}, {"id": 1485, "q": "Which pairing correctly matches a subset of AI with an example?", "options": {"A": "Machine learning — sorting a list alphabetically", "B": "Planning — clustering customers by purchase history", "C": "Natural language processing — a chatbot interpreting a customer complaint", "D": "Reasoning — resizing an image"}, "ans": "C", "exp": "Understanding messy human communication is the NLP task."}, {"id": 1486, "q": "In practice, most deployed AI systems today are best described as:", "options": {"A": "Narrow systems solving one well-defined task", "B": "Artificial general intelligence", "C": "Conscious systems", "D": "Systems with no training data"}, "ans": "A", "exp": "AGI remains a research aspiration rather than a product."}, {"id": 1487, "q": "Which best explains why \"intelligence\" is difficult to define in AI?", "options": {"A": "The word is not used in English", "B": "It has an agreed mathematical definition that is simply too complex", "C": "Only philosophers may define it", "D": "Intelligence covers many distinct capabilities, and the goalposts shift as machines master each one"}, "ans": "D", "exp": "Tasks once seen as requiring intelligence, like chess, are later called \"just computation\"."}, {"id": 1488, "q": "A system that recommends products based on what similar users bought is performing:", "options": {"A": "Symbolic planning", "B": "Rule-based expert reasoning", "C": "Reasoning from formal logic", "D": "Machine learning from behavioural data"}, "ans": "D", "exp": "Patterns are learned from data, not written by hand."}, {"id": 1489, "q": "Which of the following is the best definition of an algorithm?", "options": {"A": "A programming language", "B": "A dataset with labels", "C": "A trained model file", "D": "A step-by-step set of instructions for transforming input into output"}, "ans": "D", "exp": "The recipe; the model is what you bake from it."}, {"id": 1490, "q": "In machine learning, the distinction between an algorithm and a model is that:", "options": {"A": "The model is the procedure; the algorithm is the output", "B": "They are two words for the same thing", "C": "The algorithm is the learning procedure; the model is the result of running it on data", "D": "Models exist only in deep learning"}, "ans": "C", "exp": "\"Find the best line through this data\" is the algorithm; the fitted line is the model."}, {"id": 1491, "q": "Which of the following would NOT normally be considered a goal of artificial intelligence?", "options": {"A": "Guaranteeing that no software ever contains a bug", "B": "Building systems that reason about information", "C": "Building systems that learn from experience", "D": "Building systems that perceive their environment"}, "ans": "A", "exp": "Software correctness is a software-engineering concern, not an AI goal. Part 46: AI & Deep Learning History II (Q1492–1521)"}, {"id": 1492, "q": "Alan Turing's 1950 paper \"Computing Machinery and Intelligence\" opened with which question?", "options": {"A": "How fast can a machine compute?", "B": "Can machines think?", "C": "How much memory does intelligence require?", "D": "What is the cheapest computer?"}, "ans": "B", "exp": "He then replaced it with the operational Imitation Game."}, {"id": 1493, "q": "The Dartmouth Conference of 1956 is significant because it:", "options": {"A": "Introduced backpropagation", "B": "Launched the field of AI as a named discipline", "C": "Produced the first working robot", "D": "Ended the first AI winter"}, "ans": "B", "exp": "John McCarthy coined the term for the proposal."}, {"id": 1494, "q": "The McCulloch–Pitts neuron (1943) is important as:", "options": {"A": "The first mathematical model of a neuron as a computing unit", "B": "The first expert system", "C": "The first commercial AI product", "D": "The first convolutional network"}, "ans": "A", "exp": "It predates the perceptron by fifteen years."}, {"id": 1495, "q": "Rosenblatt's perceptron (1958) was notable because it:", "options": {"A": "Used the ReLU activation", "B": "Could learn its weights from examples rather than having them set by hand", "C": "Contained many hidden layers", "D": "Was trained with Adam"}, "ans": "B", "exp": "Learning from data was the breakthrough idea."}, {"id": 1496, "q": "The Mark I Perceptron machine was connected to a camera producing an image of:", "options": {"A": "1024 pixels", "B": "4 pixels", "C": "400 pixels, from a 20×20 grid of photocells", "D": "1 million pixels"}, "ans": "C", "exp": "A physical implementation of the perceptron algorithm."}, {"id": 1497, "q": "Minsky and Papert's book Perceptrons (1969) damaged the field's momentum by showing that a single-layer perceptron:", "options": {"A": "Required too little data", "B": "Could not compute the XOR function", "C": "Could solve any problem", "D": "Was too fast to be useful"}, "ans": "B", "exp": "Linearly inseparable problems lie beyond a single layer."}, {"id": 1498, "q": "Widrow and Hoff's contribution around 1960 was:", "options": {"A": "The Turing Test", "B": "The ImageNet dataset", "C": "The transformer architecture", "D": "Adaline and Madaline, early adaptive linear networks"}, "ans": "D", "exp": "Among the earliest trainable adaptive systems."}, {"id": 1499, "q": "Backpropagation became widely known in 1986 through the work of:", "options": {"A": "Rumelhart, Hinton and Williams", "B": "Turing and Church", "C": "Fei-Fei Li and colleagues", "D": "Viola and Jones"}, "ans": "A", "exp": "The paper made training multi-layer networks practical."}, {"id": 1500, "q": "The first AI winter began in the mid-to-late:", "options": {"A": "1970s", "B": "1960s", "C": "1950s", "D": "1990s"}, "ans": "A", "exp": "Funding collapsed after early promises went unmet."}, {"id": 1501, "q": "In the United Kingdom, the report widely blamed for triggering the first AI winter was the:", "options": {"A": "Dartmouth Proposal", "B": "Marr Review", "C": "Turing Report", "D": "Lighthill Report"}, "ans": "D", "exp": "Its critical assessment led to sweeping funding cuts."}, {"id": 1502, "q": "The common cause of both AI winters was:", "options": {"A": "Expectations running far ahead of what the technology could deliver", "B": "Hardware becoming too cheap", "C": "Excessive availability of data", "D": "A shortage of programmers"}, "ans": "A", "exp": "Hype followed by disappointment, twice."}, {"id": 1503, "q": "Expert systems represented AI that was:", "options": {"A": "Learned entirely from raw data", "B": "Trained by reinforcement learning", "C": "Based on convolutional filters", "D": "Rule-based, with knowledge hand-encoded by human experts"}, "ans": "D", "exp": "Thousands of nested if–then rules covering a narrow domain."}, {"id": 1504, "q": "A major practical weakness of expert systems was that they:", "options": {"A": "Ran too fast to be controlled", "B": "Could learn any task automatically", "C": "Required no human expertise", "D": "Were expensive to build and brittle outside their narrow domain"}, "ans": "D", "exp": "Every new case demanded more hand-written rules."}, {"id": 1505, "q": "Hinton and Salakhutdinov's 2006 work is credited with:", "options": {"A": "Reinvigorating research interest in deep learning", "B": "Ending all neural network research", "C": "Creating ImageNet", "D": "Inventing the perceptron"}, "ans": "A", "exp": "It showed deep networks could be trained effectively."}, {"id": 1506, "q": "The first strong commercial results from deep learning appeared around 2010–2012 in:", "options": {"A": "Weather control", "B": "Speech recognition and acoustic modelling", "C": "Autonomous shipping", "D": "Quantum chemistry"}, "ans": "B", "exp": "Work by Mohamed, Dahl and Hinton on deep belief networks."}, {"id": 1507, "q": "The \"triple convergence\" behind the modern AI boom refers to:", "options": {"A": "Three programming languages", "B": "Big data, cheap parallel compute, and improved algorithms arriving together", "C": "Three government policies", "D": "Three competing companies"}, "ans": "B", "exp": "No single one of the three would have sufficed alone."}, {"id": 1508, "q": "Which hardware development mattered most for deep learning's rise?", "options": {"A": "Larger monitors", "B": "Faster hard drives", "C": "Graphics processing units repurposed for parallel matrix computation", "D": "Wireless networking"}, "ans": "C", "exp": "GPUs made training deep networks economically feasible."}, {"id": 1509, "q": "The mobile and internet era mattered to AI mainly because it:", "options": {"A": "Made programming easier", "B": "Slowed down research", "C": "Generated enormous quantities of data to learn from", "D": "Reduced the need for algorithms"}, "ans": "C", "exp": "Data is the fuel that modern methods consume."}, {"id": 1510, "q": "The 2018 ACM Turing Award went to Bengio, Hinton and LeCun for:", "options": {"A": "Proving P ≠ NP", "B": "Inventing the internet", "C": "Conceptual and engineering breakthroughs that made deep neural networks a critical component of computing", "D": "Developing the first database"}, "ans": "C", "exp": "Often called the \"Nobel Prize of computing\"."}, {"id": 1511, "q": "In the 1960s, neural networks were used mainly for:", "options": {"A": "Image captioning", "B": "Protein folding", "C": "Binary classification", "D": "Language translation at scale"}, "ans": "C", "exp": "Ambitions were modest and the hardware tiny."}, {"id": 1512, "q": "Which sequence correctly orders these milestones?", "options": {"A": "AlexNet → Perceptron → Turing Test → Dartmouth Conference", "B": "Turing Test → Dartmouth Conference → Perceptron → AlexNet", "C": "Perceptron → Dartmouth Conference → Turing Test → AlexNet", "D": "Dartmouth Conference → Turing Test → AlexNet → Perceptron"}, "ans": "B", "exp": "1950, 1956, 1958, 2012."}, {"id": 1513, "q": "MYCIN, an early expert system, was designed to:", "options": {"A": "Recognise handwritten digits", "B": "Play chess", "C": "Diagnose bacterial infections and recommend antibiotics", "D": "Configure computer orders"}, "ans": "C", "exp": "A landmark medical rule-based system."}, {"id": 1514, "q": "The 1980s expert-system boom eventually faded because:", "options": {"A": "Rules could not scale or adapt, and maintenance costs grew unsustainable", "B": "Computers were banned", "C": "They learned too quickly", "D": "Nobody could write rules"}, "ans": "A", "exp": "This contributed to the second AI winter."}, {"id": 1515, "q": "Deep Blue's 1997 defeat of Garry Kasparov relied primarily on:", "options": {"A": "Reinforcement learning from self-play", "B": "Natural language understanding", "C": "Massive search with hand-crafted evaluation and specialised hardware", "D": "Deep neural networks trained on games"}, "ans": "C", "exp": "Very different in kind from AlphaGo two decades later."}, {"id": 1516, "q": "Which statement about the history of neural networks is TRUE?", "options": {"A": "They were invented in 2012", "B": "They were never used before the internet", "C": "Interest in them rose, collapsed and rose again over several decades", "D": "They have been continuously popular since 1943"}, "ans": "C", "exp": "The field's history is cyclical rather than linear."}, {"id": 1517, "q": "LeCun's LeNet-5 (1998) was applied successfully to:", "options": {"A": "Protein structure prediction", "B": "Document and handwritten digit recognition", "C": "Speech synthesis", "D": "Machine translation"}, "ans": "B", "exp": "Used commercially for reading cheques."}, {"id": 1518, "q": "Fukushima's Neocognitron (1980) anticipated CNNs by using:", "options": {"A": "A sandwich of simple cells with adjustable parameters and complex cells that pool", "B": "Fully-connected layers only", "C": "Random forests", "D": "Backpropagation with Adam"}, "ans": "A", "exp": "Directly inspired by Hubel and Wiesel's findings."}, {"id": 1519, "q": "The lesson the course draws from the two AI winters is that:", "options": {"A": "AI research should never be funded", "B": "Hardware is irrelevant", "C": "Overpromising damages a field when reality falls short", "D": "Neural networks always fail"}, "ans": "C", "exp": "A caution worth remembering during any boom."}, {"id": 1520, "q": "Which best describes the state of AI between roughly 1974 and 1980?", "options": {"A": "Rapid commercial expansion", "B": "Sharply reduced funding and diminished expectations", "C": "Widespread consumer adoption", "D": "The invention of deep learning"}, "ans": "B", "exp": "The first winter."}, {"id": 1521, "q": "The single event most often cited as the start of the modern deep learning era is:", "options": {"A": "The 1956 Dartmouth Conference", "B": "The 2012 ImageNet victory of a deep convolutional network", "C": "The 1997 Deep Blue match", "D": "The 1969 publication of Perceptrons"}, "ans": "B", "exp": "Error rates fell dramatically and the field pivoted. Part 47: ML Paradigms & Workflow II (Q1522–1551)"}, {"id": 1522, "q": "In traditional programming the developer supplies data and rules to obtain answers. In machine learning the developer supplies:", "options": {"A": "Rules and answers, to obtain data", "B": "Data and answers, to obtain rules", "C": "Only rules", "D": "Neither data nor answers"}, "ans": "B", "exp": "The model infers the rules that map inputs to outputs."}, {"id": 1523, "q": "Tom Mitchell's definition of learning involves which three elements?", "options": {"A": "Experience, task and performance measure", "B": "Input, output and hidden layer", "C": "Bias, variance and noise", "D": "Training, validation and testing"}, "ans": "A", "exp": "Performance at T, measured by P, improves with experience E."}, {"id": 1524, "q": "Supervised learning is distinguished by the presence of:", "options": {"A": "A reward signal delivered after many steps", "B": "No feedback at all", "C": "Clusters discovered automatically", "D": "Labelled input–output pairs"}, "ans": "D", "exp": "The label supplies direct error correction."}, {"id": 1525, "q": "Unsupervised learning is used when:", "options": {"A": "The data has no labels and we want to discover structure", "B": "An environment issues rewards", "C": "Every example carries a correct answer", "D": "The model must be deployed to production"}, "ans": "A", "exp": "Clustering and dimensionality reduction are typical goals."}, {"id": 1526, "q": "Reinforcement learning differs from supervised learning because its feedback is:", "options": {"A": "Absent entirely", "B": "Immediate and fully labelled", "C": "Provided by a human for every action", "D": "Delayed and evaluative rather than a correct answer"}, "ans": "D", "exp": "The agent must work out which earlier actions earned the reward."}, {"id": 1527, "q": "Semi-supervised learning is attractive when:", "options": {"A": "Only rewards are available", "B": "No data exists", "C": "Labels are cheap and abundant", "D": "A small labelled set is available alongside a large unlabelled set"}, "ans": "D", "exp": "Labelling is often the expensive bottleneck."}, {"id": 1528, "q": "Predicting tomorrow's temperature from historical weather data is:", "options": {"A": "A reinforcement learning task", "B": "A clustering task", "C": "A classification task", "D": "A regression task"}, "ans": "D", "exp": "The output is a continuous quantity."}, {"id": 1529, "q": "Deciding whether an email is spam or not spam is:", "options": {"A": "Binary classification", "B": "Dimensionality reduction", "C": "Multi-class classification", "D": "Regression"}, "ans": "A", "exp": "Exactly two mutually exclusive outcomes."}, {"id": 1530, "q": "Grouping customers into segments without any predefined categories is:", "options": {"A": "Regression", "B": "Supervised classification", "C": "Reinforcement learning", "D": "Unsupervised clustering"}, "ans": "D", "exp": "No target labels are supplied."}, {"id": 1531, "q": "Structured data is best described as:", "options": {"A": "Video streams", "B": "Raw photographs and audio recordings", "C": "Data organised in rows and columns with a defined schema", "D": "Free-form text documents"}, "ans": "C", "exp": "Bank transactions and sensor logs are typical examples."}, {"id": 1532, "q": "Which of the following is unstructured data?", "options": {"A": "A spreadsheet of monthly sales figures", "B": "A folder of customer photographs", "C": "A relational database table", "D": "A CSV of student marks"}, "ans": "B", "exp": "Images carry no inherent row-and-column schema."}, {"id": 1533, "q": "In the training loop described in class, the three repeating steps are:", "options": {"A": "Train, test, publish", "B": "Represent, evaluate, optimise", "C": "Collect, clean, deploy", "D": "Encode, decode, compress"}, "ans": "B", "exp": "Propose a candidate model, measure how wrong it is, adjust."}, {"id": 1534, "q": "Offline (batch) learning means the model:", "options": {"A": "Never uses training data", "B": "Updates continuously from each new example as it arrives", "C": "Is trained once and then deployed without further change", "D": "Runs only at night"}, "ans": "C", "exp": "Retraining requires a fresh training cycle."}, {"id": 1535, "q": "Online learning is preferable w
