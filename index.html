ure independence within each class"}, "ans": "D", "exp": "\"Naive\" simplification works surprisingly well for text/spam."}, {"id": 255, "q": "Laplace (add-one) smoothing prevents:", "options": {"A": "Zero probabilities for unseen events", "B": "Underflow always", "C": "Data leakage", "D": "Overfitting by design"}, "ans": "A", "exp": "Ensures nonzero estimates from finite samples."}, {"id": 256, "q": "Hidden Markov Models model systems via:", "options": {"A": "Hidden states emitting observable symbols with transition/emission probabilities", "B": "Neural activations", "C": "Deterministic automata without chance", "D": "Fixed lookup tables"}, "ans": "A", "exp": "Speech recognition's classic statistical engine."}, {"id": 257, "q": "The Viterbi algorithm finds:", "options": {"A": "Prime factorization", "B": "Most probable hidden state sequence for an HMM observation sequence", "C": "Optimal neural weights", "D": "Shortest road path"}, "ans": "B", "exp": "Dynamic programming over trellis; O(N^2 T)."}, {"id": 258, "q": "Forward algorithm computes:", "options": {"A": "Emission matrix inverse", "B": "Model parameters directly", "C": "Probability of an observation prefix summed over hidden paths", "D": "Single best path value only"}, "ans": "C", "exp": "Likelihood evaluation task of HMMs."}, {"id": 259, "q": "Baum-Welch (EM) trains HMM parameters using:", "options": {"A": "Genetic mutation", "B": "Exhaustive enumeration of all paths guaranteed feasible", "C": "Manual tuning exclusively", "D": "Expected counts from forward-backward iterations"}, "ans": "D", "exp": "Special case of Expectation-Maximization."}, {"id": 260, "q": "Kalman filters maintain beliefs over:", "options": {"A": "Image pixels directly", "B": "Text corpora", "C": "Continuous linear-Gaussian dynamic systems", "D": "Discrete board games"}, "ans": "C", "exp": "Recursive prediction-correction; optimal under its assumptions."}, {"id": 261, "q": "Extended Kalman Filter linearizes:", "options": {"A": "Only measurements", "B": "Nothing at all", "C": "Nonlinear dynamics around current estimate via Jacobians", "D": "Linear functions needlessly"}, "ans": "C", "exp": "Standard robotics localization tool."}, {"id": 262, "q": "Particle filters represent beliefs as:", "options": {"A": "Single point estimates", "B": "Weighted samples (particles) propagated through dynamics", "C": "Exact Gaussian formulas always", "D": "Boolean flags"}, "ans": "B", "exp": "Nonparametric Bayesian filtering (Monte Carlo localization)."}, {"id": 263, "q": "Markov Decision Process tuple includes:", "options": {"A": "Pixels, labels", "B": "Rules and facts only", "C": "Tokens, embeddings", "D": "States, actions, transition model, rewards (discount)"}, "ans": "D", "exp": "Framework for sequential decision making."}, {"id": 264, "q": "The discount factor gamma controls:", "options": {"A": "Number of clusters", "B": "Present-value weighting of future rewards", "C": "Tree depth in minimax", "D": "Learning rate of backprop"}, "ans": "B", "exp": "Gamma near 0 = myopic; near 1 = far-sighted."}, {"id": 265, "q": "A policy maps:", "options": {"A": "Times to policies themselves", "B": "Rewards to states", "C": "States to actions", "D": "Actions to states deterministically always"}, "ans": "C", "exp": "Optimal policy maximizes expected return from every state."}, {"id": 266, "q": "Value function V(s) denotes:", "options": {"A": "Expected cumulative reward starting from state s under a policy", "B": "Node degree in graph", "C": "Variance of dataset", "D": "Voltage level"}, "ans": "A", "exp": "Bellman equations characterize optimality recursively."}, {"id": 267, "q": "Bellman optimality equation expresses V* as:", "options": {"A": "Sum of all past rewards unweighted", "B": "Zero always at terminals", "C": "Random walk average", "D": "Max over actions of expected immediate reward plus discounted V*(next state)"}, "ans": "D", "exp": "Foundation of dynamic programming solutions."}, {"id": 268, "q": "Value iteration converges by:", "options": {"A": "Repeatedly applying Bellman optimality backup to all states", "B": "Removing states iteratively", "C": "Freezing the policy forever initially", "D": "Sampling one trajectory once"}, "ans": "A", "exp": "Contraction mapping guarantees convergence."}, {"id": 269, "q": "Policy iteration alternates:", "options": {"A": "Policy evaluation and policy improvement until stable", "B": "Clustering steps", "C": "Data collection and deletion", "D": "Random restarts only"}, "ans": "A", "exp": "Often fewer iterations than value iteration."}, {"id": 270, "q": "Q-learning updates action values using:", "options": {"A": "Supervised labels from experts", "B": "Backpropagated classification error", "C": "Monte Carlo returns only at episode end", "D": "Observed reward plus discounted max future Q (off-policy TD)"}, "ans": "D", "exp": "Watkins' algorithm; converges to Q* under conditions."}, {"id": 271, "q": "Q-learning is called off-policy because:", "options": {"A": "It learns optimal Q while behaving possibly non-greedily (e.g., epsilon-greedy)", "B": "Humans label transitions", "C": "It never acts", "D": "Policy equals behavior always"}, "ans": "A", "exp": "Target uses max over next actions regardless of behavior policy."}, {"id": 272, "q": "SARSA differs from Q-learning by updating toward:", "options": {"A": "Average of all actions", "B": "The action actually taken next (on-policy)", "C": "The greedy best next action regardless", "D": "Terminal reward only"}, "ans": "B", "exp": "More conservative under exploration risks."}, {"id": 273, "q": "Temporal-difference learning blends:", "options": {"A": "Supervised regression solely", "B": "Monte Carlo ideas (sampling) with dynamic programming (bootstrapping)", "C": "Rule chaining", "D": "Pure enumeration only"}, "ans": "B", "exp": "Updates estimates from other estimates without waiting episode end."}, {"id": 274, "q": "Eligibility traces implement:", "options": {"A": "Disk caching", "B": "Credit assignment across recent state-action pairs (TD(lambda))", "C": "Memory garbage collection", "D": "Neuron firing thresholds"}, "ans": "B", "exp": "Bridge MC and one-step TD continuum."}, {"id": 275, "q": "Deep Q-Network (DQN) stabilized learning using:", "options": {"A": "Experience replay buffer and separate target network", "B": "Supervised pretraining mandatory", "C": "Larger batch size alone", "D": "Removing nonlinearities"}, "ans": "A", "exp": "Mnih et al. 2015 Nature; Atari benchmark success."}, {"id": 276, "q": "Policy gradient methods optimize:", "options": {"A": "Cluster inertia", "B": "Expected return directly by ascending gradient of performance w.r.t. policy params", "C": "Squared label errors only", "D": "Entropy to zero forcibly"}, "ans": "B", "exp": "REINFORCE is the basic estimator."}, {"id": 277, "q": "Actor-critic architectures combine:", "options": {"A": "Trees and hash tables", "B": "Encoder-decoder pairs only", "C": "Two generators fighting", "D": "Policy (actor) with learned value function (critic) reducing variance"}, "ans": "D", "exp": "Basis of A3C, PPO-adjacent designs."}, {"id": 278, "q": "PPO improves stability by:", "options": {"A": "Doubling learning rates", "B": "Freezing networks entirely", "C": "Clipping policy updates to stay near previous policy", "D": "Removing replay buffers mandatorily"}, "ans": "C", "exp": "Trust-region-like approximation widely used (OpenAI)."}, {"id": 279, "q": "Inverse reinforcement learning infers:", "options": {"A": "Action names", "B": "Rewards given explicitly by engineers", "C": "State spaces automatically", "D": "Reward function from expert demonstrations"}, "ans": "D", "exp": "Ng & Russell; apprenticeship learning."}, {"id": 280, "q": "Multi-agent RL introduces challenges like:", "options": {"A": "Single objective trivially", "B": "Non-stationarity from co-learning agents", "C": "Guaranteed monotonic improvement", "D": "No credit assignment issues"}, "ans": "B", "exp": "Environments change as others learn."}, {"id": 281, "q": "Partial observability in MDPs yields:", "options": {"A": "Fully deterministic control", "B": "No sensing whatsoever", "C": "POMDPs requiring belief-state tracking", "D": "Open-loop plans sufficing"}, "ans": "C", "exp": "Belief MDP conversion standard technique."}, {"id": 282, "q": "Fuzzy logic differs from classical logic by allowing:", "options": {"A": "Degrees of truth between 0 and 1", "B": "No rules", "C": "Only crisp true/false", "D": "Negative truths"}, "ans": "A", "exp": "Zadeh 1965 introduced fuzzy sets."}, {"id": 283, "q": "A membership function maps inputs to:", "options": {"A": "Binary indicators strictly", "B": "Integer ranks", "C": "Probabilities summing to one necessarily", "D": "Membership degrees in [0,1] for a fuzzy set"}, "ans": "D", "exp": "E.g., \"temperature is HIGH\" with gradual boundary."}, {"id": 284, "q": "Fuzzy inference (Mamdani) typically involves:", "options": {"A": "Hashing then sorting", "B": "Tokenization then embedding", "C": "Convolution then pooling", "D": "Fuzzification, rule evaluation, aggregation, defuzzification"}, "ans": "D", "exp": "Pipeline behind fuzzy controllers."}, {"id": 285, "q": "Defuzzification converts:", "options": {"A": "Sets into SQL queries", "B": "Crisp values into fuzzy sets", "C": "Aggregate fuzzy output into a crisp control value (e.g., centroid method)", "D": "Rules into graphs"}, "ans": "C", "exp": "Centroid/center-of-gravity common choice."}, {"id": 286, "q": "A classic fuzzy control application:", "options": {"A": "Automatic transmission/washing machine/fan speed regulation", "B": "Sorting arrays", "C": "Database indexing", "D": "Compiling C code"}, "ans": "A", "exp": "Hitachi sent 1990s fuzzy consumer products boom."}, {"id": 287, "q": "Fuzzy rule base example form:", "options": {"A": "IF temperature IS high AND humidity IS medium THEN fan_speed IS fast", "B": "GOTO statement", "C": "y = Wx + b only", "D": "SELECT * FROM weather"}, "ans": "A", "exp": "Linguistic variables make rules human-readable."}, {"id": 288, "q": "Linguistic variables take:", "options": {"A": "File paths", "B": "Only integers", "C": "Words like LOW/MEDIUM/HIGH as values", "D": "Unicode escapes"}, "ans": "C", "exp": "Zadeh's mechanism bridging human language and control math."}, {"id": 289, "q": "Fuzzy set union corresponds to:", "options": {"A": "Arithmetic addition capped arbitrarily", "B": "Pointwise max of membership functions", "C": "Set intersection", "D": "Complement operation"}, "ans": "B", "exp": "Intersection is min; complement is 1 minus mu."}, {"id": 290, "q": "T-norm operators generalize:", "options": {"A": "Implication only", "B": "AND/conjunction semantics in fuzzy logic", "C": "Negation", "D": "XOR exclusively"}, "ans": "B", "exp": "Examples: min, product, Lukasiewicz t-norm."}, {"id": 291, "q": "Type-2 fuzzy sets add uncertainty about:", "options": {"A": "Membership function shapes themselves", "B": "Input sensor voltages", "C": "Rule ordering indexes", "D": "Output units"}, "ans": "A", "exp": "Higher-order fuzziness for noisy domains."}, {"id": 292, "q": "Neuro-fuzzy systems (e.g., ANFIS) combine:", "options": {"A": "Neural learning of fuzzy membership/rule parameters", "B": "Symbolic logic only", "C": "Genetic drift alone", "D": "Two unrelated pipelines"}, "ans": "A", "exp": "Jang's ANFIS tunes Sugeno-type systems via backprop."}, {"id": 293, "q": "Sugeno (TSK) fuzzy models use consequents that are:", "options": {"A": "Random noise terms", "B": "Verbal statements only", "C": "Always constant zero", "D": "Linear functions of inputs rather than fuzzy sets"}, "ans": "D", "exp": "Convenient for mathematical analysis/control synthesis."}, {"id": 294, "q": "Fuzzy c-means clusters data with:", "options": {"A": "No distance measure", "B": "Exactly one cluster per point forced", "C": "Soft memberships per cluster instead of hard assignment", "D": "Labels supplied externally"}, "ans": "C", "exp": "Bezdek's generalization of k-means."}, {"id": 295, "q": "Possibility theory (Zadeh/Dubois-Prade) models:", "options": {"A": "Degrees of feasibility distinct from probability", "B": "Only frequencies", "C": "Boolean constraints", "D": "Time series trends"}, "ans": "A", "exp": "Useful when information is imprecise but not random."}, {"id": 296, "q": "Rough sets (Pawlak) approximate concepts via:", "options": {"A": "Smooth kernels only", "B": "Fourier transforms", "C": "Lower and upper approximations from indiscernibility classes", "D": "Wavelet packets"}, "ans": "C", "exp": "Handle vagueness without membership functions."}, {"id": 297, "q": "Info-gap/probability bounds approaches address:", "options": {"A": "Deterministic arithmetic", "B": "Perfect knowledge scenarios", "C": "Compiler optimization", "D": "Severe uncertainty beyond precise distributions"}, "ans": "D", "exp": "Robust decision-making frameworks."}, {"id": 298, "q": "Dempster's combination rule aggregates:", "options": {"A": "Simple averages only", "B": "Binary votes discarded after counting", "C": "Sorted lists", "D": "Evidence from independent sources over power sets of hypotheses"}, "ans": "D", "exp": "May yield counterintuitive results (Zadeh's paradox)."}, {"id": 299, "q": "Calibration of probabilistic forecasts means predicted confidence matches:", "options": {"A": "Number of parameters", "B": "Empirical frequency of outcomes (e.g., 70% events occur ~70% of time)", "C": "Training accuracy on train set", "D": "Maximum entropy regardless"}, "ans": "B", "exp": "Temperature scaling post-hoc calibrates deep nets."}, {"id": 300, "q": "Aleatoric vs epistemic uncertainty distinction:", "options": {"A": "CPU versus GPU loads", "B": "Label vs feature columns", "C": "Data-inherent noise versus model-knowledge uncertainty", "D": "Fast versus slow training"}, "ans": "C", "exp": "Epistemic reducible with more data; aleatoric not. Part 6: Machine Learning Fundamentals (Q301-350)"}, {"id": 301, "q": "Machine learning is best defined as:", "options": {"A": "Programs improving performance at tasks with experience", "B": "Manual coding of every rule", "C": "Data storage optimization", "D": "Hardware acceleration techniques"}, "ans": "A", "exp": "Mitchell's task/experience/performance framing."}, {"id": 302, "q": "In supervised learning, the model learns from:", "options": {"A": "Only unlabeled data", "B": "Reward signals alone", "C": "No data whatsoever", "D": "Input-output labeled pairs"}, "ans": "D", "exp": "Mapping from X to Y is induced from examples."}, {"id": 303, "q": "Classification predicts:", "options": {"A": "Continuous quantities always", "B": "Nothing measurable", "C": "Discrete categories or labels", "D": "Time stamps only"}, "ans": "C", "exp": "Regression handles continuous targets instead."}, {"id": 304, "q": "Regression models output:", "options": {"A": "Class labels strictly", "B": "Continuous numeric values", "C": "Cluster IDs", "D": "Text tokens"}, "ans": "B", "exp": "E.g., predicting house prices."}, {"id": 305, "q": "Unsupervised learning discovers:", "options": {"A": "Human annotations automatically", "B": "Reward-maximizing policies", "C": "Hidden structure without labeled guidance", "D": "Ground-truth classes given upfront"}, "ans": "C", "exp": "Clustering, dimensionality reduction, density estimation."}, {"id": 306, "q": "Semi-supervised learning combines:", "options": {"A": "Labels exclusively", "B": "Small labeled sets with large unlabeled sets", "C": "Zero data", "D": "Rewards only"}, "ans": "B", "exp": "Exploits cheap unlabeled data alongside scarce labels."}, {"id": 307, "q": "Self-supervised learning creates supervision by:", "options": {"A": "Random guessing frozen forever", "B": "Deriving labels from the data structure itself (e.g., next-token prediction)", "C": "Hiring annotators", "D": "Copying other models' outputs only"}, "ans": "B", "exp": "Foundation of modern LLM pretraining."}, {"id": 308, "q": "Reinforcement learning feedback consists of:", "options": {"A": "No feedback at all", "B": "Always-positive signals", "C": "Immediate full labels", "D": "Delayed evaluative rewards rather than correct answers"}, "ans": "D", "exp": "Requires credit assignment over time."}, {"id": 309, "q": "The training set is used to:", "options": {"A": "Fit model parameters", "B": "Tune hyperparameters only", "C": "Deploy models directly", "D": "Report final unbiased performance"}, "ans": "A", "exp": "Validation tunes; test evaluates once."}, {"id": 310, "q": "Purpose of a validation set:", "options": {"A": "Gradient computation", "B": "Final performance reporting", "C": "Mandatory augmentation source", "D": "Hyperparameter tuning/model selection without contaminating the test set"}, "ans": "D", "exp": "Avoids optimistic bias in estimates."}, {"id": 311, "q": "K-fold cross-validation:", "options": {"A": "Rotates validation folds k times and averages results", "B": "Discards k-1 folds forever", "C": "Trains exactly once on everything", "D": "Needs k GPUs strictly"}, "ans": "A", "exp": "Reliable estimates especially for small datasets."}, {"id": 312, "q": "Leave-one-out CV means:", "options": {"A": "k equals the number of samples", "B": "k = 2 always", "C": "k = sqrt(n)", "D": "k chosen randomly each run"}, "ans": "A", "exp": "Maximal data usage, heavy compute cost."}, {"id": 313, "q": "Underfitting appears when:", "options": {"A": "Both excellent", "B": "Training great, test poor", "C": "Training AND test performance are both poor", "D": "Results unrelated to fitting"}, "ans": "C", "exp": "Model capacity too low for the function."}, {"id": 314, "q": "Overfitting means:", "options": {"A": "Guaranteed perfect generalization", "B": "High errors everywhere uniformly", "C": "Dataset excessively large", "D": "Low training error but high test error"}, "ans": "D", "exp": "Memorizing noise rather than signal."}, {"id": 315, "q": "Bias-variance decomposition splits expected error into:", "options": {"A": "Entropy terms only", "B": "Precision minus recall", "C": "Squared bias + variance + irreducible noise", "D": "Accuracy plus F1"}, "ans": "C", "exp": "Simple models: high bias/low variance; complex: reverse."}, {"id": 316, "q": "Regularization fights overfitting by:", "options": {"A": "Extending epochs indefinitely", "B": "Penalizing complexity during optimization", "C": "Removing loss functions", "D": "Adding parameters unconditionally"}, "ans": "B", "exp": "L1/L2 penalties, dropout, early stopping."}, {"id": 317, "q": "Ridge regression uses penalty:", "options": {"A": "Lambda times sum of absolute weights", "B": "Lambda times sum of squared weights", "C": "None", "D": "Count of nonzero weights"}, "ans": "B", "exp": "Smooth shrinkage; keeps all features."}, {"id": 318, "q": "Lasso regression's L1 penalty effect:", "options": {"A": "Drives selected weights exactly to zero (feature selection)", "B": "Inflates magnitudes", "C": "Touches biases only", "D": "Never zeroes weights"}, "ans": "A", "exp": "Sparse solutions arise from |w| geometry."}, {"id": 319, "q": "Early stopping halts training when:", "options": {"A": "Gradients vanish silently", "B": "Arbitrary epoch cap reached regardless", "C": "Validation metric stops improving", "D": "Training loss hits exact zero"}, "ans": "C", "exp": "Implicit regularizer; standard practice."}, {"id": 320, "q": "Dropout randomly deactivates units to:", "options": {"A": "Discard training samples", "B": "Remove features globally", "C": "Delete layers permanently", "D": "Reduce co-adaptation, approximating an ensemble of subnetworks"}, "ans": "D", "exp": "Srivastava et al. 2014."}, {"id": 321, "q": "Data augmentation enlarges datasets using:", "options": {"A": "Byte-identical duplication", "B": "Deleting difficult examples", "C": "Label-preserving transformations such as flips/crops/noise", "D": "Resolution reduction only"}, "ans": "C", "exp": "Builds invariance and robustness."}, {"id": 322, "q": "Feature engineering means:", "options": {"A": "Flipping labels randomly", "B": "Purchasing GPUs", "C": "Constructing informative inputs from raw data using domain insight", "D": "Ignoring raw data"}, "ans": "C", "exp": "Crucial pre-deep-learning practice, still relevant on tabular data."}, {"id": 323, "q": "Curse of dimensionality describes:", "options": {"A": "CPU oversubscription", "B": "Exploding sample needs and distance concentration as dimensions grow", "C": "Monitor eye strain", "D": "Filename length issues"}, "ans": "B", "exp": "Motivates dimensionality reduction."}, {"id": 324, "q": "PCA identifies orthogonal directions that:", "options": {"A": "Correlate perfectly with labels necessarily", "B": "Maximize projected variance", "C": "Ignore covariance structure", "D": "Minimize variance deliberately"}, "ans": "B", "exp": "Eigenvectors of the covariance matrix."}, {"id": 325, "q": "t-SNE mainly supports:", "options": {"A": "Exact global distance preservation", "B": "Real-time streaming inference", "C": "Supervised classification directly", "D": "Nonlinear 2-D/3-D visualization preserving local neighborhoods"}, "ans": "D", "exp": "Great for exploration; distances between clusters not meaningful."}, {"id": 326, "q": "UMAP differs from t-SNE by:", "options": {"A": "Being strictly linear", "B": "Requiring labels", "C": "Better preserving global structure and faster runtime", "D": "Producing 1-D output only"}, "ans": "C", "exp": "Topological manifold assumption basis."}, {"id": 327, "q": "K-means clustering minimizes:", "options": {"A": "Within-cluster squared distance to centroids", "B": "Number of clusters always fixed at k=10", "C": "Silhouette scores negatively", "D": "Between-cluster similarity maximally"}, "ans": "A", "exp": "Alternating assignment/update steps converge locally."}, {"id": 328, "q": "Choosing k in k-means commonly uses:", "options": {"A": "Alphabetical ordering of clusters", "B": "Random selection forbidden to repeat", "C": "Fixed universal constant 42", "D": "Elbow method on inertia or silhouette analysis"}, "ans": "D", "exp": "Data-driven heuristics for cluster count."}, {"id": 329, "q": "Hierarchical agglomerative clustering builds:", "options": {"A": "Flat partitions only", "B": "Trees requiring labels", "C": "Dendrograms merging closest clusters iteratively", "D": "Graph cycles deliberately"}, "ans": "C", "exp": "Cut dendrogram at desired granularity."}, {"id": 330, "q": "DBSCAN defines clusters as:", "options": {"A": "Dense regions separated by sparse regions; finds arbitrary shapes", "B": "Label-driven partitions", "C": "Equal-sized groups mandatory", "D": "Perfect spheres around centers"}, "ans": "A", "exp": "Parameters epsilon and minPts; flags noise points."}, {"id": 331, "q": "Gaussian Mixture Models assign soft memberships using:", "options": {"A": "Rule chaining", "B": "Hard assignments frozen initially", "C": "Gradient boosting", "D": "EM algorithm alternating responsibilities and parameter updates"}, "ans": "D", "exp": "Probabilistic clustering generalizing k-means."}, {"id": 332, "q": "Decision trees split nodes by maximizing:", "options": {"A": "Node depth arbitrarily", "B": "Feature alphabetical order", "C": "Random thresholds never evaluated", "D": "Information gain / Gini impurity reduction"}, "ans": "D", "exp": "CART, ID3, C4.5 family criteria."}, {"id": 333, "q": "Gini impurity of a node measures:", "options": {"A": "Probability of mislabeling a random sample under label distribution", "B": "Leaf count", "C": "Split threshold value", "D": "Tree height"}, "ans": "A", "exp": "1 - sum p_i^2; zero for pure nodes."}, {"id": 334, "q": "Pruning decision trees helps by:", "options": {"A": "Removing branches that overfit noise", "B": "Increasing leaves monotonically", "C": "Randomizing splits", "D": "Adding depth unconditionally"}, "ans": "A", "exp": "Cost-complexity pruning standard in CART."}, {"id": 335, "q": "Random Forests aggregate predictions from:", "options": {"A": "Linear regressions stacked deeply", "B": "Many trees trained on bootstrap samples with random feature subsets", "C": "Human-labeled prototypes", "D": "One giant tree exclusively"}, "ans": "B", "exp": "Bagging + feature randomness reduce variance."}, {"id": 336, "q": "Bagging stands for:", "options": {"A": "Batch gradient accumulation", "B": "Bootstrap aggregating - resampling training data with replacement", "C": "Bayesian averaging of gradients", "D": "Binning and grouping"}, "ans": "B", "exp": "Breiman's variance-reduction technique."}, {"id": 337, "q": "Boosting sequentially trains learners that:", "options": {"A": "Focus on examples previous models got wrong", "B": "Train fully independent parallel trees only", "C": "Ignore errors entirely", "D": "Require no weights"}, "ans": "A", "exp": "AdaBoost reweights samples; gradient boosting fits residuals."}, {"id": 338, "q": "XGBoost/LightGBM improve gradient boosting via:", "options": {"A": "Removing tree structures", "B": "Regularized objectives, histogram splits, optimized system design", "C": "Disabling parallelism", "D": "Pure linear models underneath"}, "ans": "B", "exp": "Dominant tabular-data performers in competitions."}, {"id": 339, "q": "Support Vector Machines find hyperplanes that:", "options": {"A": "Ignore support vectors ironically", "B": "Minimize training accuracy intentionally", "C": "Require kernel usage mandatorily", "D": "Maximize margin between classes"}, "ans": "D", "exp": "Maximum-margin principle with soft constraints."}, {"id": 340, "q": "Support vectors are:", "options": {"A": "Only class centroids", "B": "Randomly sampled outliers discarded", "C": "All dataset points equally", "D": "Training points lying closest to/beyond defining the decision boundary"}, "ans": "D", "exp": "Solution depends only on these critical instances."}, {"id": 341, "q": "The kernel trick enables:", "options": {"A": "Removal of optimization", "B": "Implicit computation of high-dimensional inner products without explicit mapping", "C": "Faster disk I/O", "D": "Direct visualization of infinite spaces"}, "ans": "B", "exp": "RBF, polynomial kernels popular choices."}, {"id": 342, "q": "Soft-margin SVM introduces slack variables allowing:", "options": {"A": "Some margin violations to handle nonseparable data", "B": "Infinite margins", "C": "Removal of regularization", "D": "Zero training errors forced"}, "ans": "A", "exp": "C parameter trades violations vs margin width."}, {"id": 343, "q": "K-Nearest Neighbors classify a point by:", "options": {"A": "Global linear boundary fit first", "B": "Ignoring distances completely", "C": "Training neural nets implicitly", "D": "Majority vote among its k closest training samples"}, "ans": "D", "exp": "Lazy learner; no explicit training phase."}, {"id": 344, "q": "Choosing very large k in kNN causes:", "options": {"A": "Extreme sensitivity to noise", "B": "Zero bias guaranteed", "C": "Oversmoothing toward majority class (underfitting)", "D": "Perfect boundary sharpness"}, "ans": "C", "exp": "Small k yields high variance instead."}, {"id": 345, "q": "Naive Bayes assumes conditional independence of:", "options": {"A": "Classes given features", "B": "All samples being identical", "C": "Features given the class label", "D": "Labels across time"}, "ans": "C", "exp": "Simplifies likelihood estimation drastically."}, {"id": 346, "q": "Logistic regression outputs probabilities via:", "options": {"A": "Hard step functions only", "B": "Sigmoid applied to linear combination of features", "C": "Softmax over trees", "D": "Fourier transforms"}, "ans": "B", "exp": "Despite name, a discriminative classifier."}, {"id": 347, "q": "Maximum likelihood estimation picks parameters that:", "options": {"A": "Maximize probability of observed training data", "B": "Minimize dataset size", "C": "Randomize coefficients", "D": "Fix priors permanently"}, "ans": "A", "exp": "Cross-entropy loss equals negative log-likelihood."}, {"id": 348, "q": "MAP estimation augments likelihood with:", "options": {"A": "Learning rate schedules", "B": "Test-set statistics", "C": "GPU temperature readings", "D": "Prior distribution over parameters"}, "ans": "D", "exp": "Equivalent to L2 regularization under Gaussian prior."}, {"id": 349, "q": "Confusion matrix entries include:", "options": {"A": "TP, TN, FP, FN counts", "B": "Only accuracy percentage", "C": "Loss values solely", "D": "Learning curves"}, "ans": "A", "exp": "Basis for precision, recall, specificity metrics."}, {"id": 350, "q": "Precision is defined as:", "options": {"A": "TP / (TP + FP)", "B": "TP / (TP + FN)", "C": "TN / (TN + FP)", "D": "(TP+TN)/total"}, "ans": "A", "exp": "Of predicted positives, fraction truly positive; recall is answer B. Part 7: ML Evaluation & Metrics (Q351-375)"}, {"id": 351, "q": "Recall (sensitivity) is defined as:", "options": {"A": "TN / (TN + FP)", "B": "(TP+TN)/N", "C": "TP / (TP + FN)", "D": "TP / (TP + FP)"}, "ans": "C", "exp": "Fraction of actual positives correctly recovered."}, {"id": 352, "q": "F1-score is the:", "options": {"A": "Product of TP and TN", "B": "Harmonic mean of precision and recall", "C": "Arithmetic mean of accuracy and precision", "D": "Sum of FP and FN"}, "ans": "B", "exp": "Balances precision/recall; punishes imbalance between them."}, {"id": 353, "q": "Accuracy misleads most when:", "options": {"A": "Classes perfectly balanced", "B": "Dataset tiny but balanced", "C": "Classes are highly imbalanced", "D": "Labels binary only"}, "ans": "C", "exp": "With 99% negatives, an all-negative model scores 99%."}, {"id": 354, "q": "ROC curves plot:", "options": {"A": "Accuracy vs dataset size", "B": "Precision vs recall at one threshold", "C": "Loss vs epochs", "D": "True positive rate vs false positive rate across thresholds"}, "ans": "D", "exp": "AUC summarizes the area beneath."}, {"id": 355, "q": "AUC of a random classifier equals:", "options": {"A": "0.5", "B": "0.0", "C": "Dataset-size dependent", "D": "1.0"}, "ans": "A", "exp": "Perfect classifier reaches 1.0."}, {"id": 356, "q": "PR curves beat ROC when:", "options": {"A": "The positive class is rare", "B": "Task is regression", "C": "Classes perfectly balanced", "D": "Clustering evaluation needed"}, "ans": "A", "exp": "Reflects minority-class detection quality better."}, {"id": 357, "q": "MSE penalizes errors:", "options": {"A": "Logarithmically only", "B": "Linearly preserving sign", "C": "Quadratically, emphasizing large mistakes", "D": "Never for outliers"}, "ans": "C", "exp": "Outlier-sensitive; MAE is more robust."}, {"id": 358, "q": "Cross-entropy suits classification because it punishes:", "options": {"A": "Nothing probabilistic", "B": "Confident wrong predictions heavily", "C": "Correct predictions strongly", "D": "Borderline cases exclusively"}, "ans": "B", "exp": "Negative log-likelihood of true class."}, {"id": 359, "q": "Hyperparameter tuning methods include:", "options": {"A": "Manual code deletion", "B": "Freezing all parameters", "C": "Grid search, random search, Bayesian optimization", "D": "Reusing test set repeatedly"}, "ans": "C", "exp": "Search over training configuration space."}, {"id": 360, "q": "Random search often beats grid search because:", "options": {"A": "It needs no budget", "B": "Grid search is banned academically", "C": "Diverse random combos cover influential parameters efficiently", "D": "It never samples extremes"}, "ans": "C", "exp": "Bergstra & Bengio's classic argument."}, {"id": 361, "q": "Bayesian optimization uses:", "options": {"A": "Exhaustive enumeration mandated always", "B": "Random label generation", "C": "Direct gradient descent on hyperparameters", "D": "Surrogate models (e.g., Gaussian processes) plus acquisition functions"}, "ans": "D", "exp": "Efficient when evaluations are expensive."}, {"id": 362, "q": "Data leakage occurs when:", "options": {"A": "Validation used correctly", "B": "Test information influences training (e.g., scaling before splitting)", "C": "Data stored encrypted properly", "D": "Datasets are too clean"}, "ans": "B", "exp": "Inflates performance estimates falsely."}, {"id": 363, "q": "Class imbalance remedies include:", "options": {"A": "Ignoring minority class entirely", "B": "Resampling, class weights, SMOTE synthesis", "C": "Deleting majority class fully", "D": "Reporting accuracy alone"}, "ans": "B", "exp": "SMOTE interpolates new minority examples."}, {"id": 364, "q": "Stacking trains a meta-model on:", "options": {"A": "Raw inputs rather than outputs", "B": "Random votes without structure", "C": "One best learner only, discarding others", "D": "Base learners' out-of-fold predictions"}, "ans": "D", "exp": "Learns optimal combination of diverse models."}, {"id": 365, "q": "Bagging primarily reduces:", "options": {"A": "Variance", "B": "Feature count", "C": "Bias exclusively", "D": "Data volume"}, "ans": "A", "exp": "Boosting instead mainly attacks bias."}, {"id": 366, "q": "AdaBoost raises weights of:", "options": {"A": "Features rather than samples", "B": "All samples equally forever", "C": "Misclassified samples so subsequent learners focus on them", "D": "Correctly classified samples only"}, "ans": "C", "exp": "Sequential reweighting mechanism."}, {"id": 367, "q": "Gradient boosting fits each tree to:", "options": {"A": "Original raw labels identically every round", "B": "Random feature permutations", "C": "Unchanged bootstrap copies", "D": "Negative loss gradient (residuals) of the current ensemble"}, "ans": "D", "exp": "Functional gradient descent view (Friedman)."}, {"id": 368, "q": "Shrinkage learning rate in boosting controls:", "options": {"A": "Each tree's contribution magnitude", "B": "Leaf color metaphors", "C": "Row sampling fraction strictly", "D": "Feature sampling count"}, "ans": "A", "exp": "Smaller rates need more trees but generalize better."}, {"id": 369, "q": "Permutation importance measures:", "options": {"A": "Alphabetical column ranks", "B": "Performance drop after shuffling one feature's values", "C": "Filename occurrence counts", "D": "Raw column variance alone"}, "ans": "B", "exp": "Model-agnostic importance technique."}, {"id": 370, "q": "SHAP explains predictions using:", "options": {"A": "Logit alphabetical sorting", "B": "Arbitrary feature removal", "C": "Shapley values from cooperative game theory axioms", "D": "Spatial gradients only"}, "ans": "C", "exp": "Lundberg & Lee's unified attribution framework."}, {"id": 371, "q": "LIME fits:", "options": {"A": "Silent outlier deletion routines", "B": "Global linear replacements only", "C": "Interpretable local surrogates around perturbed samples", "D": "Full pipeline reruns"}, "ans": "C", "exp": "Local Interpretable Model-agnostic Explanations."}, {"id": 372, "q": "Domain adaptation targets:", "options": {"A": "Guaranteed identical distributions", "B": "Absence of label noise assumptions", "C": "GPU memory ceilings", "D": "Distribution mismatch between train and deployment environments"}, "ans": "D", "exp": "Covariate shift / concept drift mitigation field."}, {"id": 373, "q": "Concept drift means:", "options": {"A": "Storage physically degrades", "B": "The input-output relationship changes over time", "C": "Pixels blur gradually", "D": "Hyperparameters decay numerically"}, "ans": "B", "exp": "Demands monitoring and periodic retraining."}, {"id": 374, "q": "Active learning cuts labeling cost by:", "options": {"A": "Querying labels for the most informative unlabeled samples", "B": "Doubling budgets unconditionally", "C": "Randomly labeling everything upfront", "D": "Discarding unlabeled pools entirely"}, "ans": "A", "exp": "Uncertainty sampling is the common strategy."}, {"id": 375, "q": "Multi-task learning improves generalization through:", "options": {"A": "Deliberate removal of shared layers", "B": "Shared representations across related tasks trained jointly", "C": "Complete task isolation", "D": "Strictly sequential unrelated training"}, "ans": "B", "exp": "Auxiliary tasks act as regularizers. Part 8: ML Advanced Topics (Q376-400)"}, {"id": 376, "q": "Online learning updates models:", "options": {"A": "Only after complete dataset assembly", "B": "Never after deploy dings raw unfiltered", "C": "Complete world snapshots frozen", "D": "Random wishes discarded instantly"}, "ans": "A", "exp": "Deliberation balances commitment vs reconsideration."}, {"id": 605, "q": "The FIPA standards body defined:", "options": {"A": "Agent communication languages/platform interoperability specs", "B": "Web page styling rules", "C": "Database schema conventions only", "D": "GPU manufacturing processes"}, "ans": "A", "exp": "ACL message structure with performatives."}, {"id": 606, "q": "KQML and FIPA-ACL are:", "options": {"A": "Audio streaming protocols", "B": "File system formats", "C": "Image compression codecs", "D": "Agent communication languages encoding speech acts"}, "ans": "D", "exp": "Inform/request/propose performative categories."}, {"id": 607, "q": "Contract Net Protocol coordinates agents through:", "options": {"A": "Sealed court proceedings literally", "B": "Task announcement, bidding, award cycles", "C": "Single broadcast without responses ever", "D": "Random task assignments ignoring capability"}, "ans": "B", "exp": "Classic market-inspired multi-agent coordination (Smith 1980)."}, {"id": 608, "q": "Auction mechanisms in MAS include:", "options": {"A": "Only barter trades possible ever", "B": "English, Dutch, sealed-bid first/second price variants", "C": "Physical shouting matches mandated", "D": "No allocation mechanisms whatsoever"}, "ans": "B", "exp": "Vickrey auction = second-price sealed bid truthful."}, {"id": 609, "q": "Nash equilibrium describes strategy profiles where:", "options": {"A": "No player gains by unilateral deviation", "B": "Everyone maximizes group total necessarily", "C": "Players alternate turns randomly forever", "D": "One player always wins completely"}, "ans": "A", "exp": "Foundational game theory solution concept (Nash 1950)."}, {"id": 610, "q": "Pareto efficiency means no reallocation can:", "options": {"A": "Reduce total utility deliberately", "B": "Improve someone without hurting another", "C": "Increase any individual outcome ever again", "D": "Change strategies at all legally"}, "ans": "B", "exp": "Distinct from fairness/equality concepts."}, {"id": 611, "q": "Mechanism design is described as:", "options": {"A": "Mechanical parts CAD design only", "B": "Compiler backend construction solely", "C": "Inverse game theory engineering rules toward desired outcomes", "D": "UI prototyping discipline exclusively"}, "ans": "C", "exp": "Revelation principle; VCG mechanism example."}, {"id": 612, "q": "The VCG mechanism achieves truthfulness by charging:", "options": {"A": "Nothing at all ever", "B": "Externality imposed on others by a bidder's presence", "C": "Flat fees identical for everyone always", "D": "Maximum possible prices greedily"}, "ans": "B", "exp": "Strategy-proof allocation for public goods/ad auctions."}, {"id": 613, "q": "Coalition formation studies how agents form teams to:", "options": {"A": "Eliminate negotiation entirely by fiat", "B": "Improve collective payoff via cooperation stability analysis", "C": "Force equal splits regardless of contribution mandatorily", "D": "Guarantee isolation of all agents permanently"}, "ans": "B", "exp": "Shapley value divides surplus fairly axiomatically."}, {"id": 614, "q": "Shapley value allocates coalition gains based on:", "options": {"A": "Equal division regardless of input always", "B": "Alphabetical member ordering only", "C": "Seniority years in system exclusively", "D": "Average marginal contribution across all orderings"}, "ans": "D", "exp": "Unique value satisfying symmetry/dummy/additivity axioms."}, {"id": 615, "q": "Social choice theory (Arrow) proved impossibility of:", "options": {"A": "Any election ever conducted fairly in practice absolutely", "B": "Condorcet winners existing mathematically ever", "C": "Dictatorship avoidance under plurality specifically only", "D": "Perfect rank-order voting systems satisfying fair axioms simultaneously"}, "ans": "D", "exp": "Arrow's theorem (1951); Sen extended to liberties."}, {"id": 616, "q": "Preference aggregation alternatives include:", "options": {"A": "Coin flips only legitimate option", "B": "First-come-first-served universally fixed", "C": "Borda count, approval voting, ranked choice methods", "D": "Random dictatorship selection banned formally"}, "ans": "C", "exp": "Each has strategic manipulation vulnerabilities."}, {"id": 617, "q": "Multi-agent pathfinding plans collision-free routes for:", "options": {"A": "Multiple agents sharing environments simultaneously", "B": "Virtual particles without constraints", "C": "Static obstacles only never moving entities", "D": "Exactly one robot alone always"}, "ans": "A", "exp": "Warehouse/logistics scheduling application core."}, {"id": 618, "q": "Distributed constraint optimization assigns variables across agents minimizing:", "options": {"A": "Nothing measurable concretely", "B": "Global cost with only local communication available", "C": "Communication volume as sole objective always", "D": "Local costs individually regardless of global effect"}, "ans": "B", "exp": "DPOP/max-sum algorithms address this setting."}, {"id": 619, "q": "Argumentation frameworks evaluate claims via:", "options": {"A": "Random verdict generation seeds fixed", "B": "Chronological posting order exclusively", "C": "Attack/support relations among arguments determining acceptability", "D": "Majority applause meters metaphorically"}, "ans": "C", "exp": "Dung's abstract argumentation semantics foundational."}, {"id": 620, "q": "Norm-aware agents reason about:", "options": {"A": "Compiler warnings severity levels", "B": "Only physical laws constraining motion", "C": "Nothing beyond raw rewards ever", "D": "Obligations/prohibitions regulating behavior in societies"}, "ans": "D", "exp": "Electronic institutions formalize such norms."}, {"id": 621, "q": "Trust and reputation models estimate:", "options": {"A": "Reliability of interaction partners from history/testimony", "B": "Hardware warranty status only", "C": "Battery charge percentages solely", "D": "Network bandwidth caps strictly"}, "ans": "A", "exp": "Beta reputation, EigenTrust representative systems."}, {"id": 622, "q": "Agent-based modeling simulates complex systems via:", "options": {"A": "Autonomous interacting agents producing emergent macro patterns", "B": "Closed-form equations solved analytically always sufficient", "C": "Single averaged differential equation replacing detail entirely", "D": "Static snapshots without dynamics ever"}, "ans": "A", "exp": "Schelling segregation/epidemic models classics."}, {"id": 623, "q": "Software agents differ from objects primarily through:", "options": {"A": "Their own control threads, autonomy and flexible interaction protocols", "B": "Inability to communicate whatsoever", "C": "Requirement of GUIs attached mandatorily", "D": "Possessing methods and fields identically like objects do"}, "ans": "A", "exp": "\"Objects do it for free; agents do it because they want to.\""}, {"id": 624, "q": "Reinforcement-learning-based negotiation agents learn offers by:", "options": {"A": "Copying human transcripts verbatim only", "B": "Rejecting all offers systematically forever", "C": "Accepting everything instantly regardless", "D": "Interacting with opponent models optimizing expected utility"}, "ans": "D", "exp": "ANAC competitions advanced automated negotiation."}, {"id": 625, "q": "Digital twins pair physical assets with:", "options": {"A": "Static photos taken once at install", "B": "Paper printouts archived annually", "C": "Live simulated replicas enabling prediction/optimization loops", "D": "Nothing connected after deployment ever"}, "ans": "C", "exp": "Industry 4.0 integration of AI + IoT. Part 18: Reinforcement Learning (Q626–675)"}, {"id": 626, "q": "Reinforcement learning is best described as learning from:", "options": {"A": "Clustering unlabelled data into groups", "B": "Hand-coded rules written by domain experts", "C": "Labelled input–output pairs supplied in advance", "D": "Interaction with an environment guided by reward signals"}, "ans": "D", "exp": "The agent learns a policy by trial and error, maximising cumulative reward."}, {"id": 627, "q": "The formal framework underlying most RL problems is the:", "options": {"A": "Markov Decision Process (MDP)", "B": "Bayesian Network", "C": "Context-Free Grammar", "D": "Finite State Machine"}, "ans": "A", "exp": "An MDP is the tuple (S, A, P, R, γ)."}, {"id": 628, "q": "The Markov property states that the next state depends on:", "options": {"A": "Only the reward received so far", "B": "The entire history of states and actions", "C": "Only the current state and action", "D": "The discount factor alone"}, "ans": "C", "exp": "\"The future is independent of the past given the present.\""}, {"id": 629, "q": "In an MDP, γ (gamma) is the:", "options": {"A": "Discount factor for future rewards", "B": "Learning rate", "C": "Transition probability", "D": "Exploration probability"}, "ans": "A", "exp": "γ ∈ [0,1] weights how much future rewards count relative to immediate ones."}, {"id": 630, "q": "Setting γ = 0 produces an agent that is:", "options": {"A": "Myopic, caring only about immediate reward", "B": "Guaranteed to find the optimal policy", "C": "Unable to learn at all", "D": "Completely far-sighted"}, "ans": "A", "exp": "Only the next reward contributes to the return."}, {"id": 631, "q": "The return G_t in RL is:", "options": {"A": "The number of episodes completed", "B": "The immediate reward only", "C": "The discounted sum of future rewards", "D": "The average state value"}, "ans": "C", "exp": "G_t = R_{t+1} + γR_{t+2} + γ²R_{t+3} + …"}, {"id": 632, "q": "A policy π(a|s) specifies:", "options": {"A": "The terminal condition of an episode", "B": "The probability of taking action a in state s", "C": "The reward for state s", "D": "The transition dynamics of the environment"}, "ans": "B", "exp": "A policy is the agent's behaviour function."}, {"id": 633, "q": "The state-value function V^π(s) gives:", "options": {"A": "The best action available in s", "B": "The immediate reward in state s", "C": "The probability of reaching s", "D": "The expected return starting from s and following π"}, "ans": "D", "exp": "V^π(s) = E_π[G_t | S_t = s]."}, {"id": 634, "q": "The action-value function Q^π(s,a) differs from V^π(s) because it:", "options": {"A": "Cannot be estimated from samples", "B": "Conditions on taking a specific action first", "C": "Only applies to deterministic policies", "D": "Ignores the discount factor"}, "ans": "B", "exp": "Q evaluates state–action pairs, which makes action selection direct."}, {"id": 635, "q": "The Bellman equation expresses value as:", "options": {"A": "The entropy of the policy", "B": "The sum of all rewards ever received", "C": "Immediate reward plus discounted value of the successor state", "D": "The variance of the reward distribution"}, "ans": "C", "exp": "This recursive decomposition underpins dynamic programming and TD learning."}, {"id": 636, "q": "Dynamic programming methods such as value iteration require:", "options": {"A": "No knowledge of the environment", "B": "A known model of transitions and rewards", "C": "A deep neural network", "D": "Continuous action spaces"}, "ans": "B", "exp": "DP is model-based; it needs P and R."}, {"id": 637, "q": "Policy iteration alternates between:", "options": {"A": "Training and testing", "B": "Encoding and decoding", "C": "Exploration and exploitation", "D": "Policy evaluation and policy improvement"}, "ans": "D", "exp": "Evaluate V^π, then act greedily with respect to it, and repeat."}, {"id": 638, "q": "Monte Carlo RL methods update value estimates:", "options": {"A": "After every single time step", "B": "Only at the end of a complete episode", "C": "Using the known transition model", "D": "Before the episode begins"}, "ans": "B", "exp": "MC uses the actual observed return, so episodes must terminate."}, {"id": 639, "q": "Temporal-Difference (TD) learning is notable because it:", "options": {"A": "Cannot handle continuing tasks", "B": "Only works for deterministic environments", "C": "Bootstraps — updating estimates from other estimates before the episode ends", "D": "Requires a full model of the environment"}, "ans": "C", "exp": "TD combines Monte Carlo sampling with DP-style bootstrapping."}, {"id": 640, "q": "The TD error δ_t is defined as:", "options": {"A": "Q(s,a) − π(a|s)", "B": "γ − α", "C": "V(S_t) − R_{t+1}", "D": "R_{t+1} + γV(S_{t+1}) − V(S_t)"}, "ans": "D", "exp": "It measures the surprise between predicted and observed value."}, {"id": 641, "q": "Q-learning is classed as an off-policy algorithm because it:", "options": {"A": "Learns the value of the greedy policy while behaving differently", "B": "Requires the policy to be fixed forever", "C": "Never explores the environment", "D": "Only works offline on stored data"}, "ans": "A", "exp": "The max operator targets the optimal policy regardless of behaviour."}, {"id": 642, "q": "The Q-learning update rule uses which target?", "options": {"A": "R + γ max_a' Q(s',a')", "B": "The average of all Q values", "C": "R + γ Q(s',a') for the action actually taken", "D": "The immediate reward only"}, "ans": "A", "exp": "Bootstrapping from the maximum successor action value."}, {"id": 643, "q": "SARSA differs from Q-learning because it:", "options": {"A": "Does not use a learning rate", "B": "Is on-policy, using the action actually taken next", "C": "Cannot converge", "D": "Requires a model of the environment"}, "ans": "B", "exp": "The name comes from the tuple (S, A, R, S', A')."}, {"id": 644, "q": "On the cliff-walking problem, SARSA typically learns:", "options": {"A": "The riskiest path along the cliff edge", "B": "No path at all", "C": "A safer path, because it accounts for exploratory mistakes", "D": "An identical policy to Q-learning always"}, "ans": "C", "exp": "On-policy learning internalises the cost of exploration."}, {"id": 645, "q": "The exploration–exploitation dilemma refers to the trade-off between:", "options": {"A": "Speed and memory usage", "B": "Bias and variance in supervised learning", "C": "Training and validation data", "D": "Trying new actions and using known good actions"}, "ans": "D", "exp": "Too little exploration risks a poor local optimum; too much wastes reward."}, {"id": 646, "q": "In ε-greedy action selection, the agent:", "options": {"A": "Picks actions in a fixed rotation", "B": "Picks a random action with probability ε, else the greedy one", "C": "Always picks the highest-value action", "D": "Never repeats an action"}, "ans": "B", "exp": "A simple and widely used exploration scheme."}, {"id": 647, "q": "Softmax (Boltzmann) exploration selects actions:", "options": {"A": "Only after training ends", "B": "Uniformly at random", "C": "With probability proportional to exponentiated value estimates", "D": "Based on state visitation counts alone"}, "ans": "C", "exp": "A temperature parameter controls the greediness of the distribution."}, {"id": 648, "q": "Upper Confidence Bound (UCB) methods favour actions that are:", "options": {"A": "Frequently tried and well understood", "B": "High-valued or highly uncertain — \"optimism in the face of uncertainty\"", "C": "Chosen by a human supervisor", "D": "Always the lowest valued"}, "ans": "B", "exp": "The confidence bonus decays as an action is sampled more often."}, {"id": 649, "q": "The multi-armed bandit problem is an RL setting with:", "options": {"A": "A single state, so no credit assignment across time", "B": "No rewards at all", "C": "Many states and long horizons", "D": "Continuous state transitions"}, "ans": "A", "exp": "It isolates the exploration–exploitation problem."}, {"id": 650, "q": "The credit assignment problem in RL concerns:", "options": {"A": "Allocating memory to the replay buffer", "B": "Assigning weights to input features", "C": "Paying human annotators fairly", "D": "Deciding which earlier actions were responsible for a later reward"}, "ans": "D", "exp": "It is especially hard when rewards are delayed or sparse."}, {"id": 651, "q": "Eligibility traces in TD(λ) provide:", "options": {"A": "A bridge between one-step TD and Monte Carlo methods", "B": "A replacement for the reward function", "C": "A way to remove the discount factor", "D": "A method for compressing the state space"}, "ans": "A", "exp": "λ controls how far credit propagates backwards."}, {"id": 652, "q": "TD(λ) with λ = 1 behaves approximately like:", "options": {"A": "Monte Carlo learning", "B": "One-step TD learning", "C": "Random search", "D": "Value iteration"}, "ans": "A", "exp": "Credit is assigned across the whole episode."}, {"id": 653, "q": "Function approximation is introduced in RL primarily to handle:", "options": {"A": "Deterministic rewards", "B": "Small, finite state spaces", "C": "Discrete action spaces only", "D": "Large or continuous state spaces where tabular methods fail"}, "ans": "D", "exp": "A table cannot store a value for every pixel configuration."}, {"id": 654, "q": "Deep Q-Networks (DQN) achieved human-level Atari play by combining Q-learning with:", "options": {"A": "Supervised imitation of human players", "B": "Handcrafted game-specific features", "C": "Convolutional neural networks, experience replay and a target network", "D": "Genetic algorithms and simulated annealing"}, "ans": "C", "exp": "Mnih et al., Nature, 2015."}, {"id": 655, "q": "Experience replay improves DQN training mainly by:", "options": {"A": "Reducing the number of network parameters", "B": "Breaking correlations between consecutive samples and reusing data", "C": "Increasing the discount factor", "D": "Eliminating the need for exploration"}, "ans": "B", "exp": "Random minibatches from the buffer stabilise learning."}, {"id": 656, "q": "The target network in DQN is used to:", "options": {"A": "Generate the exploration policy", "B": "Compress the replay buffer", "C": "Select the learning rate automatically", "D": "Provide slowly-updated, stable bootstrapping targets"}, "ans": "D", "exp": "Without it, the moving target causes divergence."}, {"id": 657, "q": "Double DQN was proposed to address:", "options": {"A": "Slow convolution operations", "B": "Lack of exploration", "C": "Overestimation bias in the max operator", "D": "The vanishing gradient problem"}, "ans": "C", "exp": "Decoupling action selection from evaluation reduces optimistic bias."}, {"id": 658, "q": "Prioritised experience replay samples transitions:", "options": {"A": "Only from the most recent episode", "B": "In proportion to their TD-error magnitude", "C": "Uniformly at random", "D": "In strict chronological order"}, "ans": "B", "exp": "Surprising transitions carry more learning signal."}, {"id": 659, "q": "The duelling DQN architecture separates the estimate into:", "options": {"A": "Encoder and decoder streams", "B": "Policy and reward streams", "C": "State value and action advantage streams", "D": "Actor and critic networks"}, "ans": "C", "exp": "Q(s,a) = V(s) + A(s,a), which helps when actions matter little."}, {"id": 660, "q": "Policy gradient methods differ from value-based methods by:", "options": {"A": "Requiring a discrete action space", "B": "Learning the policy parameters directly", "C": "Never using a neural network", "D": "Avoiding the discount factor"}, "ans": "B", "exp": "They optimise expected return with respect to policy parameters."}, {"id": 661, "q": "A key advantage of policy gradient methods is their ability to:", "options": {"A": "Avoid all variance in updates", "B": "Guarantee a globally optimal policy", "C": "Learn without any reward signal", "D": "Handle continuous action spaces and stochastic policies naturally"}, "ans": "D", "exp": "Value-based methods struggle to take a max over continuous actions."}, {"id": 662, "q": "The REINFORCE algorithm is a:", "options": {"A": "Monte Carlo policy gradient method", "B": "Planning algorithm", "C": "Model-based dynamic programming method", "D": "Clustering algorithm"}, "ans": "A", "exp": "It scales the log-probability gradient by the observed return."}, {"id": 663, "q": "Subtracting a baseline in REINFORCE serves to:", "options": {"A": "Speed up matrix multiplication", "B": "Remove the need for a policy", "C": "Reduce variance without introducing bias", "D": "Increase the bias of the estimator"}, "ans": "C", "exp": "A state-value baseline is the common choice."}, {"id": 664, "q": "In actor–critic methods, the critic:", "options": {"A": "Estimates a value function used to evaluate the actor's actions", "B": "Selects the actions to execute", "C": "Stores the replay buffer", "D": "Defines the reward function"}, "ans": "A", "exp": "The actor updates the policy; the critic supplies a lower-variance signal."}, {"id": 665, "q": "A3C (Asynchronous Advantage Actor-Critic) gains stability from:", "options": {"A": "Multiple parallel workers exploring different parts of the environment", "B": "Removing the critic entirely", "C": "Using only supervised targets", "D": "A single very deep network"}, "ans": "A", "exp": "Parallelism decorrelates the training data."}, {"id": 666, "q": "Trust Region Policy Optimisation (TRPO) constrains updates using:", "options": {"A": "A KL-divergence limit between old and new policies", "B": "A fixed learning rate schedule", "C": "L1 weight regularisation", "D": "Dropout"}, "ans": "A", "exp": "This prevents destructively large policy changes."}, {"id": 667, "q": "Proximal Policy Optimisation (PPO) is popular because it:", "options": {"A": "Guarantees convergence to the global optimum", "B": "Requires no gradient computation", "C": "Approximates TRPO's constraint with a simple clipped objective", "D": "Only works in discrete environments"}, "ans": "C", "exp": "Simplicity plus strong empirical performance made it a default choice."}, {"id": 668, "q": "DDPG (Deep Deterministic Policy Gradient) is designed for:", "options": {"A": "Text generation tasks", "B": "Continuous control with a deterministic actor and off-policy learning", "C": "Unsupervised clustering", "D": "Discrete action spaces only"}, "ans": "B", "exp": "It extends DQN ideas to continuous actions."}, {"id": 669, "q": "Soft Actor-Critic (SAC) adds which term to the objective?", "options": {"A": "An L2 penalty on rewards", "B": "A hard KL constraint", "C": "A supervised cross-entropy loss", "D": "A policy entropy bonus encouraging exploration"}, "ans": "D", "exp": "Maximum-entropy RL yields robust, exploratory policies."}, {"id": 670, "q": "Reward shaping refers to:", "options": {"A": "Reducing the size of the action space", "B": "Clipping gradients during backpropagation", "C": "Normalising input pixels", "D": "Modifying the reward function to guide learning toward the goal"}, "ans": "D", "exp": "Potential-based shaping preserves the optimal policy."}, {"id": 671, "q": "Reward hacking (specification gaming) occurs when an agent:", "options": {"A": "Refuses to explore", "B": "Maximises the stated reward in a way that violates the designer's intent", "C": "Fails to receive any reward", "D": "Overfits the validation set"}, "ans": "B", "exp": "A classic case is a boat-racing agent looping for points instead of finishing."}, {"id": 672, "q": "Inverse reinforcement learning attempts to:", "options": {"A": "Reverse the direction of the neural network", "B": "Minimise rather than maximise reward", "C": "Remove states from the MDP", "D": "Infer the reward function from observed expert behaviour"}, "ans": "D", "exp": "Useful when rewards are hard to specify but demonstrations exist."}, {"id": 673, "q": "A Partially Observable MDP (POMDP) is needed when the agent:", "options": {"A": "Has full knowledge of the true state", "B": "Has no actions available", "C": "Receives only noisy or incomplete observations of the state", "D": "Receives deterministic rewards"}, "ans": "C", "exp": "The agent maintains a belief distribution over states."}, {"id": 674, "q": "AlphaGo's strength came from combining deep networks with:", "options": {"A": "A handcrafted rule base from professional players only", "B": "Monte Carlo Tree Search and self-play reinforcement learning", "C": "Exhaustive brute-force enumeration of all board positions", "D": "Linear regression on game outcomes"}, "ans": "B", "exp": "AlphaGo Zero later removed human game data entirely."}, {"id": 675, "q": "RLHF (Reinforcement Learning from Human Feedback), used to align large language models, works by:", "options": {"A": "Using only supervised next-token prediction", "B": "Having humans hand-write every model response", "C": "Training a reward model on human preference comparisons, then optimising the policy against it", "D": "Removing the reward signal entirely"}, "ans": "C", "exp": "PPO against a learned preference model is the standard recipe. Part 19: Optimisation, Genetic Algorithms & Swarm Intelligence (Q676–725)"}, {"id": 676, "q": "Genetic algorithms are inspired by:", "options": {"A": "Ant foraging behaviour", "B": "The structure of the human brain", "C": "Thermodynamic cooling of metals", "D": "Natural selection and biological evolution"}, "ans": "D", "exp": "Introduced by John Holland in the 1970s."}, {"id": 677, "q": "In a genetic algorithm, a chromosome represents:", "options": {"A": "A candidate solution to the problem", "B": "The termination criterion", "C": "The mutation rate", "D": "The fitness function"}, "ans": "A", "exp": "Traditionally encoded as a bit string, though real-valued encodings are common."}, {"id": 678, "q": "The fitness function in a GA is used to:", "options": {"A": "Terminate the algorithm immediately", "B": "Randomly initialise the population", "C": "Measure how good each candidate solution is", "D": "Decide the chromosome length"}, "ans": "C", "exp": "It drives selection pressure toward better solutions."}, {"id": 679, "q": "Roulette-wheel selection assigns each individual a reproduction chance:", "options": {"A": "Equal for all individuals", "B": "Proportional to its fitness", "C": "Based on chromosome length", "D": "Inversely proportional to its fitness"}, "ans": "B", "exp": "Also called fitness-proportionate selection."}, {"id": 680, "q": "Tournament selection works by:", "options": {"A": "Ranking the entire population every generation", "B": "Selecting purely at random", "C": "Selecting only the single fittest individual", "D": "Choosing the best from a small random subset of the population"}, "ans": "D", "exp": "Tournament size controls the selection pressure."}, {"id": 681, "q": "Crossover (recombination) in a GA:", "options": {"A": "Combines genetic material from two parents to create offspring", "B": "Evaluates the fitness function", "C": "Randomly flips individual genes", "D": "Deletes the weakest individual"}, "ans": "A", "exp": "Single-point, two-point and uniform crossover are common variants."}, {"id": 682, "q": "Mutation in a GA primarily serves to:", "options": {"A": "Guarantee convergence in one generation", "B": "Replace the fitness function", "C": "Increase the population size", "D": "Maintain genetic diversity and escape local optima"}, "ans": "D", "exp": "Typically applied with a low probability."}, {"id": 683, "q": "Elitism in a genetic algorithm means:", "options": {"A": "Discarding the fittest individuals each generation", "B": "Carrying the best individuals unchanged into the next generation", "C": "Restricting the population to one individual", "D": "Using only mutation and no crossover"}, "ans": "B", "exp": "It guarantees the best-so-far solution is never lost."}, {"id": 684, "q": "Premature convergence in a GA refers to:", "options": {"A": "Termination before the population is initialised", "B": "Excessive mutation rates", "C": "The population losing diversity and settling on a suboptimal solution", "D": "The fitness function returning negative values"}, "ans": "C", "exp": "Often caused by excessive selection pressure."}, {"id": 685, "q": "A high mutation rate in a GA tends to make the search behave like:", "options": {"A": "Random search", "B": "Breadth-first search", "C": "Exhaustive enumeration", "D": "Deterministic hill climbing"}, "ans": "A", "exp": "Too much mutation destroys accumulated good structure."}, {"id": 686, "q": "The schema theorem (Holland) argues that GAs propagate:", "options": {"A": "Long, high-order schemata exclusively", "B": "Randomly chosen substrings", "C": "Only the single best chromosome", "D": "Short, low-order, above-average-fitness building blocks"}, "ans": "D", "exp": "The \"building block hypothesis\" of GA performance."}, {"id": 687, "q": "Hill climbing is a local search algorithm that:", "options": {"A": "Explores the entire search space systematically", "B": "Always finds the global optimum", "C": "Moves to the best neighbouring state and can get stuck at local optima", "D": "Requires a population of solutions"}, "ans": "C", "exp": "It is greedy and has no memory of previous states."}, {"id": 688, "q": "A plateau in a hill-climbing search landscape is:", "options": {"A": "A region where neighbouring states have equal value", "B": "The single global maximum", "C": "The starting state", "D": "An impossible configuration"}, "ans": "A", "exp": "The search has no gradient to follow and may wander."}, {"id": 689, "q": "A ridge causes difficulty for hill climbing because:", "options": {"A": "It contains no local optima", "B": "All neighbours are worse even though a better region lies diagonally ahead", "C": "The state space is finite", "D": "The fitness function is undefined there"}, "ans": "B", "exp": "Single-step moves cannot follow the ridge efficiently."}, {"id": 690, "q": "Random-restart hill climbing improves results by:", "options": {"A": "Never accepting worse moves", "B": "Removing the objective function", "C": "Running the search repeatedly from different random initial states", "D": "Increasing the step size indefinitely"}, "ans": "C", "exp": "It is \"trivially complete\" given enough restarts."}, {"id": 691, "q": "Simulated annealing is inspired by:", "options": {"A": "The cooling and crystallisation of metals", "B": "Bird flocking", "C": "Neural signal propagation", "D": "Immune system response"}, "ans": "A", "exp": "Kirkpatrick et al. adapted the Metropolis algorithm, 1983."}, {"id": 692, "q": "In simulated annealing, the temperature parameter controls:", "options": {"A": "The crossover rate", "B": "The probability of accepting a worse solution", "C": "The number of variables", "D": "The size of the population"}, "ans": "B", "exp": "High temperature permits more uphill (worsening) moves."}, {"id": 693, "q": "As the temperature approaches zero, simulated annealing behaves like:", "options": {"A": "Greedy hill climbing", "B": "A genetic algorithm", "C": "Breadth-first search", "D": "Pure random search"}, "ans": "A", "exp": "Only improving moves are accepted."}, {"id": 694, "q": "Beam search with width k maintains:", "options": {"A": "Only terminal states", "B": "The k best states at each level", "C": "One state at a time", "D": "All generated states"}, "ans": "B", "exp": "It trades completeness for bounded memory."}, {"id": 695, "q": "Stochastic beam search differs from local beam search by:", "options": {"A": "Ignoring the objective function", "B": "Using a single beam of width one", "C": "Choosing successors with probability proportional to their value", "D": "Always taking the k best successors deterministically"}, "ans": "C", "exp": "This resembles natural selection and preserves diversity."}, {"id": 696, "q": "Tabu search improves on local search by:", "options": {"A": "Accepting only improving moves", "B": "Keeping a memory of recently visited solutions that are temporarily forbidden", "C": "Restricting the search to one iteration", "D": "Removing the neighbourhood function"}, "ans": "B", "exp": "The tabu list prevents cycling back into local optima."}, {"id": 697, "q": "Particle Swarm Optimisation (PSO) is modelled on:", "options": {"A": "Bacterial reproduction", "B": "Ant pheromone trails", "C": "Genetic crossover", "D": "The social behaviour of bird flocks and fish schools"}, "ans": "D", "exp": "Proposed by Kennedy and Eberhart, 1995."}, {"id": 698, "q": "In PSO, each particle updates its velocity using:", "options": {"A": "The fitness of the worst particle only", "B": "Crossover with another particle", "C": "A fixed predetermined path", "D": "Its own best position and the swarm's best position"}, "ans": "D", "exp": "Denoted pbest (cognitive) and gbest (social) components."}, {"id": 699, "q": "The inertia weight in PSO governs:", "options": {"A": "The balance between exploration and exploitation", "B": "The stopping criterion", "C": "The number of particles", "D": "The dimensionality of the problem"}, "ans": "A", "exp": "Decreasing it over time shifts the swarm toward exploitation."}, {"id": 700, "q": "Ant Colony Optimisation (ACO) uses which mechanism for indirect communication?", "options": {"A": "Direct message passing between ants", "B": "Genetic crossover between ants", "C": "Pheromone deposition on the paths taken", "D": "A shared neural network"}, "ans": "C", "exp": "This indirect coordination through the environment is called stigmergy."}, {"id": 701, "q": "Pheromone evaporation in ACO is important because it:", "options": {"A": "Prevents premature convergence to early suboptimal paths", "B": "Eliminates the objective function", "C": "Speeds up the ants' movement", "D": "Increases the number of ants"}, "ans": "A", "exp": "It lets the colony forget stale information."}, {"id": 702, "q": "ACO was originally applied with notable success to the:", "options": {"A": "Sorting problem", "B": "Image classification problem", "C": "Travelling Salesman Problem", "D": "Speech recognition problem"}, "ans": "C", "exp": "Dorigo's Ant System, 1992."}, {"id": 703, "q": "Artificial Bee Colony (ABC) optimisation divides its agents into:", "options": {"A": "Workers and managers", "B": "Encoders and decoders", "C": "Predators and prey", "D": "Employed, onlooker and scout bees"}, "ans": "D", "exp": "Scouts provide the random exploration component."}, {"id": 704, "q": "Differential Evolution generates new candidates by:", "options": {"A": "Sorting the population alphabetically", "B": "Averaging the entire population", "C": "Applying backpropagation", "D": "Adding the weighted difference of two population vectors to a third"}, "ans": "D", "exp": "It is a strong performer on continuous optimisation problems."}, {"id": 705, "q": "Multi-objective optimisation seeks solutions that are:", "options": {"A": "Independent of the constraints", "B": "Pareto-optimal — not dominated on all objectives simultaneously", "C": "Always unique", "D": "Optimal on a single combined score only"}, "ans": "B", "exp": "The trade-off surface is called the Pareto front."}, {"id": 706, "q": "A solution X dominates solution Y in Pareto terms when X is:", "options": {"A": "Worse on one objective only", "B": "Better on at least one objective and no worse on any other", "C": "Better on every objective without exception", "D": "Randomly selected first"}, "ans": "B", "exp": "Non-dominated solutions form the Pareto set."}, {"id": 707, "q": "NSGA-II is a well-known algorithm for:", "options": {"A": "Multi-objective evolutionary optimisation", "B": "Database indexing", "C": "Speech synthesis", "D": "Convolutional image classification"}, "ans": "A", "exp": "It uses fast non-dominated sorting and crowding distance."}, {"id": 708, "q": "Gradient descent updates parameters in the direction of:", "options": {"A": "The negative gradient of the loss", "B": "The second derivative only", "C": "A random vector", "D": "The positive gradient of the loss"}, "ans": "A", "exp": "Moving downhill on the loss surface."}, {"id": 709, "q": "A learning rate that is too large typically causes:", "options": {"A": "Zero gradient values", "B": "Very slow but steady convergence", "C": "Oscillation or divergence of the loss", "D": "Guaranteed global optimality"}, "ans": "C", "exp": "The updates overshoot the minimum."}, {"id": 710, "q": "Stochastic gradient descent differs from batch gradient descent by:", "options": {"A": "Using one sample or a minibatch per update instead of the full dataset", "B": "Never updating the parameters", "C": "Being deterministic", "D": "Requiring second-order derivatives"}, "ans": "A", "exp": "Noisier updates, but far cheaper and often better at escaping shallow minima."}, {"id": 711, "q": "Momentum in gradient descent helps by:", "options": {"A": "Reducing the number of parameters", "B": "Randomising the loss function", "C": "Accumulating a velocity term that smooths and accelerates progress", "D": "Enforcing sparsity"}, "ans": "C", "exp": "It damps oscillation across steep, narrow ravines."}, {"id": 712, "q": "The Adam optimiser combines:", "options": {"A": "L1 and L2 regularisation", "B": "Genetic crossover with mutation", "C": "Momentum with per-parameter adaptive learning rates", "D": "Simulated annealing with tabu search"}, "ans": "C", "exp": "It maintains running estimates of the first and second gradient moments."}, {"id": 713, "q": "RMSProp adapts the learning rate using:", "options": {"A": "The population fitness", "B": "The exact Hessian matrix", "C": "A fixed schedule only", "D": "An exponentially decaying average of squared gradients"}, "ans": "D", "exp": "It normalises step size per parameter."}, {"id": 714, "q": "Newton's method for optimisation uses which additional information?", "options": {"A": "The population variance", "B": "Second-order derivatives (the Hessian)", "C": "Only the function value", "D": "The pheromone matrix"}, "ans": "B", "exp": "Faster convergence, but the Hessian is expensive in high dimensions."}, {"id": 715, "q": "A convex optimisation problem is desirable because:", "options": {"A": "It has no minimum at all", "B": "It requires no objective function", "C": "Any local minimum is also the global minimum", "D": "Gradients are undefined"}, "ans": "C", "exp": "This guarantee is why convexity is prized in classical ML."}, {"id": 716, "q": "Constraint satisfaction problems (CSPs) are defined by:", "options": {"A": "Weights, biases and activations", "B": "Chromosomes and fitness", "C": "States, actions and rewards", "D": "Variables, domains and constraints"}, "ans": "D", "exp": "Map colouring and Sudoku are canonical examples."}, {"id": 717, "q": "Arc consistency (AC-3) in CSP solving works by:", "options": {"A": "Removing domain values that cannot satisfy a binary constraint", "B": "Randomly assigning all variables", "C": "Backtracking without pruning", "D": "Adding new constraints"}, "ans": "A", "exp": "A form of constraint propagation that shrinks the search space."}, {"id": 718, "q": "The minimum-remaining-values (MRV) heuristic selects the variable with:", "options": {"A": "The most legal values left", "B": "The fewest legal values left", "C": "The lowest index", "D": "The highest degree only"}, "ans": "B", "exp": "Also called the \"most constrained variable\" heuristic — fail fast."}, {"id": 719, "q": "The least-constraining-value heuristic chooses the value that:", "options": {"A": "Was tried most recently", "B": "Is numerically largest", "C": "Eliminates the most neighbours' options", "D": "Rules out the fewest options for neighbouring variables"}, "ans": "D", "exp": "It keeps maximum flexibility for the rest of the assignment."}, {"id": 720, "q": "Backjumping improves on chronological backtracking by:", "options": {"A": "Never backtracking at all", "B": "Randomising the variable order", "C": "Restarting the search from scratch", "D": "Jumping back to the variable actually responsible for the conflict"}, "ans": "D", "exp": "It skips irrelevant intermediate variables."}, {"id": 721, "q": "Linear programming problems are characterised by:", "options": {"A": "Quadratic constraints only", "B": "A linear objective function and linear constraints", "C": "Non-differentiable objectives", "D": "Discrete chromosomes"}, "ans": "B", "exp": "Solvable by the simplex or interior-point methods."}, {"id": 722, "q": "The No Free Lunch theorem for optimisation states that:", "options": {"A": "Averaged over all possible problems, all algorithms perform equally", "B": "Gradient methods always beat evolutionary methods", "C": "One algorithm is universally best on all problems", "D": "Optimisation is always intractable"}, "ans": "A", "exp": "Wolpert and Macready, 1997 — algorithm choice must match the problem."}, {"id": 723, "q": "Memetic algorithms combine evolutionary search with:", "options": {"A": "Removal of the fitness function", "B": "Purely random mutation", "C": "Depth-first tree search", "D": "A local search refinement step on individuals"}, "ans": "D", "exp": "Sometimes described as GAs with individual \"learning\"."}, {"id": 724, "q": "Bayesian optimisation is particularly suited to:", "options": {"A": "Sorting large arrays", "B": "Expensive black-box objective functions such as hyperparameter tuning", "C": "Problems with millions of cheap evaluations", "D": "Problems with exact gradients available"}, "ans": "B", "exp": "A surrogate model plus an acquisition function chooses each next evaluation."}, {"id": 725, "q": "Neural Architecture Search (NAS) automates:", "options": {"A": "The choice of programming language", "B": "The design of network topologies and layer configurations", "C": "The labelling of the training data", "D": "The deployment hardware only"}, "ans": "B", "exp": "Approaches include RL-based, evolutionary and differentiable (DARTS) search. Part 20: AI Ethics, Bias, Fairness & Governance (Q726–775)"}, {"id": 726, "q": "Algorithmic bias in AI systems most often originates from:", "options": {"A": "The programming language used", "B": "The mathematics of gradient descent", "C": "Biased or unrepresentative training data and design choices", "D": "Insufficient processor speed"}, "ans": "C", "exp": "Models reproduce and can amplify the patterns present in their data."}, {"id": 727, "q": "Historical bias refers to bias that:", "options": {"A": "Is introduced only during model deployment", "B": "Already exists in the world and is faithfully captured by the data", "C": "Only affects image models", "D": "Arises from floating-point rounding"}, "ans": "B", "exp": "The data is accurate but reflects an unjust status quo."}, {"id": 728, "q": "Representation bias occurs when:", "options": {"A": "The model has too many parameters", "B": "Labels are perfectly balanced", "C": "The learning rate is too high", "D": "Certain groups are under-sampled in the training data"}, "ans": "D", "exp": "Performance then degrades for the under-represented group."}, {"id": 729, "q": "Measurement bias arises when:", "options": {"A": "The model is open source", "B": "Training takes too long", "C": "A proxy variable imperfectly captures the construct of interest", "D": "The test set is too large"}, "ans": "C", "exp": "For example, using arrest rates as a proxy for crime rates."}, {"id": 730, "q": "The COMPAS recidivism tool became a landmark case study because it:", "options": {"A": "Showed unequal false-positive rates across racial groups", "B": "Was never deployed", "C": "Achieved perfect accuracy", "D": "Used no data at all"}, "ans": "A", "exp": "ProPublica's 2016 investigation sparked the fairness literature."}, {"id": 731, "q": "Demographic parity as a fairness criterion requires that:", "options": {"A": "All individuals receive the same outcome", "B": "Positive prediction rates are equal across groups", "C": "Accuracy is equal across groups", "D": "The model uses no features"}, "ans": "B", "exp": "Also called statistical parity or independence."}, {"id": 732, "q": "Equalised odds requires equal:", "options": {"A": "Numbers of training samples per group", "B": "Prediction latency across groups", "C": "Model parameters per group", "D": "True-positive and false-positive rates across groups"}, "ans": "D", "exp": "A separation-based fairness criterion."}, {"id": 733, "q": "Equal opportunity is a relaxation of equalised odds requi
